        <div class="card" style="--c:var(--a-dog)"><div class="stat"><div class="k">Lessons this month</div><div class="v">${thisMonth.filter(s=>s.date<=todayISO()).length}</div><div class="m">${sess.filter(s=>s.date<=todayISO()).length} in total, all time</div></div></div>
        <div class="card" style="--c:var(--a-dog)"><div class="stat"><div class="k">Dogs on the books</div><div class="v">${(S.ref.dog.clients||[]).filter(c=>c.active!==false).length}</div><div class="m">${(S.ref.dog.clients||[]).length} recorded in total</div></div></div>
        <div class="card" style="--c:${owed?'var(--warn)':'var(--a-dog)'}"><div class="stat"><div class="k">Waiting to be invoiced</div>
          <div class="v" style="color:${owed?'var(--warn)':'inherit'}">${R0(owed)}</div><div class="m">${unbilled.length} session${unbilled.length===1?'':'s'}${enUnbilled.length ? ' · ' + enUnbilled.length + ' class payment' + (enUnbilled.length===1?'':'s') : ''}</div></div></div>
      </div>`
    + tabs('dog', [['schedule','Schedule'],['clients','Bookings & dogs'],['courses','Group courses'],['invoice','Invoicing'],['pup','My dogs']])
    + body();
}
function dogSchedule(){
  const sess = across('sessions').sort((a,b) => (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));

      <div class="spread" style="margin-bottom:4px"><h3>Past sessions</h3><span class="tiny dim">${totalPast} of ${sess.filter(x=>x.date<todayISO()).length}</span></div>

      </div>
      ${past.length ? past.map(line).join('') : `<div class="empty">${totalPast === 0 && sess.length ? 'Nothing matches those filters.' : 'No history yet.'}</div>`}
      ${!f.all && totalPast > 25 ? `<hr class="rule"><button class="btn ghost sm" data-act="sessall">Show all ${totalPast}</button>` : ''}

function classDates(c, from, to){
  if (!c || c.dow == null) return [];
  const start = from || shift(todayISO(), -84), end = to || shift(todayISO(), 56);
  const out = []; let d = start;
  const w = toD(d).getDay();
  d = shift(d, (num(c.dow) - w + 7) % 7);
  while (d <= end) { out.push(d); d = shift(d, 7); }
  return out;
}
/* the class night on or before a date, and the next one */
function lastClassDate(c, on){
  const t = on || todayISO(); const d = toD(t);
  return shift(t, -(((d.getDay() - num(c.dow)) + 7) % 7));
}
function nextClassDate(c, on){
  const t = on || todayISO(); const d = toD(t);
  return shift(t, ((num(c.dow) - d.getDay()) + 7) % 7);
}
const attRecs = () => across('classAtt');
const isPresent = (d, courseId, enrolId) => attRecs().some(a => a.date === d && a.courseId === courseId && a.enrolId === enrolId && a.present);
/* how many classes this dog has attended, up to and including a date */
function attendedBy(enrolId, upto){
  const en = (S.ref.dog.enrols || []).find(x => x.id === enrolId);
  const from = en && en.resetAt;
  return attRecs().filter(a => a.enrolId === enrolId && a.present
    && (!upto || a.date <= upto) && (!from || a.date >= from)).length;
}
/* the lesson this dog is on for a given night — its own progress, not the class's */
function lessonNo(en, date){
  const before = attendedBy(en.id, date ? shift(date, -1) : null);
  return num(en.startLesson || 1) + before;
}
const attCount = (c, enrolId) => attendedBy(enrolId);
/* lessons bought, minus lessons used */
function paidBalance(en){
  const bought = (S.ref.dog.blocks || []).filter(b => b.enrolId === en.id && b.kind !== 'month').reduce((a,b) => a + num(b.lessons), 0);
  const used = attendedBy(en.id);
  return { bought, used, left: bought - used };
}
/* monthly classes charge a standing amount per calendar month instead */
const monthsCharged = enId => (S.ref.dog.blocks || []).filter(b => b.enrolId === enId && b.kind === 'month').map(b => b.month).sort();
const chargedFor = (enId, ym) => (S.ref.dog.blocks || []).some(b => b.enrolId === enId && b.kind === 'month' && b.month === ym);
const isMonthly = c => (c.billing || 'block') === 'monthly';
function progressOf(c, en){
  const n = lessonNo(en);
  const total = num(c.lessons) || 0;
  return { n, total, done: total ? n > total : false, atEnd: total ? n === total : false };
}
/* the block-course shape from the previous version becomes a rolling class */
function migrateClasses(){
  const D = S.ref.dog; let hit = false;
  D.blocks = D.blocks || [];
  (D.courses || []).forEach(c => {
    if (c.dow == null) {
      c.dow = c.start ? toD(c.start).getDay() : 2;
      c.lessons = num(c.lessons) || num(c.weeks) || 6;
      c.blockSize = num(c.blockSize) || c.lessons;
      c.blockFee = num(c.blockFee) || num(c.fee) || 0;
      c.billing = c.billing || 'block';
      delete c.weeks; hit = true;
    }
  });
  (D.enrols || []).forEach(en => {
    if (en.joined == null) {
      const c = (D.courses || []).find(x => x.id === en.courseId);
      en.joined = (c && c.start) || todayISO();
      en.startLesson = num(en.startLesson) || 1;
      en.active = en.active !== false;
      hit = true;
    }
    /* a fee recorded against the enrolment becomes its first paid block */
    if (num(en.fee) && !(D.blocks || []).some(b => b.enrolId === en.id)) {
      const c = (D.courses || []).find(x => x.id === en.courseId);
      D.blocks.push({ id: uid(), enrolId: en.id, date: en.joined || todayISO(),
        lessons: (c && num(c.blockSize)) || 6, fee: num(en.fee), inv: invOf(en), paid: paidOf(en) });
      delete en.fee; hit = true;
    }
  });
  if (hit) saveRef('dog');
}

function dogPup(){
  const dogs = S.ref.dog.mydogs || [];
  const pick = dogs.find(d => d.id === S.myDog) || dogs[0];
  const logs = across('pupp').filter(l => !pick || !l.dogId || l.dogId === pick.id || dogs.length === 1)
    .filter(l => !pick || !l.dogId ? true : l.dogId === pick.id)
    .sort((a,b) => b.date.localeCompare(a.date));
  const skills = [...new Set(logs.map(l => l.skill).filter(Boolean))];
  const last14 = Array.from({length:14}, (_,i) => shift(todayISO(), -13+i));
  const has = new Set(logs.map(l => l.date));
  const sel = S.pickSkill && skills.includes(S.pickSkill) ? S.pickSkill : skills[0];
  const series = logs.filter(l => l.skill === sel).slice().reverse();
  return `<div class="card" style="--c:var(--a-dog);margin-bottom:16px">
      <div class="spread" style="align-items:flex-start">
        <div><h3>Your own dogs</h3><div class="note" style="margin-bottom:0">Separate from client work. Pick a dog to see and log its training.</div></div>
        <button class="btn tint" style="--c:var(--a-dog)" data-act="mydog+">Add a dog</button></div>
      ${dogs.length ? `<div class="row" style="margin-top:12px">${dogs.map(d => `
        <button class="btn ${pick && d.id === pick.id ? '' : 'ghost'} sm" data-act="mydogpick" data-id="${d.id}">${esc(d.name)}</button>`).join('')}
        ${pick ? `<button class="btn ghost sm" data-act="mydogedit" data-id="${pick.id}">Edit ${esc(pick.name)}</button>
                  <button class="x" data-act="mydog-" data-id="${pick.id}">&times;</button>` : ''}</div>` : ''}
    </div>
    ${!dogs.length ? `<div class="card"><div class="empty">No dogs added yet. Add one and its training log lives here.</div></div>` : `
    <div class="grid g2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
      <div class="card" style="--c:var(--a-dog)">
        <div class="spread" style="margin-bottom:10px"><h3>Training ${esc(pick.name)}</h3>
          <button class="btn tint sm" style="--c:var(--a-dog)" data-act="pup+">Log a session</button></div>
        <div class="note" style="margin-top:-6px">Short sessions, rated 1–5. The pattern matters more than any single day.</div>
        <div class="streak" style="--c:var(--a-dog);margin-bottom:14px">${last14.map(d => `<i class="${has.has(d)?'on':''} ${d===todayISO()?'today':''}" title="${esc(fmtDay(d))}"></i>`).join('')}</div>
        ${logs.length ? (S.pupAll ? logs : logs.slice(0,25)).map(l => `<div class="item"><div class="body">
            <div class="spread"><div class="t">${esc(l.skill || 'Training')}</div><span class="tiny dim mono">${esc(fmtDay(l.date))}</span></div>
            <div class="s">${l.mins ? esc(String(l.mins)) + ' min · ' : ''}${l.rating ? '★'.repeat(clamp(+l.rating,0,5)) + '☆'.repeat(5-clamp(+l.rating,0,5)) : ''}</div>
            ${l.notes ? `<div class="s" style="margin-top:2px">${esc(l.notes)}</div>` : ''}</div>
          <button class="x" data-act="pup-" data-id="${l.id}" data-d="${l.date}">&times;</button></div>`).join('')
          : `<div class="empty">Nothing logged for ${esc(pick.name)} yet.</div>`}
        ${!S.pupAll && logs.length > 25 ? `<hr class="rule"><button class="btn ghost sm" data-act="pupall">Show all ${logs.length}</button>` : ''}
      </div>
      <div class="card">
        <div class="spread" style="margin-bottom:10px"><h3>Skill progress</h3>
          ${skills.length ? `<select style="width:auto;min-width:140px" data-act="pickskill">${skills.map(x => `<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}</select>` : ''}</div>
        ${series.length > 1 ? `<div class="lbl" style="margin-bottom:4px">How it's going, 1–5</div>${spark(series.map(x=>num(x.rating)), 'var(--a-dog)', 80)}
          <hr class="rule"><div class="spread"><span class="dim tiny">Sessions on ${esc(sel)}</span><span class="num">${series.length}</span></div>
          <div class="spread"><span class="dim tiny">Total time</span><span class="num">${series.reduce((a,x)=>a+num(x.mins),0)} min</span></div>`
          : `<div class="empty">Log the same skill a few times and its trend appears here.</div>`}
        <hr class="rule">
        <div class="lbl" style="margin-bottom:6px">Skills you're working</div>
        <div class="row">${skills.length ? skills.map(x => `<span class="chip out">${esc(x)}</span>`).join('') : '<span class="empty">none yet</span>'}</div>
      </div>
    </div>`}`;
}

/* ============================================================
   MONEY — budget vs actual, the ledger, bills, goals
   ============================================================ */
function viewMoney(){
  const t = curTab('money','overview');
  const body = {overview: moneyOverview, ledger: moneyLedger, bills: moneyBills, goals: moneyGoals}[t];
  const ym = S.ym || ymOf(todayISO());
  const m = S.months[ym] || blankMonth();
  const out = (m.tx||[]).filter(t => t.kind !== 'in').reduce((a,t)=>a+num(t.amount),0);
  const inc = (m.tx||[]).filter(t => t.kind === 'in').reduce((a,t)=>a+num(t.amount),0);
  const budget = (S.ref.money.cats||[]).reduce((a,c)=>a+num(c.budget),0);
  return head('money', 'Money', 'All figures in Rands. Nothing here talks to a bank — you tell it what happened.',
      `<button class="btn ghost sm" data-act="mon" data-v="-1">←</button>
       <span class="mono" style="font-weight:600;min-width:118px;text-align:center">${esc(fmtMonth(ym))}</span>
       <button class="btn ghost sm" data-act="mon" data-v="1">→</button>
       <button class="btn tint" style="--c:var(--a-money)" data-act="tx+">Add entry</button>`)
    + `<div class="grid g4" style="margin-bottom:16px">
        <div class="card" style="--c:var(--a-money)"><div class="stat"><div class="k">Spent</div><div class="v">${R0(out)}</div>
          <div class="m">${budget ? 'of ' + R0(budget) + ' budgeted' : 'no budget set'}</div></div></div>
        <div class="card"><div class="stat"><div class="k">In</div><div class="v" style="color:var(--ok)">${R0(inc)}</div><div class="m">income recorded</div></div></div>
        <div class="card"><div class="stat"><div class="k">Net</div><div class="v" style="color:${inc-out>=0?'var(--ok)':'var(--bad)'}">${R0(inc-out)}</div><div class="m">this month</div></div></div>
        <div class="card"><div class="stat"><div class="k">Budget left</div>
          <div class="v" style="color:${budget-out<0?'var(--bad)':'inherit'}">${budget ? R0(budget-out) : '—'}</div>
          <div class="m">${budget ? Math.round(out/budget*100) + '% used' : 'set budgets on Overview'}</div></div></div>
      </div>`
    + tabs('money', [['overview','Budget vs actual'],['ledger','Ledger & export'],['bills','Recurring bills'],['goals','Savings goals']])
    + body(ym, m);
}
function moneyOverview(ym, m){
  const cats = S.ref.money.cats || [];
  const spentBy = {};
  (m.tx||[]).filter(t => t.kind !== 'in').forEach(t => { spentBy[t.cat] = (spentBy[t.cat]||0) + num(t.amount); });
  const uncat = (m.tx||[]).filter(t => t.kind !== 'in' && !cats.find(c => c.id === t.cat)).reduce((a,t)=>a+num(t.amount),0);
  const hist = monthKeys().slice(-6).map(k => ({k: MON[+k.slice(5,7)-1].slice(0,3), v: (S.months[k].tx||[]).filter(t=>t.kind!=='in').reduce((a,t)=>a+num(t.amount),0)}));
  return `<div class="grid g2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">
    <div class="card" style="--c:var(--a-money)">
      <div class="spread" style="margin-bottom:4px"><h3>Where it went</h3>
        <button class="btn ghost sm" data-act="budgetedit">${S.budgetOpen ? 'Done' : 'Set up budget'}</button></div>
      ${S.budgetOpen ? `<div class="note">Type straight into the table — everything saves as you go. Add a row for each thing you want to watch.</div>
        <div class="tw"><table><thead><tr><th>Category</th><th class="n">Monthly budget (R)</th><th></th></tr></thead><tbody>
          ${cats.map(c => `<tr>
            <td><input type="text" value="${esc(c.name)}" data-cat="${c.id}" data-k="name" placeholder="Groceries"></td>
            <td class="n"><input type="number" step="any" value="${esc(c.budget == null ? '' : c.budget)}" data-cat="${c.id}" data-k="budget" placeholder="0"></td>
            <td class="n"><button class="x" data-act="cat-" data-id="${c.id}">&times;</button></td></tr>`).join('')}
        </tbody><tfoot><tr><td style="border-top:2px solid var(--line-2)"><b>Total budgeted</b></td>
          <td class="n" style="border-top:2px solid var(--line-2)"><b>${R0(cats.reduce((a,c)=>a+num(c.budget),0))}</b></td><td style="border-top:2px solid var(--line-2)"></td></tr></tfoot></table></div>
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <button class="btn sm" data-act="cat+">Add a row</button>
          <span class="tiny" style="color:var(--ok)">✓ Saved automatically — ${cats.length} categor${cats.length===1?'y':'ies'}, ${R0(cats.reduce((a,c)=>a+num(c.budget),0))} a month</span></div>
        ${!cats.length ? `<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="catseed">Start me off with the usual ones</button></div>` : ''}
        <hr class="rule">` : ''}
      ${cats.length ? cats.map(c => {
        const s = spentBy[c.id] || 0, b = num(c.budget), pct = b ? clamp(s/b*100, 0, 100) : 0, over = b && s > b;
        return `<div style="padding:9px 0;border-top:1px solid var(--line)">
          <div class="spread" style="margin-bottom:5px">
            <span class="row" style="gap:8px"><b>${esc(c.name)}</b>
              <button class="x" data-act="catedit" data-id="${c.id}" style="font-size:12px;color:var(--faint)">edit</button></span>
            <span class="num tiny" style="color:${over?'var(--bad)':'var(--muted)'}">${R0(s)}${b ? ' / ' + R0(b) : ''}${over ? ' · over by ' + R0(s-b) : ''}</span></div>
          <div class="bar" style="--c:${over?'var(--bad)':'var(--a-money)'}"><i style="width:${b?pct:0}%"></i></div></div>`;
      }).join('') : `<div class="empty">No categories yet. Press <b>Set up budget</b> above — you can add them all in one table.</div>`}
      ${uncat ? `<div style="padding:9px 0;border-top:1px solid var(--line)"><div class="spread"><span class="dim">Uncategorised</span><span class="num tiny">${R0(uncat)}</span></div></div>` : ''}
    </div>
    <div class="stack">
      <div class="card"><h3>Six-month trend</h3><div class="note">Total spend per month</div>
        ${bars(hist, 'var(--a-money)', 100)}</div>
      <div class="card"><h3>Coming up this month</h3><div class="note">Recurring bills still ahead</div>
        ${(() => {
          const dom = new Date().getDate();
          const due = (S.ref.money.bills||[]).filter(b => b.active !== false && +b.day >= dom).sort((a,b)=>a.day-b.day);
          return due.length ? due.map(b => `<div class="spread" style="padding:5px 0"><span>${esc(b.name)} <span class="dim tiny">· ${b.day}${['th','st','nd','rd'][(b.day%10>3||[11,12,13].includes(+b.day))?0:b.day%10]}</span></span><span class="num">${R0(b.amount)}</span></div>`).join('')
            + `<hr class="rule"><div class="spread"><b>Still to go out</b><b class="num">${R0(due.reduce((a,b)=>a+num(b.amount),0))}</b></div>`
            : `<div class="empty">Nothing left this month.</div>`;
        })()}
      </div>
    </div>
  </div>`;
}
function moneyLedger(ym, m){
  const cats = S.ref.money.cats || [];
  const tx = (m.tx||[]).slice().sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  return `<div class="card" style="--c:var(--a-money)">
    <div class="spread" style="margin-bottom:10px"><div><h3>Ledger — ${esc(fmtMonth(ym))}</h3>
      <div class="note" style="margin-bottom:0">${tx.length} entr${tx.length===1?'y':'ies'}. Export gives your accountant a plain CSV they can open anywhere.</div></div>
      <div class="row"><button class="btn ghost sm" data-act="csvmonth" data-v="${ym}">Export this month</button>
        <button class="btn ghost sm" data-act="csvall">Export everything</button></div></div>
    ${(() => { const q = S.ref.money.quick || [];
      const freq = {};
      across('tx').filter(x => x.kind !== 'in' && x.note).forEach(x => { const k = x.note.trim().toLowerCase();
        if (!freq[k]) freq[k] = { note:x.note.trim(), cat:x.cat, method:x.method, n:0, amt:x.amount };
        freq[k].n++; });
      const sug = Object.values(freq).filter(f => f.n >= 3 && !q.some(x => x.note.toLowerCase() === f.note.toLowerCase()))
        .sort((a,b) => b.n - a.n).slice(0, 4);
      if (!q.length && !sug.length) return `<div class="tiny dim" style="margin-bottom:12px">Record the same thing three times and it'll offer itself here as a one-tap entry.</div>`;
      return `<div class="lbl" style="margin-bottom:7px">One tap</div>
        <div class="qa" style="margin-bottom:14px">
          ${q.map(x => `<button data-act="quicktx" data-id="${x.id}" style="--c:var(--a-money)">${esc(x.note)} · ${R0(x.amount)}
            <span class="x" data-act="quick-" data-id="${x.id}" style="font-size:12px;margin-left:2px">&times;</span></button>`).join('')}
          ${sug.map(f => `<button data-act="quickadd" data-v="${esc(f.note)}" style="--c:var(--faint)">+ save "${esc(f.note)}" as a one-tap entry</button>`).join('')}
        </div>`;
    })()}
    ${tx.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Method</th><th class="n">Out</th><th class="n">In</th><th></th></tr></thead><tbody>
      ${tx.map(t => `<tr>
        <td class="mono" style="white-space:nowrap">${esc(t.date.slice(8))} ${esc(MON[+t.date.slice(5,7)-1].slice(0,3))}</td>
        <td>${esc(t.note || '—')}</td>
        <td>${t.kind === 'in' ? '<span class="dim">income</span>' : esc(nameOf(cats, t.cat) || '—')}</td>
        <td class="dim tiny">${esc(t.method || '')}</td>
        <td class="n">${t.kind === 'in' ? '' : R(t.amount)}</td>
        <td class="n" style="color:var(--ok)">${t.kind === 'in' ? R(t.amount) : ''}</td>
        <td class="n"><button class="x" data-act="tx-" data-id="${t.id}" data-d="${t.date}">&times;</button></td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="4" style="border-top:2px solid var(--line-2)"><b>Totals</b></td>
      <td class="n" style="border-top:2px solid var(--line-2)"><b>${R(tx.filter(t=>t.kind!=='in').reduce((a,t)=>a+num(t.amount),0))}</b></td>
      <td class="n" style="border-top:2px solid var(--line-2);color:var(--ok)"><b>${R(tx.filter(t=>t.kind==='in').reduce((a,t)=>a+num(t.amount),0))}</b></td><td></td></tr></tfoot></table></div>`
      : `<div class="empty">Nothing recorded for ${esc(fmtMonth(ym))}.</div>`}
  </div>`;
}
function moneyBills(){
  const bs = (S.ref.money.bills||[]).slice().sort((a,b)=>num(a.day)-num(b.day));
  const total = bs.filter(b=>b.active!==false).reduce((a,b)=>a+num(b.amount),0);
  const dom = new Date().getDate();
  return `<div class="card" style="--c:var(--a-money)">
    <div class="spread" style="margin-bottom:10px"><div><h3>Fixed monthly commitments</h3>
      <div class="note" style="margin-bottom:0">${R(total)} a month across ${bs.filter(b=>b.active!==false).length} active bill${bs.filter(b=>b.active!==false).length===1?'':'s'}.</div></div>
      <button class="btn sm tint" style="--c:var(--a-money)" data-act="bill+">Add bill</button></div>
    ${bs.length ? bs.map(b => {
      const past = +b.day < dom;
      return `<div class="item ${b.active===false?'done':''}">
        <div style="width:44px;flex:none;text-align:center">
          <div class="num" style="font-size:19px;color:${b.active===false?'var(--faint)':(past?'var(--faint)':'var(--ink)')}">${esc(String(b.day))}</div>
          <div class="lbl" style="font-size:9px">${past?'passed':'due'}</div></div>
        <div class="body"><div class="spread"><div class="t">${esc(b.name)}</div><div class="num">${R(b.amount)}</div></div>
          <div class="s">${esc(b.note || '')}${b.active===false ? ' · paused' : ''}</div></div>
        <button class="btn ghost sm" data-act="billedit" data-id="${b.id}">Edit</button>
        <button class="x" data-act="bill-" data-id="${b.id}">&times;</button></div>`;
    }).join('') : `<div class="empty">No recurring bills recorded yet.</div>`}
  </div>`;
}
function moneyGoals(){
  const gs = S.ref.money.goals || [];
  return `<div class="card" style="--c:var(--a-money)">
    <div class="spread" style="margin-bottom:10px"><h3>Savings goals</h3><button class="btn sm tint" style="--c:var(--a-money)" data-act="goal+">Add goal</button></div>
    <div class="note" style="margin-top:-6px">Update the "put away" figure whenever you move money. Nothing is connected to a bank.</div>
    ${gs.length ? gs.map(g => {
      const pct = num(g.target) ? clamp(num(g.saved)/num(g.target)*100, 0, 100) : 0;
      return `<div style="padding:12px 0;border-top:1px solid var(--line)">
        <div class="spread" style="margin-bottom:6px">
          <div><b>${esc(g.name)}</b>${g.by ? ` <span class="dim tiny">by ${esc(fmtDay(g.by))}</span>` : ''}
            ${g.note ? `<div class="s dim tiny">${esc(g.note)}</div>` : ''}</div>
          <div class="row"><span class="num">${R0(g.saved)} <span class="dim">/ ${R0(g.target)}</span></span>
            <button class="btn ghost sm" data-act="goaledit" data-id="${g.id}">Edit</button>
            <button class="x" data-act="goal-" data-id="${g.id}">&times;</button></div></div>
        <div class="bar" style="--c:var(--a-money)"><i style="width:${pct}%"></i></div>
        <div class="tiny dim" style="margin-top:4px">${pct.toFixed(0)}% there${num(g.target)>num(g.saved) ? ' · ' + R0(num(g.target)-num(g.saved)) + ' to go' : ' · done'}</div></div>`;
    }).join('') : `<div class="empty">No goals yet.</div>`}
  </div>`;
}

/* ============================================================
   HOBBIES — practice, projects, learning, and research
   ============================================================ */
function viewPlay(){
  const t = curTab('play','practice');
  const body = {practice: playPractice, projects: playProjects, learning: playLearning, research: playResearch}[t];
  const pr = across('practice');
  const last30 = pr.filter(p => p.date >= shift(todayISO(), -29));
  const mins = last30.reduce((a,p)=>a+num(p.mins),0);
  return head('play', 'Hobbies & Interests', 'The part of the week that gets crowded out unless something is keeping score.',
      `<button class="btn tint" style="--c:var(--a-play)" data-act="practice+">Log practice</button>`)
    + `<div class="grid g4" style="margin-bottom:16px">
        <div class="card" style="--c:var(--a-play)"><div class="stat"><div class="k">Practice, 30 days</div><div class="v">${(mins/60).toFixed(1)}<span style="font-size:15px;color:var(--faint)"> h</span></div><div class="m">${last30.length} sessions</div></div></div>
        <div class="card" style="--c:var(--a-play)"><div class="stat"><div class="k">Streak</div><div class="v">${streakDays(pr.map(p=>p.date))}</div><div class="m">days in a row</div></div></div>
        <div class="card" style="--c:var(--a-play)"><div class="stat"><div class="k">Projects on the go</div><div class="v">${(S.ref.play.backlog||[]).filter(b=>b.status==='Doing').length}</div><div class="m">${(S.ref.play.backlog||[]).filter(b=>b.status==='Someday').length} on the someday pile</div></div></div>
        <div class="card" style="--c:var(--a-play)"><div class="stat"><div class="k">Learning queue</div><div class="v">${(S.ref.play.learning||[]).filter(l=>l.status!=='Done').length}</div><div class="m">${(S.ref.play.learning||[]).filter(l=>l.status==='Done').length} finished</div></div></div>
      </div>`
    + tabs('play', [['practice','Practice'],['projects','Projects'],['learning','Learning queue'],['research','Research & ideas']])
    + body();
}
function playPractice(){
  const hs = S.ref.play.hobbies || [];
  const pr = across('practice').sort((a,b)=>b.date.localeCompare(a.date));
  const byHobby = hs.map(h => ({h, mins: pr.filter(p=>p.hobbyId===h.id).reduce((a,p)=>a+num(p.mins),0), n: pr.filter(p=>p.hobbyId===h.id).length}));
  const maxM = Math.max(...byHobby.map(b=>b.mins), 1);
  const last30 = Array.from({length:30}, (_,i) => shift(todayISO(), -29+i));
  const has = new Set(pr.map(p=>p.date));
  return `<div class="grid g2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
    <div class="card" style="--c:var(--a-play)">
      <div class="spread" style="margin-bottom:10px"><h3>Practice log</h3><button class="btn sm ghost" data-act="hobby+">Add a hobby</button></div>
      <div class="streak" style="--c:var(--a-play);margin-bottom:14px">${last30.map(d => `<i class="${has.has(d)?'on':''} ${d===todayISO()?'today':''}" title="${esc(fmtDay(d))}"></i>`).join('')}</div>
      ${pr.length ? pr.slice(0,30).map(p => `<div class="item"><div class="body">
          <div class="spread"><div class="t">${esc(nameOf(hs, p.hobbyId) || 'Practice')}</div>
            <span class="row" style="gap:8px"><span class="num tiny">${esc(String(p.mins))} min</span><span class="tiny dim mono">${esc(fmtDay(p.date))}</span></span></div>
          ${p.note ? `<div class="s">${esc(p.note)}</div>` : ''}</div>
        <button class="x" data-act="practice-" data-id="${p.id}" data-d="${p.date}">&times;</button></div>`).join('')
        : `<div class="empty">Nothing logged yet.</div>`}
    </div>
    <div class="card">
      <h3>Time by interest</h3><div class="note">All time, in hours</div>
      ${byHobby.length ? byHobby.sort((a,b)=>b.mins-a.mins).map(b => `
        <div style="padding:8px 0;border-top:1px solid var(--line)">
          <div class="spread" style="margin-bottom:5px"><span class="row" style="gap:8px"><b>${esc(b.h.name)}</b>
            <button class="x" data-act="hobby-" data-id="${b.h.id}" style="font-size:12px">&times;</button></span>
            <span class="num tiny">${(b.mins/60).toFixed(1)} h · ${b.n}×</span></div>
          <div class="bar" style="--c:var(--a-play)"><i style="width:${b.mins/maxM*100}%"></i></div></div>`).join('')
        : `<div class="empty">Add a hobby to start.</div>`}
    </div>
  </div>`;
}
const PSTATUS = ['Someday','Next','Doing','Done'];
function playProjects(){
  const bs = S.ref.play.backlog || [], hs = S.ref.play.hobbies || [];
  return `<div class="card" style="--c:var(--a-play)">
    <div class="spread" style="margin-bottom:10px"><h3>Things you want to make and do</h3><button class="btn sm tint" style="--c:var(--a-play)" data-act="backlog+">Add</button></div>
    <div class="note" style="margin-top:-6px">The point of a someday pile is that ideas stop evaporating. Move one to "Next" when you mean it.</div>
    ${PSTATUS.map(st => { const list = bs.filter(b => (b.status||'Someday') === st); return !list.length ? '' : `
      <div style="margin-top:14px"><div class="lbl" style="margin-bottom:6px">${esc(st)} · ${list.length}</div>
      ${list.map(b => `<div class="item ${st==='Done'?'done':''}"><div class="body">
          <div class="spread"><div class="t">${esc(b.title)}</div>
            <select style="width:auto;font-size:12px;padding:3px 6px" data-act="backlogstatus" data-id="${b.id}">${PSTATUS.map(s => `<option ${s===st?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
          <div class="s">${b.hobbyId ? esc(nameOf(hs, b.hobbyId)) : ''}${b.notes ? (b.hobbyId?' · ':'') + esc(b.notes) : ''}</div></div>
        <button class="x" data-act="backlog-" data-id="${b.id}">&times;</button></div>`).join('')}</div>`; }).join('')
      || `<div class="empty">Nothing on the list yet.</div>`}
  </div>`;
}
const LSTATUS = ['Queued','Reading','Done','Abandoned'];
function playLearning(){
  const ls = S.ref.play.learning || [];
  return `<div class="card" style="--c:var(--a-play)">
    <div class="spread" style="margin-bottom:10px"><h3>Learning queue</h3><button class="btn sm tint" style="--c:var(--a-play)" data-act="learn+">Add</button></div>
    <div class="note" style="margin-top:-6px">Courses, books, papers, tutorials. Anything you meant to get to.</div>
    ${ls.length ? LSTATUS.map(st => { const list = ls.filter(l => (l.status||'Queued') === st); return !list.length ? '' : `
      <div style="margin-top:14px"><div class="lbl" style="margin-bottom:6px">${esc(st)} · ${list.length}</div>
      ${list.map(l => `<div class="item ${st==='Done'||st==='Abandoned'?'done':''}"><div class="body">
        <div class="spread"><div class="t">${esc(l.title)}</div>
          <select style="width:auto;font-size:12px;padding:3px 6px" data-act="learnstatus" data-id="${l.id}">${LSTATUS.map(s=>`<option ${s===st?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
        <div class="s">${esc(l.kind||'')}${l.notes ? (l.kind?' · ':'') + esc(l.notes) : ''}</div></div>
        <button class="x" data-act="learn-" data-id="${l.id}">&times;</button></div>`).join('')}</div>`; }).join('')
      : `<div class="empty">Nothing queued.</div>`}
  </div>`;
}
function playResearch(){
  const rs = (S.ref.play.research||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const hs = S.ref.play.hobbies || [];
  const f = S.resFilter || '';
  const shown = f ? rs.filter(r => r.hobbyId === f) : rs;
  return `<div class="card" style="--c:var(--a-play)">
    <div class="spread" style="margin-bottom:10px"><h3>Research & ideas</h3><button class="btn sm tint" style="--c:var(--a-play)" data-act="research+">Add note</button></div>
    <div class="note" style="margin-top:-6px">For the interests you're actually reading into — conservation, or anything else that turns into a rabbit hole worth keeping.</div>
    ${hs.length ? `<div class="row" style="margin-bottom:12px">
      <button class="btn ${!f?'':'ghost'} sm" data-act="resfilter" data-v="">All</button>
      ${hs.map(h => `<button class="btn ${f===h.id?'':'ghost'} sm" data-act="resfilter" data-v="${h.id}">${esc(h.name)}</button>`).join('')}</div>` : ''}
    ${shown.length ? shown.map(r => `<div class="item"><div class="body">
        <div class="spread"><div class="t">${esc(r.title)}</div><span class="tiny dim mono">${esc(fmtDay(r.date))}</span></div>
        ${r.hobbyId ? `<div class="s"><span class="chip out">${esc(nameOf(hs, r.hobbyId))}</span></div>` : ''}
        ${r.notes ? `<div class="s" style="margin-top:4px;white-space:pre-wrap">${esc(r.notes)}</div>` : ''}
        ${r.link ? `<div class="s mono tiny" style="margin-top:3px;word-break:break-all">${esc(r.link)}</div>` : ''}</div>
      <button class="x" data-act="research-" data-id="${r.id}">&times;</button></div>`).join('')
      : `<div class="empty">No notes yet.</div>`}
  </div>`;
}

<script>
/* ============================================================
   DASHBOARD — the six threads side by side
   ============================================================ */
function viewDash(){
  const t = todayISO(), k = weekKey(t), W = weekRO(k), days = weekDays(t);
  const stat = collectWeek(days);
  const sess = across('sessions'), unbilled = sess.filter(s => !invOf(s));
  const ym = ymOf(t), m = S.months[ym] || blankMonth();
  const spent = (m.tx||[]).filter(x=>x.kind!=='in').reduce((a,x)=>a+num(x.amount),0);
  const budget = (S.ref.money.cats||[]).reduce((a,c)=>a+num(c.budget),0);
  const dom = new Date().getDate();
  const practiceWk = stat.practice;

  /* attention list — every item is a real condition in the data */
  const A = [];
  if (!(W.priorities||[]).length) A.push(['work','No priorities set for this week','Open This Week and name three.','week']);
  (S.ref.work.projects||[]).filter(p => p.status !== 'Done' && p.status !== 'Parked' && !p.next).forEach(p =>
    A.push(['work', `"${p.name}" has no next action`, 'A workstream without one tends to stall.', 'work']));
  (S.ref.work.projects||[]).filter(p => p.status === 'Blocked' || p.status === 'At risk').forEach(p =>
    A.push(['work', `"${p.name}" is ${p.status.toLowerCase()}`, p.notes || 'Needs a decision or a nudge.', 'work']));
  if (unbilled.length) A.push(['dog', `${unbilled.length} session${unbilled.length===1?'':'s'} still to invoice`, R(unbilled.reduce((a,s)=>a+num(s.fee),0)) + ' not yet billed.', 'dog']);
  { const bl = (S.ref.dog.blocks||[]).filter(x => !invOf(x));
    if (bl.length) A.push(['dog', `${bl.length} class payment${bl.length===1?'':'s'} still to invoice`, R(bl.reduce((a,x)=>a+num(x.fee),0)) + ' across your group classes.', 'dog']);
    const wait = (S.ref.dog.blocks||[]).filter(x => invOf(x) && !paidOf(x));
    if (wait.length) A.push(['dog', `${wait.length} class invoice${wait.length===1?'':'s'} unpaid`, R(wait.reduce((a,x)=>a+num(x.fee),0)) + ' invoiced but not yet in.', 'dog']);
    (S.ref.dog.courses||[]).filter(c => c.active !== false && isMonthly(c)).forEach(c => {
      const due = (S.ref.dog.enrols||[]).filter(x => x.courseId === c.id && x.active !== false && !chargedFor(x.id, ymOf(todayISO())));
      if (due.length) A.push(['dog', c.name + ': ' + due.length + ' not charged for ' + fmtMonth(ymOf(todayISO())), 'Monthly class. Raise this month\'s charges from the class card.', 'dog']); });
    (S.ref.dog.courses||[]).filter(c => c.active !== false && !isMonthly(c)).forEach(c => {
      const out = (S.ref.dog.enrols||[]).filter(x => x.courseId === c.id && x.active !== false && paidBalance(x).left <= 0);
      if (out.length) A.push(['dog', out.length + ' dog' + (out.length===1?'':'s') + ' in ' + c.name + ' out of paid lessons', out.map(x=>x.dog).join(', ') + ' — sell the next block.', 'dog']);
      const fin = (S.ref.dog.enrols||[]).filter(x => x.courseId === c.id && x.active !== false && num(c.lessons) && progressOf(c,x).n > num(c.lessons));
      if (fin.length) A.push(['dog', fin.length + ' dog' + (fin.length===1?'':'s') + ' finished ' + c.name, fin.map(x=>x.dog).join(', ') + ' — move them up or roll them off.', 'dog']); }); }
  { const wait = sess.filter(s => invOf(s) && !paidOf(s));
    if (wait.length) A.push(['dog', `${wait.length} session invoice${wait.length===1?'':'s'} unpaid`, R(wait.reduce((a,s)=>a+num(s.fee),0)) + ' invoiced but not yet in.', 'dog']); }
  (S.ref.dog.clients||[]).filter(c => c.active !== false).forEach(c => { const p = pkgState(c); if (!p) return;
    if (p.over) A.push(['dog', `${c.dogName || c.label} is past the package`, `${p.used} lessons against a ${p.size}-session package — ${p.used - p.size} unpaid for.`, 'dog']);
    else if (p.left <= 1) A.push(['dog', `${c.dogName || c.label}'s package is nearly done`, p.left === 0 ? 'All ' + p.size + ' used. Sell the next one or the lessons stop being paid for.' : 'One session left of ' + p.size + '.', 'dog']); });
  (S.ref.money.bills||[]).filter(b => b.active !== false && +b.day >= dom && +b.day <= dom + 3).forEach(b =>
    A.push(['money', `${b.name} due on the ${b.day}th`, R(b.amount) + ' going out.', 'money']));
  (S.ref.money.cats||[]).forEach(c => { const s = (m.tx||[]).filter(x => x.cat===c.id && x.kind!=='in').reduce((a,x)=>a+num(x.amount),0);
    if (num(c.budget) && s > num(c.budget)) A.push(['money', `${c.name} is over budget`, R(s - num(c.budget)) + ' past the ' + R0(c.budget) + ' you set.', 'money']); });
  { const g = planGap(days);
    if (g.short) A.push(['work', g.short + ' commitment' + (g.short===1?'':'s') + ' still unscheduled this week',
      'Open This Week and it will offer you a plan for the rest of it.', 'week']); }
  if (practiceWk === 0) A.push(['play','No hobby time this week','The thread that quietly disappears. Block some in.','week']);
  if (!dayRO(shift(t,-1)).ci && !dayRO(t).ci) A.push(['today','No check-in for two days','Thirty seconds keeps the trends honest.','today']);
  if (stat.workouts === 0) A.push(['move','No sessions logged this week','Even one keeps the record continuous.','move']);

  const threadMins = THREADS.map(th => ({ th, v: Array.from({length:28},(_,i)=>shift(t,-27+i))
    .reduce((a,d) => a + (dayRO(d).sched||[]).filter(s=>s.area===th).reduce((x,s)=>x+num(s.dur),0), 0) }));
  const maxT = Math.max(...threadMins.map(x=>x.v), 1);

  const tiles = [
    ['move', stat.workouts + ' session' + (stat.workouts===1?'':'s'), 'this week · ' + streakDays(allWorkouts().map(w=>w.date)) + ' day streak'],
    ['food', Object.keys(W.plan||{}).filter(d => Object.values(W.plan[d]||{}).some(Boolean)).length + '/7 days', 'planned · ' + (W.shop||[]).filter(s=>!s.got).length + ' on the shopping list'],
    ['work', stat.focus.toFixed(1) + ' h deep', (W.priorities||[]).filter(p=>p.done).length + '/' + (W.priorities||[]).length + ' priorities done'],
    ['dog', sess.filter(s => ymOf(s.date)===ym).length + ' sessions', 'this month · ' + R0(unbilled.reduce((a,s)=>a+num(s.fee),0)) + ' to invoice'],
    ['money', R0(spent), budget ? Math.round(spent/budget*100) + '% of budget used' : 'no budget set yet'],
    ['play', (practiceWk/60).toFixed(1) + ' h', 'practice this week · ' + (() => { const n = (S.ref.play.backlog||[]).filter(b=>b.status==='Doing').length; return n + ' project' + (n===1?'':'s') + ' on the go'; })()]
  ];

  return head('dash', 'Where things stand', fmtLong(t) + ' · week ' + k.slice(5), '', 'Overview')
   + `<div class="grid g3" style="margin-bottom:16px">${tiles.map(([th, big, sub]) => `
      <button class="card" style="--c:${threadC(th)};text-align:left;border-left:3px solid ${threadC(th)}" data-go="${th}">
        <div class="eyebrow" style="--c:${threadC(th)}">${esc(AREA[th].name)}</div>
        <div class="stat" style="margin-top:6px"><div class="v" style="font-size:24px">${esc(big)}</div><div class="m">${esc(sub)}</div></div>
      </button>`).join('')}</div>

    <div class="grid g2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
      <div class="card">
        <h3>Needs your attention</h3>
        <div class="note">Everything below is a fact in your own data, not a nag. ${A.length ? A.length + ' item' + (A.length===1?'':'s') + '.' : ''}</div>
        ${A.length ? A.slice(0, 10).map(([th, title, sub, go]) => `
          <button class="item" style="width:100%;text-align:left" data-go="${go}">
            <span class="pip" style="--c:${threadC(th)};width:8px;height:8px;margin-top:6px"></span>
            <span class="body"><span class="t" style="display:block">${esc(title)}</span><span class="s" style="display:block">${esc(sub)}</span></span></button>`).join('')
          : `<div class="empty">Nothing outstanding. Genuinely — everything you've set up is in order.</div>`}
      </div>
      <div class="stack">
        <div class="card">
          <h3>Balance of attention</h3><div class="note">Scheduled minutes per thread, last 28 days</div>
          ${threadMins.some(x=>x.v) ? threadMins.sort((a,b)=>b.v-a.v).map(x => `
            <div style="padding:7px 0;border-top:1px solid var(--line)">
              <div class="spread" style="margin-bottom:4px"><span>${esc(AREA[x.th].name)}</span><span class="num tiny">${(x.v/60).toFixed(1)} h</span></div>
              <div class="bar" style="--c:${threadC(x.th)}"><i style="width:${x.v/maxT*100}%"></i></div></div>`).join('')
            : `<div class="empty">Schedule some blocks and this shows where your week actually goes.</div>`}
        </div>
        <div class="card">
          <h3>This week in one line</h3>
          <div class="stack" style="gap:6px;margin-top:8px">
            <div class="spread"><span class="dim">Blocks completed</span><span class="num">${stat.done}/${stat.blocks}</span></div>
            <div class="spread"><span class="dim">Deep work</span><span class="num">${stat.focus.toFixed(1)} h</span></div>
            <div class="spread"><span class="dim">Meetings</span><span class="num">${stat.meetings.toFixed(1)} h</span></div>
            <div class="spread"><span class="dim">Money in / out</span><span class="num">${R0(stat.in)} / ${R0(stat.out)}</span></div>
            <div class="spread"><span class="dim">Average energy</span><span class="num">${stat.energy.length ? (stat.energy.reduce((a,b)=>a+b,0)/stat.energy.length).toFixed(1) : '—'}</span></div>
          </div>
          ${W.intent ? `<hr class="rule"><div class="lbl" style="margin-bottom:4px">You said this week was about</div><div class="tiny">${esc(W.intent)}</div>` : ''}
        </div>
      </div>
    </div>`;
}

/* ============================================================
   RENDER
   ============================================================ */
/* resolved when a screen is actually drawn, not while the file is still
   parsing — several of these are declared in later script blocks */
function viewFor(v){
  return ({ today:viewToday, week:viewWeek, move:viewMove, food:viewFood, work:viewWork,
            dog:viewDog, money:viewMoney, play:viewPlay, dash:viewDash, privacy:viewPrivacy })[v] || viewToday;
}
function render(){
  paintRail();
  let lk = document.getElementById('lockroot');
  if (typeof SEC !== 'undefined' && SEC.on && SEC.locked && !SEC.skipped) {
    if (!lk) { lk = document.createElement('div'); lk.id = 'lockroot'; document.body.appendChild(lk); }
    lk.innerHTML = lockScreen();
    const inp = document.getElementById('lockpass'); if (inp) inp.focus();
  } else if (lk) lk.remove();
  try { $('#main').innerHTML = viewFor(S.view)(); }
  catch (e) { console.error(e); $('#main').innerHTML = `<div class="card"><h3>That screen hit a snag</h3><div class="note">${esc(e.message)}</div><button class="btn" data-go="today">Back to Today</button></div>`; }
}

/* ============================================================
   EXPORT — plain CSV your accountant can open anywhere
   ============================================================ */
function csvText(rows){
  return rows.map(r => r.map(c => { const s = String(c == null ? '' : c); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
}
async function offerFile(filename, text){
  if (S.dl) {
    try { await S.dl.save({ filename, data: text }); toast('Saved.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  /* standalone: a plain browser download, no permission needed */
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Saved.');
  } catch (e) { toast('Could not save that file.'); }
}
function ledgerRows(yms){
  const cats = S.ref.money.cats || [], clients = S.ref.dog.clients || [];
  const rows = [['Date','Type','Description','Category','Method','Amount (ZAR)','Status']];
  yms.forEach(ym => {
    const m = S.months[ym] || blankMonth();
    (m.tx||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t =>
      rows.push([t.date, t.kind === 'in' ? 'Income' : 'Expense', t.note || '', t.kind === 'in' ? 'Income' : (nameOf(cats, t.cat) || 'Uncategorised'), t.method || '', num(t.amount).toFixed(2), '']));
    (m.sessions||[]).filter(s => num(s.fee)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s =>
      rows.push([s.date, 'Income', 'Dog training — ' + (nameOf(clients, s.clientId) || 'booking') + (s.dog ? ' (' + s.dog + ')' : ''), 'Dog training', '', num(s.fee).toFixed(2), paidOf(s) ? 'Paid' : (invOf(s) ? 'Invoiced' : 'To invoice')]));
    (S.ref.dog.blocks || []).filter(b => num(b.fee) && ymOf(b.date || '') === ym).forEach(b => {
      const en = (S.ref.dog.enrols||[]).find(x => x.id === b.enrolId) || {};
      const co = (S.ref.dog.courses||[]).find(c => c.id === en.courseId) || {};
      rows.push([b.date, 'Income', 'Class — ' + (co.name || 'group class') + ' (' + (en.dog || 'dog') + ', ' +
        (b.kind === 'month' ? fmtMonth(b.month) : num(b.lessons) + ' lessons') + ')', 'Dog training', '',
        num(b.fee).toFixed(2), paidOf(b) ? 'Paid' : (invOf(b) ? 'Invoiced' : 'To invoice')]); });
  });
  return rows;
}
function exportLedger(yms, label){
  const rows = ledgerRows(yms);
  if (rows.length < 2) { toast('Nothing to export for that period.'); return; }
  const out = num(rows.slice(1).filter(r=>r[1]==='Expense').reduce((a,r)=>a+num(r[5]),0));
  const inc = num(rows.slice(1).filter(r=>r[1]==='Income').reduce((a,r)=>a+num(r[5]),0));
  rows.push([], ['','','','','Total expenses', out.toFixed(2)], ['','','','','Total income', inc.toFixed(2)]);
  offerFile('six-threads-ledger-' + label + '.csv', csvText(rows));
}

/* ============================================================
   ASK CLAUDE — two small, optional helpers
   ============================================================ */
async function aiMealIdeas(k){
  if (!S.ai) return;
  const W = week(k), days = weekDays(mondayOf(S.date));
  const gaps = [];
  days.forEach(d => ['b','l','d'].forEach(s => { if (!((W.plan||{})[d]||{})[s]) gaps.push({d, s}); }));
  if (!gaps.length) { toast('Every slot is already planned.'); return; }
  toast('Thinking about meals…');
  const bank = (S.ref.food.recipes||[]).map(r => r.name + (r.tag ? ' (' + r.tag + ')' : '')).join(', ');
  const already = days.map(d => Object.values((W.plan||{})[d]||{}).filter(Boolean).join(', ')).filter(Boolean).join(' | ');
  try {
    const out = await S.ai.json(
      `Fill the empty meal slots for one week for a busy person in Johannesburg, South Africa.\n` +
      `Meals they already cook: ${bank || '(none listed yet — suggest simple, common home cooking)'}.\n` +
      `Already planned this week: ${already || '(nothing)'} — do not repeat these more than once.\n` +
      `Empty slots (b=breakfast, l=lunch, d=dinner): ${gaps.map(g => g.d + ':' + g.s).join(', ')}\n` +
      `Prefer meals from their list. Keep breakfasts and lunches quick. Reply ONLY with JSON of the form ` +
      `{"slots":[{"date":"YYYY-MM-DD","slot":"b|l|d","meal":"short meal name"}]} covering every empty slot.`,
      { modelTier: 'quick' });
    const slots = (out && out.slots) || [];
    if (!slots.length) { toast('No suggestions came back.'); return; }
    slots.forEach(s => { if (!s || !s.date || !s.slot || !s.meal) return;
      if (!W.plan[s.date]) W.plan[s.date] = {};
      if (!W.plan[s.date][s.slot]) W.plan[s.date][s.slot] = String(s.meal).slice(0, 60); });
    saveWeek(k); render(); toast('Filled ' + slots.length + ' slots — edit anything you don’t fancy.');
  } catch (e) {
    toast(e && e.code === 'rate_limited' ? 'Too many requests just now — try again shortly.' : 'Could not get suggestions.');
  }
}
async function aiWeekReview(k){
  if (!S.ai) return;
  const days = weekDays(mondayOf(S.date)), W = week(k), s = collectWeek(days);
  toast('Drafting…');
  const wins = across('log').filter(l => days.includes(l.date));
  try {
    const out = await S.ai(
      `Write a short, plain weekly review in the second person ("you"), 4-6 sentences, no headings, no bullet points, no flattery. ` +
      `Be specific about the numbers and honest where a thread was neglected. This is one person's own tracking data for the week of ${days[0]}:\n` +
      `Intention for the week: ${W.intent || '(none set)'}\n` +
      `Priorities: ${(W.priorities||[]).map(p => (p.done?'[done] ':'[open] ') + p.text).join('; ') || '(none)'}\n` +
      `Scheduled blocks: ${s.done} of ${s.blocks} completed. Workouts: ${s.workouts}. ` +
      `Deep work: ${s.focus.toFixed(1)}h. Meetings: ${s.meetings.toFixed(1)}h. ` +
      `Energy ratings: ${s.energy.join(', ') || 'none recorded'}. ` +
      `Dog training sessions: ${s.sessions}. Hobby practice: ${(s.practice/60).toFixed(1)}h. ` +
      `Money out R${s.out.toFixed(0)}, in R${s.in.toFixed(0)}.\n` +
      `Wins and challenges logged: ${wins.map(w => w.kind + ': ' + w.text).join('; ') || '(none)'}\n` +
      `End with one concrete suggestion for next week.`, { modelTier: 'default' });
    const text = (out && out.text || '').trim();
    if (!text) { toast('Nothing came back.'); return; }
    W.review = (W.review ? W.review.trim() + '\n\n' : '') + text;
    saveWeek(k); render(); toast('Draft added — make it yours.');
  } catch (e) {
    toast(e && e.code === 'rate_limited' ? 'Too many requests just now — try again shortly.' : 'Could not draft that.');
  }
}
</script>

<script>
/* ============================================================
   THE TIME GRID — one renderer, used by Today (one column)
   and the weekly timetable (seven). Blocks are positioned by
   their start time and sized by their duration, so an hour of
   deep work is literally four times the height of a 15-minute
   admin block. Gaps in the day read as gaps.
   ============================================================ */
const DAY_START = 5 * 60, DAY_END = 22 * 60, PXH = 54, PXM = PXH / 60;
const gm = t => { const p = String(t || '').split(':'); return p.length === 2 && p[0] !== '' ? (+p[0]) * 60 + (+p[1]) : -1; };
const gt = m => pad(Math.floor(clamp(m, 0, 1439) / 60)) + ':' + pad(Math.round(clamp(m, 0, 1439)) % 60);
const snap5 = m => Math.round(m / 5) * 5;

/* lay overlapping blocks side by side, cluster by cluster */
function packDay(blocks){
  const arr = blocks.map(b => ({ b, s: gm(b.time), e: gm(b.time) + Math.max(15, num(b.dur) || 30) }))
    .sort((a, b) => a.s - b.s || a.e - b.e);
  let clusters = [], cur = [], curEnd = -1;
  arr.forEach(it => {
    if (cur.length && it.s >= curEnd) { clusters.push(cur); cur = []; curEnd = -1; }
    cur.push(it); curEnd = Math.max(curEnd, it.e);
  });
  if (cur.length) clusters.push(cur);
  clusters.forEach(cl => {
    const lanes = [];
    cl.forEach(it => { let i = lanes.findIndex(end => end <= it.s);
      if (i < 0) { lanes.push(it.e); i = lanes.length - 1; } else lanes[i] = it.e; it.lane = i; });
    cl.forEach(it => it.lanes = lanes.length);
  });
  return arr;
}

function gridCol(d, o){
  o = o || {};
  const D = dayRO(d);
  const ghosts = o.ghosts ? (S.proposal || []).filter(x => x.d === d).map(x => ({ id:x.id, title:x.title, area:x.area, time:x.time, dur:x.dur, ghost:true })) : [];
  const items = packDay((D.sched || []).filter(b => gm(b.time) >= 0).concat(ghosts));
  const nowM = new Date().getHours() * 60 + new Date().getMinutes();
  const wk = (typeof workIv === 'function') ? workIv(d) : null;
  return `<div class="gcol" data-gday="${d}">
    ${wk ? `<div class="gwork" style="top:${Math.max(0,(wk[0]-DAY_START)*PXM)}px;height:${Math.max(0,(Math.min(wk[1],DAY_END)-Math.max(wk[0],DAY_START))*PXM)}px"></div>` : ''}
    ${o.now && nowM >= DAY_START && nowM <= DAY_END ? `<div class="gnow" id="nowline" style="top:${(nowM - DAY_START) * PXM}px"></div>` : ''}
    ${items.map(it => {
      const b = it.b;
      const top = Math.max(0, (it.s - DAY_START) * PXM);
      const h = Math.max(16, Math.min((DAY_END - DAY_START) * PXM, (it.e - DAY_START) * PXM) - top);
      const w = 100 / it.lanes, left = it.lane * w;
      return `<div class="gblock ${b.done ? 'gdone' : ''} ${h < 34 ? 'short' : ''} ${b.ghost ? 'gprop' : ''}" data-id="${b.id}" data-d="${d}"
        style="top:${top.toFixed(1)}px;height:${h.toFixed(1)}px;left:${left}%;width:calc(${w}% - 2px);--c:${threadC(b.area)};--cbg:${threadBg(b.area)}"
        title="${esc(b.title)} · ${esc(threadName(b.area))} · ${esc(b.time)}–${esc(gt(it.e))}${b.note ? ' · ' + esc(b.note) : ''}">
        <span class="grip"></span>
        <div class="gt">${esc(b.title)}</div>
        <div class="gm">${esc(b.time)}–${esc(gt(it.e))}</div>
        ${b.ghost ? `<button class="gtick" data-act="propdrop" data-id="${b.id}" aria-label="Drop this suggestion">&times;</button>`
          : `<button class="gtick" data-act="blocktick" data-id="${b.id}" data-d="${d}" aria-label="Mark ${b.done ? 'not done' : 'done'}">&#10003;</button>
             <span class="gres"></span>`}</div>`;
    }).join('')}
  </div>`;
}

function gridHTML(days, opts){
  opts = opts || {};
  const H = (DAY_END - DAY_START) * PXM;
  const hours = []; for (let h = Math.ceil(DAY_START / 60); h <= DAY_END / 60; h++) hours.push(h);
  const loose = [];
  days.forEach(d => (dayRO(d).sched || []).forEach(b => { if (gm(b.time) < 0) loose.push({ d, b }); }));
  return (days.length > 1 ? `<div class="ghead">${days.map(d => `
      <button class="${d === todayISO() ? 'on' : ''}" data-act="goday" data-d="${d}" title="Open ${esc(fmtDay(d))} on Today">
        <div class="hn">${DOW[toD(d).getDay()]}</div><div class="hd">${+d.slice(8)}</div></button>`).join('')}</div>` : '')
  + `<div class="gwrap">
      <div class="gtimes" style="height:${H}px">${hours.map(h => `<div class="ghr" style="top:${(h * 60 - DAY_START) * PXM}px">${pad(h)}:00</div>`).join('')}</div>
      <div class="gscroll"><div class="gbody" style="height:${H}px">
        ${hours.map(h => `<div class="gline" style="top:${(h * 60 - DAY_START) * PXM}px"></div>
          ${h * 60 + 30 <= DAY_END ? `<div class="gline half" style="top:${(h * 60 + 30 - DAY_START) * PXM}px"></div>` : ''}`).join('')}
        <div class="gcols">${days.map(d => gridCol(d, { now: opts.now && d === todayISO(), ghosts: opts.ghosts })).join('')}</div>
      </div></div>
    </div>`
  + (loose.length ? `<div class="lbl" style="margin-top:12px">No time set</div><div class="unsched">${loose.map(x =>
      `<button class="chip" style="--c:${threadC(x.b.area)};--cbg:${threadBg(x.b.area)}" data-act="blockedit" data-id="${x.b.id}" data-d="${x.d}">${esc(x.b.title)}</button>`).join('')}</div>` : '');
}

/* ---------- recurring blocks materialise onto real days ---------- */
function materialise(d){
  if (d < todayISO()) return;
  const rules = (S.ref.schedule.recurring || []).filter(r => r.active !== false && (r.dow || []).includes(toD(d).getDay()));
  if (!rules.length) return;
  const D = day(d), skip = new Set(D.skip || []);
  let changed = false;
  rules.forEach(r => {
    if (skip.has(r.id)) return;
    if ((D.sched || []).some(b => b.rid === r.id)) return;
    D.sched.push({ id: uid(), rid: r.id, title: r.title, area: r.area, time: r.time, dur: r.dur, note: r.note || '', done: false });
    changed = true;
  });
  if (changed) saveDay(d);
}

/* ============================================================
   WEEK — the timetable, and the routine behind it
   ============================================================ */
function weekGrid(days, k, W){
  days.forEach(materialise);
  const mins = {}; THREADS.forEach(th => mins[th] = 0);
  let total = 0, done = 0;
  days.forEach(d => (dayRO(d).sched || []).forEach(b => {
    const m = Math.max(15, num(b.dur) || 30); if (mins[b.area] != null) mins[b.area] += m;
    total++; if (b.done) done++;
  }));
  return `<div class="card">
      <div class="spread" style="margin-bottom:4px"><h3>Timetable</h3>
        <div class="row">
          <button class="btn ghost sm" data-act="layroutine" data-w="${k}">Lay down the routine</button>
          <button class="btn ghost sm" data-act="tmplapply" data-d="${days[0]}">Apply a template</button>
          <button class="btn sm" data-act="block+">Add block</button></div></div>
      <div class="note">Click an empty slot to add a block there. Drag a block to move it — across days too — or drag its bottom edge to change how long it runs.</div>
      ${gridHTML(days, { now: true })}
    </div>
    <div class="grid g4" style="margin-top:16px">
      <div class="card"><div class="stat"><div class="k">Blocks</div><div class="v">${done}<span style="font-size:16px;color:var(--faint)">/${total}</span></div><div class="m">done this week</div></div></div>
      <div class="card"><div class="stat"><div class="k">Time blocked</div><div class="v">${(THREADS.reduce((a,t)=>a+mins[t],0)/60).toFixed(1)}<span style="font-size:15px;color:var(--faint)"> h</span></div><div class="m">across all six threads</div></div></div>
      <div class="card" style="grid-column:span 2"><div class="lbl" style="margin-bottom:7px">How the week is shared out</div>
        <div class="row" style="gap:0;height:11px;border-radius:20px;overflow:hidden;background:var(--line)">
          ${THREADS.map(th => { const tot = THREADS.reduce((a,t)=>a+mins[t],0); return tot && mins[th] ? `<span style="width:${mins[th]/tot*100}%;background:${threadC(th)};height:100%" title="${esc(AREA[th].name)}"></span>` : ''; }).join('')}</div>
        <div class="row" style="gap:10px;margin-top:9px">${THREADS.filter(th=>mins[th]).map(th =>
          `<span class="row" style="gap:5px"><span class="pip" style="--c:${threadC(th)};width:7px;height:7px"></span><span class="tiny dim">${esc(AREA[th].name)} ${(mins[th]/60).toFixed(1)}h</span></span>`).join('') || '<span class="empty">Nothing blocked out yet.</span>'}</div>
      </div>
    </div>`;
}

function weekRoutine(days, k, W){
  const rs = S.ref.schedule.recurring || [], ts = S.ref.schedule.templates || [];
  const byDay = n => rs.filter(r => r.active !== false && (r.dow||[]).includes(n)).sort((a,b) => gm(a.time) - gm(b.time));
  return `<div class="grid g2" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">
    <div class="card">
      <div class="spread" style="margin-bottom:4px"><h3>Recurring blocks</h3><button class="btn sm" data-act="rec+">Add</button></div>
      <div class="note">The fixed shape of your week — work hours, gym days, a standing client slot. These appear on every matching day from today onward, on their own. Move or delete one on a given day and only that day changes; the pattern stays.</div>
      ${rs.length ? rs.slice().sort((a,b) => gm(a.time) - gm(b.time)).map(r => `
        <div class="item ${r.active === false ? 'done' : ''}">
          <span class="pip" style="--c:${threadC(r.area)};width:9px;height:9px;margin-top:6px"></span>
          <div class="body">
            <div class="spread"><div class="t">${esc(r.title)}</div>
              <span class="mono tiny dim">${esc(r.time)} · ${esc(String(r.dur))} min</span></div>
            <div class="s row" style="gap:3px;margin-top:4px">
              ${[1,2,3,4,5,6,0].map(n => `<span class="chip ${(r.dow||[]).includes(n) ? '' : 'out'}" style="--c:${threadC(r.area)};--cbg:${threadBg(r.area)};padding:1px 6px;font-size:10.5px;${(r.dow||[]).includes(n)?'':'opacity:.4'}">${DOW[n][0]}</span>`).join('')}
              <span class="dim tiny" style="margin-left:6px">${esc(threadName(r.area))}${r.active === false ? ' · paused' : ''}</span></div>
          </div>
          <button class="btn ghost sm" data-act="recedit" data-id="${r.id}">Edit</button>
          <button class="x" data-act="rec-" data-id="${r.id}">&times;</button></div>`).join('')
        : `<div class="empty">Nothing recurring yet. Start with the two or three things that are true most weeks — that's most of a schedule already.</div>`}
      ${rs.length ? `<hr class="rule"><div class="lbl" style="margin-bottom:8px">A typical week, as it stands</div>
        <div class="tw"><table><thead><tr>${[1,2,3,4,5,6,0].map(n => `<th>${DOW[n]}</th>`).join('')}</tr></thead><tbody><tr>
          ${[1,2,3,4,5,6,0].map(n => `<td>${byDay(n).map(r => `<div class="tiny" style="color:${threadC(r.area)};font-weight:600">${esc(r.time)} ${esc(r.title)}</div>`).join('') || '<span class="dim tiny">—</span>'}</td>`).join('')}
        </tr></tbody></table></div>` : ''}
    </div>
    <div class="card">
      <div class="spread" style="margin-bottom:4px"><h3>Day templates</h3>
        <button class="btn sm ghost" data-act="tmplsave" data-d="${S.date}">Save a day as a template</button></div>
      <div class="note">A whole day's shape, saved once and stamped onto any date. Useful for the days that don't recur on a fixed weekday — a client-heavy Saturday, a deep-work day.</div>
      ${ts.length ? ts.map(t => `<div class="item"><div class="body">
          <div class="spread"><div class="t">${esc(t.name)}</div><span class="tiny dim">${(t.blocks||[]).length} block${(t.blocks||[]).length===1?'':'s'}</span></div>
          <div class="s row" style="gap:4px;margin-top:4px">${(t.blocks||[]).slice(0,6).map(b =>
            `<span class="chip" style="--c:${threadC(b.area)};--cbg:${threadBg(b.area)};padding:1px 7px;font-size:10.5px">${esc(b.time)} ${esc(b.title)}</span>`).join('')}${(t.blocks||[]).length>6?'<span class="tiny dim">…</span>':''}</div></div>
        <button class="btn ghost sm" data-act="tmplapply" data-v="${t.id}" data-d="${S.date}">Apply</button>
        <button class="x" data-act="tmpl-" data-id="${t.id}">&times;</button></div>`).join('')
        : `<div class="empty">No templates yet. Build a day you like on the Today screen, then save it here.</div>`}
    </div>
  </div>`;
}
</script>

<script>
/* ============================================================
   MUTATIONS — every button on every screen lands here
   ============================================================ */
const refList = (area, key) => (S.ref[area][key] = S.ref[area][key] || []);
function pushMonth(field, d, rec){ const m = month(ymOf(d)); (m[field] = m[field] || []).push(rec); saveMonth(ymOf(d)); }
function delMonth(field, d, id){ const m = month(ymOf(d)); m[field] = (m[field] || []).filter(x => x.id !== id); saveMonth(ymOf(d)); }
function findMonth(field, d, id){ const m = month(ymOf(d)); return (m[field] || []).find(x => x.id === id); }
function moveRec(field, oldDate, newDate, rec){
  if (ymOf(oldDate) === ymOf(newDate)) return;
  delMonth(field, oldDate, rec.id); pushMonth(field, newDate, rec);
}
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

/* ---------- workout dialog (its own, because of the set rows) ---------- */
let wkSets = [], wkDate = null, wkId = null;
function openWorkout(d, id){
  wkDate = d; wkId = id || null;
  const ex = id ? (dayRO(d).workouts || []).find(w => w.id === id) : null;
  wkSets = ex ? JSON.parse(JSON.stringify(ex.sets || [])) : [];
  if (!wkSets.length) wkSets.push({ex:'', reps:'', weight:''});
  const routines = S.ref.move.routines || [];
  const wk = weekRO(weekKey(d));
  const dogs = S.ref.dog.mydogs || [];
  const type = ex ? ex.type : (S.lastAct || 'strength');
  $('#dlg').innerHTML = `<form id="wform">
    <h3 style="font-size:19px;margin-bottom:4px">${ex ? 'Edit' : 'Log'} a workout</h3>
    <div class="note">${esc(fmtLong(d))}</div>
    <div class="row" style="gap:10px;margin-bottom:10px">
      <label class="f"><span>What</span><select id="wtype">${actOpts().map(o =>
        `<option value="${esc(o[0])}" ${o[0]===type?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>
      <label class="f" style="flex:0 0 118px"><span>Date</span><input type="date" id="wdate" value="${esc(d)}"></label>
    </div>
    <div class="row" style="gap:10px;margin-bottom:10px">
      <label class="f" style="flex:0 0 110px"><span>Minutes</span><input type="number" id="wmins" min="0" step="5" value="${esc(ex ? (ex.mins||'') : 45)}"></label>
      <label class="f" style="flex:0 0 100px"><span>Time</span><input type="time" id="wtime" value="${esc(ex ? (ex.time||'') : '')}"></label>
      <label class="f"><span>Label</span><input type="text" id="wname" list="wrl" value="${esc(ex ? (ex.name||'') : ((wk.wplan||{})[d] || ''))}" placeholder="optional — e.g. Upper body A"></label>
    </div>
    <datalist id="wrl">${routines.map(r => `<option value="${esc(r.name)}"></option>`).join('')}</datalist>
    <div class="lbl" style="margin-bottom:5px">How hard did it feel?</div>
    <div class="row" style="gap:5px;margin-bottom:10px">
      ${[1,2,3,4,5].map(n => `<button type="button" class="btn ${ex && +ex.effort===n ? '' : 'ghost'} sm weff" data-eff="${n}" style="flex:1">${n}</button>`).join('')}
    </div>
    <input type="hidden" id="weffort" value="${ex ? (ex.effort||'') : ''}">
    ${dogs.length ? `<label class="f" style="margin-bottom:10px" id="wdogwrap"><span>Which dog</span>
      <select id="wdog"><option value="">—</option>${dogs.map(x => `<option value="${esc(x.id)}" ${ex && ex.dogId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>` : ''}
    <div id="wsetwrap">
      <div class="lbl" style="margin-bottom:6px">Sets</div>
      <div id="wsets" class="stack" style="gap:6px"></div>
      <div class="row" style="margin-top:8px">
        <button type="button" class="btn ghost sm" id="waddset">Add set</button>
        ${routines.length ? `<select id="wfill" style="width:auto"><option value="">Pre-fill from routine…</option>${routines.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select>` : ''}
      </div>
    </div>
    <label class="f" style="margin-top:12px"><span>How it felt</span><textarea id="wnotes" placeholder="Optional">${esc(ex ? (ex.notes||'') : '')}</textarea></label>
    <div id="wkcal" class="tiny dim" style="margin-top:8px"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      ${ex ? `<button type="button" class="btn ghost" data-act="workoutdel" data-d="${d}" data-id="${id}">Delete</button>` : ''}
      <button type="button" class="btn ghost" data-act="close">Cancel</button>
      <button type="submit" class="btn">Save</button></div>
  </form>`;
  paintSets(); wkSync(); $('#dlg').showModal();
}
/* show the sets grid only for the activities that have sets, and keep the
   calorie estimate honest about needing a body weight */
function wkSync(){
  const t = $('#wtype') ? $('#wtype').value : 'strength';
  const a = actOf(t);
  const sw = $('#wsetwrap'); if (sw) sw.style.display = a && a.sets ? '' : 'none';
  const dw = $('#wdogwrap'); if (dw) dw.style.display = a && a.dog ? '' : 'none';
  const el = $('#wkcal'); if (!el) return;
  const mins = num($('#wmins') ? $('#wmins').value : 0);
  if (!bodyKg()) { el.innerHTML = `About ${a ? a.met : 4} times resting effort. <button type="button" class="x" data-act="setweight" style="font-size:12px;color:var(--a-move)">Add your weight</button> and this shows an energy estimate.`; return; }
  const k = kcalOf({ type: t, mins });
  el.textContent = k ? `Roughly ${k} kcal — an estimate from ${a.met} METs at ${bodyKg()} kg. Real figures vary 20–30%.` : '';
}
function paintSets(){
  const w = $('#wsets'); if (!w) return;
  w.innerHTML = wkSets.map((s, i) => `<div class="row" style="gap:6px;flex-wrap:nowrap">
    <input type="text" value="${esc(s.ex||'')}" data-set="${i}" data-k="ex" placeholder="Exercise" style="flex:2">
    <input type="number" step="any" value="${esc(s.reps==null?'':s.reps)}" data-set="${i}" data-k="reps" placeholder="Reps" style="flex:1">
    <input type="number" step="any" value="${esc(s.weight==null?'':s.weight)}" data-set="${i}" data-k="weight" placeholder="kg" style="flex:1">
    <button type="button" class="x" data-rmset="${i}">&times;</button></div>`).join('');
}
function readSets(){
  const w = $('#wsets'); if (!w) return;
  w.querySelectorAll('[data-set]').forEach(el => {
    const i = +el.dataset.set; if (!wkSets[i]) return;
    wkSets[i][el.dataset.k] = el.dataset.k === 'ex' ? el.value.trim() : el.value;
  });
}

/* ---------- the action table ---------- */
const ACT = {
  close(){ $('#dlg').close(); },
  theme(){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : (cur === 'light' ? '' : 'dark');
    if (next) document.documentElement.setAttribute('data-theme', next); else document.documentElement.removeAttribute('data-theme');
    S.ref.settings.theme = next; saveRef('settings');
    toast(next ? next[0].toUpperCase() + next.slice(1) + ' theme' : 'Following your system theme');
  },
  day(e, el){ const v = +el.dataset.v; S.date = v ? shift(S.date, v) : todayISO(); ensureMonth(ymOf(S.date)); render(); },
  week(e, el){ const v = +el.dataset.v; S.date = v ? shift(mondayOf(S.date), v * 7) : todayISO(); ensureMonth(ymOf(S.date)); render(); },
  mon(e, el){ const cur = S.ym || ymOf(todayISO()); const d = toD(cur + '-01'); d.setMonth(d.getMonth() + (+el.dataset.v)); S.ym = ymOf(iso(d)); ensureMonth(S.ym); render(); },
  goday(e, el){ S.date = el.dataset.d; go('today'); },
  toplan(){ S.tab.week = 'auto'; go('week'); },
  daypick(e, el){ if (!el.value) return; S.date = el.value; ensureMonth(ymOf(S.date)); render(); },
  movefilter(e, el){ S.moveFilter = S.moveFilter || {};
    if (el.dataset.k === 'clear') S.moveFilter = {}; else S.moveFilter[el.dataset.k] = el.value;
    S.moveFilter.all = false; render(); },
  moveall(){ S.moveFilter = Object.assign({}, S.moveFilter, { all: true }); render(); },
  sessfilter(e, el){ S.sessFilter = S.sessFilter || {};
    if (el.dataset.k === 'clear') S.sessFilter = {}; else S.sessFilter[el.dataset.k] = el.value;
    S.sessFilter.all = false; render(); },
  sessall(){ S.sessFilter = Object.assign({}, S.sessFilter, { all: true }); render(); },
  pupall(){ S.pupAll = true; render(); },

  /* --- schedule blocks --- */
  'block+'(e, el, area){ openBlockForm(S.date, nowTime(), area); },
  quickblock(e, el){ openBlockForm(S.date, nowTime(), el.dataset.v); },
  blocktick(e, el){ const d = el.dataset.d || S.date; const b = (day(d).sched||[]).find(x => x.id === el.dataset.id);
    if (b) { b.done = !b.done; saveDay(d); render(); } },
  blockdone(e, el){ const b = (day(S.date).sched||[]).find(x => x.id === el.dataset.id); if (b) { b.done = el.checked; saveDay(S.date); render(); } },
  blockedit(e, el){ const d = el.dataset.d || S.date, b = (day(d).sched||[]).find(x => x.id === el.dataset.id); if (!b) return;
    openForm('Edit block', [
      {k:'title', label:'What', val:b.title},
      {k:'area', label:'Thread', type:'select', opts:threadOpts(), val:b.area},
      {k:'time', label:'Start', type:'time', val:b.time},
      {k:'dur', label:'Minutes', type:'num', val:b.dur},
      {k:'date', label:'Day', type:'date', val:d},
      {k:'note', label:'Note', val:b.note},
      {k:'del', label:'Delete this block', type:'check', val:false}
    ], v => {
      if (v.del) { deleteBlock(d, b.id); render(); return; }
      Object.assign(b, {title:v.title, area:v.area, time:v.time, dur:v.dur, note:v.note});

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-go]'); if (nav) { go(nav.dataset.go); return; }
  const tb = e.target.closest('[data-tab]');
  if (tb) { const p = tb.dataset.tab.split(':'); S.tab[p[0]] = p[1]; render(); return; }
  const rm = e.target.closest('[data-rmset]');
  if (rm) { readSets(); wkSets.splice(+rm.dataset.rmset, 1); if (!wkSets.length) wkSets.push({ex:'',reps:'',weight:''}); paintSets(); return; }
  if (e.target.closest('#waddset')) { readSets(); const last = wkSets[wkSets.length-1] || {}; wkSets.push({ex:last.ex||'', reps:'', weight:last.weight||''}); paintSets(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(e, el); }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.type === 'date' && ACT[el.dataset.act]) { ACT[el.dataset.act](e, el); return; }
  if (el.type === 'checkbox' || el.tagName === 'SELECT') {
    const a = el.dataset.act;
    if (a === 'backlogstatus') { const b = (S.ref.play.backlog||[]).find(x => x.id === el.dataset.id); if (b) { b.status = el.value; saveRef('play'); render(); } return; }
    if (a === 'learnstatus')   { const l = (S.ref.play.learning||[]).find(x => x.id === el.dataset.id); if (l) { l.status = el.value; saveRef('play'); render(); } return; }
    if (a === 'daypick' || a === 'movefilter' || a === 'sessfilter') { ACT[a](e, el); return; }
    const fn = ACT[a]; if (fn) fn(e, el);
  }
  if (el.dataset.act === 'wfill' ) return;
});

/* text inputs save without re-rendering, so the cursor stays put */
let inputT = null;
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.value;
  const apply = {
    ci(){ const D = day(S.date); D.ci = D.ci || {}; D.ci[el.dataset.k] = el.dataset.k === 'note' ? v : num(v); saveDay(S.date); },
    wfield(){ week(el.dataset.w)[el.dataset.k] = v; saveWeek(el.dataset.w); },
    wplan(){ const W = week(el.dataset.w); W.wplan = W.wplan || {}; if (v.trim()) W.wplan[el.dataset.d] = v; else delete W.wplan[el.dataset.d]; saveWeek(el.dataset.w); },
    plan(){ const W = week(el.dataset.w); W.plan = W.plan || {}; const d = el.dataset.d;
      W.plan[d] = W.plan[d] || {}; if (v.trim()) W.plan[d][el.dataset.k] = v; else delete W.plan[d][el.dataset.k]; saveWeek(el.dataset.w); }
  }[a];
  if (apply) { clearTimeout(inputT); inputT = setTimeout(apply, 120); }
});

/* dialogs */
document.addEventListener('submit', e => {
  if (e.target.id === 'frm') {
    e.preventDefault(); const v = readForm(); const fn = formSubmit.onSubmit; $('#dlg').close(); if (fn) fn(v);
  }
  if (e.target.id === 'wform') {
    e.preventDefault(); readSets();

    const a = actOf(type);
    const sets = (a && a.sets) ? wkSets.filter(x => x.ex || x.reps || x.weight).map(x => ({ex:x.ex, reps:num(x.reps), weight:num(x.weight)})) : [];
    const rec = { id: wkId || uid(), type, name: $('#wname').value.trim(), mins: num($('#wmins').value),
      time: $('#wtime').value, effort: num($('#weffort').value) || null,
      dogId: (a && a.dog && $('#wdog')) ? $('#wdog').value : '', notes: $('#wnotes').value.trim(), sets };
    if (wkId && d !== wkDate) { day(wkDate).workouts = (day(wkDate).workouts||[]).filter(w => w.id !== wkId); saveDay(wkDate); }
    const D = day(d); D.workouts = D.workouts || [];
    const at = D.workouts.findIndex(w => w.id === rec.id);
    if (at >= 0) D.workouts[at] = rec; else D.workouts.push(rec);
    S.lastAct = type;
    saveDay(d); $('#dlg').close(); render();
  }
});
$('#dlg').addEventListener('input', e => { if (e.target.id === 'wmins') wkSync(); });
$('#dlg').addEventListener('click', e => {
  const b = e.target.closest('.weff'); if (!b) return;
  e.preventDefault();
  const cur = $('#weffort').value;
  $('#weffort').value = (String(cur) === b.dataset.eff) ? '' : b.dataset.eff;
  $('#dlg').querySelectorAll('.weff').forEach(x => x.classList.toggle('ghost', x.dataset.eff !== $('#weffort').value));
});
$('#dlg').addEventListener('change', e => {
  if (e.target.id === 'wtype') wkSync();
  if (e.target.id === 'wfill') {
    const r = (S.ref.move.routines||[]).find(x => x.id === e.target.value); if (!r) return;
    readSets(); wkSets = (r.exercises||[]).map(ex => ({ex, reps:'', weight:''}));
    if (!$('#wname').value) $('#wname').value = r.name;

  }
});
