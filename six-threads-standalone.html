<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#101410">
<meta name="description" content="Six Threads — a personal operating system. Your data stays in this browser; nothing is sent anywhere you did not set up yourself.">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Six Threads">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A7%B5%3C/text%3E%3C/svg%3E">
<title>Six Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#EDEFEA; --card:#FAFBF7; --raise:#FFFFFF;
  --ink:#171C18; --ink-2:#3D4740; --muted:#6C766E; --faint:#8E988F;
  --line:#DBDFD5; --line-2:#C8CEC1;
  --ok:#2F7D57; --warn:#B07D14; --bad:#B4443A;
  --a-move:#B94B3E; --a-food:#A87A22; --a-work:#3C6BA3; --a-dog:#55833A; --a-money:#75589F; --a-play:#237E7C;
  --a-move-bg:#F7E6E3; --a-food-bg:#F6EDDB; --a-work-bg:#E4ECF6; --a-dog-bg:#E7F0DF; --a-money-bg:#EEE8F6; --a-play-bg:#DEF0EF;
  --tint-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(23,28,24,.05);
  --r:10px;
  --sans:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101410; --card:#181D19; --raise:#1F2620;
    --ink:#E7EBE4; --ink-2:#C2CABF; --muted:#8E9A8F; --faint:#6E7A70;
    --line:#2A322C; --line-2:#3A443C;
    --ok:#6BBF8F; --warn:#D9AB4C; --bad:#E0796D;
    --a-move:#E08376; --a-food:#D6AC55; --a-work:#7BA6DC; --a-dog:#93C071; --a-money:#B294DA; --a-play:#5CBAB7;
    --a-move-bg:#2E211F; --a-food-bg:#2C2618; --a-work-bg:#1B2530; --a-dog-bg:#1F2A1B; --a-money-bg:#241E2E; --a-play-bg:#152A29;
    --tint-fg:#101410;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#101410; --card:#181D19; --raise:#1F2620;
  --ink:#E7EBE4; --ink-2:#C2CABF; --muted:#8E9A8F; --faint:#6E7A70;
  --line:#2A322C; --line-2:#3A443C;
  --ok:#6BBF8F; --warn:#D9AB4C; --bad:#E0796D;
  --a-move:#E08376; --a-food:#D6AC55; --a-work:#7BA6DC; --a-dog:#93C071; --a-money:#B294DA; --a-play:#5CBAB7;
  --a-move-bg:#2E211F; --a-food-bg:#2C2618; --a-work-bg:#1B2530; --a-dog-bg:#1F2A1B; --a-money-bg:#241E2E; --a-play-bg:#152A29;
  --tint-fg:#101410;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--a-work);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100vh}
.rail{background:var(--card);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:600}
.navb{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;width:100%;text-align:left;color:var(--ink-2);font-weight:500;font-size:14.5px;transition:background .12s}
.navb:hover{background:var(--raise)}
.navb .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--line-2));flex:none}
.navb.on{background:var(--raise);color:var(--ink);font-weight:700;box-shadow:inset 2px 0 0 var(--c,var(--ink))}
.navsep{height:1px;background:var(--line);margin:10px 10px}
.railfoot{margin-top:auto;padding:12px 10px 0;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--faint)}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.syncpill i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.syncpill.live i{background:var(--ok)}
.syncpill.local i{background:var(--warn)}

main{padding:26px 30px 90px;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--c,var(--line-2))}
.head h1{font-size:29px}
.head .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--faint));font-weight:700}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card>h3{font-size:16.5px;margin-bottom:2px}
.card .note{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.dim{color:var(--muted)}
.tiny{font-size:12.5px}
.empty{color:var(--faint);font-size:13.5px;font-style:italic;padding:10px 0}
hr.rule{border:none;border-top:1px solid var(--line);margin:14px 0}

input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  background:var(--raise);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;width:100%;min-width:0;font-size:14px}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input[type=number],input[type=time],input[type=date]{font-family:var(--mono);font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;flex:1 1 120px;min-width:0}
label.f>span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--c,var(--a-work));cursor:pointer;flex:none}

.btn{background:var(--ink);color:var(--paper);border-radius:7px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:opacity .12s}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--raise);opacity:1}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.tint{background:var(--c);color:var(--tint-fg)}
.x{color:var(--faint);font-size:16px;line-height:1;padding:2px 5px;border-radius:5px;flex:none}
.x:hover{color:var(--bad);background:var(--raise)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--cbg,var(--raise));color:var(--c,var(--muted));border:1px solid transparent}
.chip.out{background:transparent;border-color:var(--line-2);color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .v{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.stat .m{font-size:12px;color:var(--muted)}

.bar{height:7px;border-radius:20px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:20px;background:var(--c,var(--ink));transition:width .3s}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:0 10px 7px 0;white-space:nowrap}
td{padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.done .t{text-decoration:line-through;color:var(--faint)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--c,var(--ink))}

/* schedule */
.slot{display:grid;grid-template-columns:62px 4px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:none}
.slot .tm{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.slot .tick{background:var(--c,var(--line-2));border-radius:2px;align-self:stretch;min-height:20px}
.slot.done .ttl{text-decoration:line-through;color:var(--faint)}
.slot .ttl{font-weight:600;font-size:14px}
.slot .meta{font-size:12px;color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;min-height:112px;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dn{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.day .dd{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1}
.day .pips{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.pip{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day .mini{font-size:11.5px;color:var(--muted);line-height:1.35;overflow:hidden}

.streak{display:flex;gap:3px;flex-wrap:wrap}
.streak i{width:13px;height:13px;border-radius:3px;background:var(--line);display:block}
.streak i.on{background:var(--c,var(--ok))}
.streak i.today{box-shadow:0 0 0 1.5px var(--ink)}

.spark{display:block;width:100%;height:52px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.2)}
dialog{border:1px solid var(--line-2);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;max-width:min(560px,92vw);width:100%;box-shadow:0 12px 40px rgba(0,0,0,.22)}
dialog::backdrop{background:rgba(10,14,11,.42)}

.qa{display:flex;gap:6px;flex-wrap:wrap}
.qa button{border:1px solid var(--line-2);background:var(--raise);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.qa button:hover{border-color:var(--c,var(--ink));color:var(--c,var(--ink))}

.mobnav{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .mobnav{display:flex;gap:4px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .mobnav button{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;border:1px solid transparent}
  .mobnav button.on{color:var(--ink);border-color:var(--c,var(--line-2));background:var(--raise)}
  main{padding:18px 14px 80px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .head h1{font-size:24px}
}
@media(min-width:901px) and (max-width:1150px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- time grid ---------- */
.gwrap{display:flex;gap:8px;margin-top:12px}
.gtimes{position:relative;width:44px;flex:none}
.ghr{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.gscroll{flex:1;min-width:0;overflow-x:auto;overflow-y:visible}
.gbody{position:relative;min-width:100%}
.gline{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.gline.half{border-top-style:dotted;opacity:.55}
.gcols{position:absolute;inset:0;display:flex;gap:5px}
.gcol{flex:1 1 0;position:relative;min-width:104px;border-radius:6px}
.gcol:hover{background:color-mix(in srgb,var(--raise) 60%,transparent)}
.gblock{position:absolute;left:0;right:0;border-radius:6px;background:var(--cbg);border:1px solid var(--c);
  border-left:3px solid var(--c);padding:3px 21px 4px 12px;overflow:hidden;cursor:grab;user-select:none;
  display:flex;flex-direction:column;gap:1px;min-height:16px}
.gblock:active{cursor:grabbing}
.gblock.dragging{opacity:.9;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:20;cursor:grabbing}
.gblock .gt{font-size:12px;font-weight:700;line-height:1.25;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gblock .gm{font-family:var(--mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gblock.short{flex-direction:row;align-items:center;gap:6px;padding-top:1px;padding-bottom:1px}
.gblock.gdone{opacity:.55}
.gblock.gdone .gt{text-decoration:line-through}
.gblock .gtick{position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--c);
  background:transparent;padding:0;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:transparent}
.gblock .gtick:hover{background:var(--c);color:var(--paper)}
.gblock.gdone .gtick{background:var(--c);color:var(--paper)}
.gblock .gres{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize;touch-action:none}
.gblock .gres::after{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:2px;margin-left:-9px;border-radius:2px;background:var(--c);opacity:0}
.gblock:hover .gres::after{opacity:.55}
.gblock .grip{position:absolute;left:0;top:0;bottom:0;width:9px;cursor:grab;touch-action:none}
.gnow{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:15;pointer-events:none}
.gnow::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.ghead{display:flex;gap:5px;margin-left:52px}
.ghead>button{flex:1 1 0;min-width:104px;text-align:center;padding:6px 2px;border-radius:6px}
.ghead>button:hover{background:var(--raise)}
.ghead .hn{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.ghead .hd{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.1}
.ghead .on{background:var(--raise);box-shadow:inset 0 0 0 1px var(--ink)}
.unsched{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dowb{display:inline-flex;align-items:center;justify-content:center;padding:5px 8px;border:1px solid var(--line-2);
  border-radius:6px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted);min-width:38px}
.dowb.on,.dowb:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dowb input{display:none}
@media(max-width:900px){ .gcol{min-width:120px} .ghead>div{min-width:120px} }
</style>
<style>html,body{min-height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div style="min-width:0">
    <div class="mobnav" id="mobnav"></div>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"></dialog>

<script>
/* ============================================================
   SIX THREADS — a personal operating system
   Data lives in the artifact `db` capability (syncs across your
   devices) with a localStorage mirror so the page works instantly
   and offline. Every write goes to both.
   ============================================================ */

/* ---------- small utilities ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const toD = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const todayISO = () => iso(new Date());
const shift = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return iso(d); };
const ymOf = s => String(s).slice(0, 7);
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function mondayOf(s){ const d = toD(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); }
function weekDays(s){ const m = mondayOf(s); return Array.from({length:7}, (_, i) => shift(m, i)); }
function weekKey(s){
  const d = toD(s); d.setDate(d.getDate() + 4 - ((d.getDay() + 6) % 7));
  const y = d.getFullYear(); const jan1 = new Date(y, 0, 1);
  const n = Math.ceil(((d - jan1) / 86400000 + 1) / 7);
  return y + '-W' + pad(n);
}
function fmtDay(s){ const d = toD(s); const y = d.getFullYear() !== new Date().getFullYear() ? " '" + String(d.getFullYear()).slice(2) : ''; return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()].slice(0,3) + y; }
function fmtLong(s){ const d = toD(s); return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtMonth(ym){ const p = ym.split('-'); return MON[+p[1]-1] + ' ' + p[0]; }
function relDay(s){ const t = todayISO(); if (s === t) return 'Today'; if (s === shift(t,1)) return 'Tomorrow'; if (s === shift(t,-1)) return 'Yesterday'; return fmtDay(s); }
const R = n => 'R ' + (num(n) < 0 ? '-' : '') + Math.abs(num(n)).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const R0 = n => 'R ' + (num(n) < 0 ? '-' : '') + Math.round(Math.abs(num(n))).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

/* ---------- areas ---------- */
const AREAS = [
  {id:'today', name:'Today',        c:'var(--ink)'},
  {id:'week',  name:'This Week',    c:'var(--ink)'},
  {id:'move',  name:'Exercise',     c:'var(--a-move)',  bg:'var(--a-move-bg)'},
  {id:'food',  name:'Eating',       c:'var(--a-food)',  bg:'var(--a-food-bg)'},
  {id:'work',  name:'Work',         c:'var(--a-work)',  bg:'var(--a-work-bg)'},
  {id:'dog',   name:'Dog Business', c:'var(--a-dog)',   bg:'var(--a-dog-bg)'},
  {id:'money', name:'Money',        c:'var(--a-money)', bg:'var(--a-money-bg)'},
  {id:'play',  name:'Hobbies',      c:'var(--a-play)',  bg:'var(--a-play-bg)'},
  {id:'dash',  name:'Dashboard',    c:'var(--ink)'},
  {id:'privacy', name:'Privacy & data', c:'var(--ink)'}
];
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
/* the six threads a scheduled block can belong to */
const THREADS = ['move','food','work','dog','money','play'];
const threadName = id => (AREA[id] || {}).name || 'Other';
const threadC = id => (AREA[id] || {}).c || 'var(--line-2)';
const threadBg = id => (AREA[id] || {}).bg || 'var(--raise)';

/* ---------- blank shapes ---------- */
const blankDay  = () => ({ sched: [], workouts: [], meals: {note:''}, ci: null, skip: [] });
const blankMonth = () => ({ days:{}, tx:[], sessions:[], pupp:[], practice:[], log:[], classAtt:[] });
const blankWeek = () => ({ intent:'', priorities:[], plan:{}, wplan:{}, shop:[], review:'' });
const REFS = {
  settings: () => ({ started: todayISO() }),
  move:     () => ({ routines: [], acts: [], targets: [], weightKg: 0 }),
  food:     () => ({ recipes: [] }),
  work:     () => ({ projects: [], decisions: [] }),
  dog:      () => ({ clients: [], courses: [], enrols: [], blocks: [], mydogs: [], pupName: '', skills: [] }),   /* "clients" are labels, not people — see migrateClients() */
  money:    () => ({ cats: [], bills: [], goals: [], quick: [] }),
  play:     () => ({ hobbies: [], backlog: [], learning: [], research: [] }),
  schedule: () => ({ recurring: [], templates: [],
    wants: [],
    rules: { start:'07:00', end:'20:00', lunchOn:true, lunchFrom:'12:30', lunchMins:60, buffer:15, off:[0] } })
};

/* ---------- state ---------- */
const S = {
  view: 'today', date: todayISO(), tab: {},
  db: null, dl: null, ai: null, mode: 'local',
  ref: {}, months: {}, weeks: {}
};
Object.keys(REFS).forEach(k => S.ref[k] = REFS[k]());

const LSKEY = 'sixthreads.v1';
function readLocal(){ try { return JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch (e) { return {}; } }
/* the only shape that ever leaves memory. When the vault is on, client
   records and dog sessions are replaced by their ciphertext here, so
   neither the browser copy nor the database ever holds them in the clear. */
function sealedSnapshot(){
  const ref = {}, months = {};
  Object.keys(S.ref).forEach(k => ref[k] = S.ref[k]);
  if (typeof SEC !== 'undefined' && SEC.on) ref.dog = Object.assign({}, S.ref.dog, { clients: [] });
  Object.keys(S.months).forEach(ym => months[ym] = (typeof SEC !== 'undefined' && SEC.on)
    ? Object.assign({}, S.months[ym], { sessions: [] }) : S.months[ym]);
  return { ref, months, weeks: S.weeks };
}
/* Losing the vault would lose the data inside it, so a write may never remove
   one that is already on disk unless something asked for that explicitly
   (turning encryption off, or deleting). Defence in depth: a bug anywhere else
   that produced a vault-less snapshot would otherwise be unrecoverable. */
let allowVaultDrop = false;
/* The vault also goes into its own tiny key, written first. Browsers commit
   storage asynchronously, so a crash or a reload in the moment after a large
   write can leave the big blob behind — and in the standalone app that blob is
   the only copy. A few hundred bytes written ahead of it is far likelier to
   survive, and on the next open the vault is put back from here. */
const LSVAULT = LSKEY + '.vault';
function writeVaultSidecar(snap){
  try {
    const v = ((snap.ref || {}).dog || {}).vault;
    const m = {};
    Object.keys(snap.months || {}).forEach(ym => { const b = (snap.months[ym] || {}).sessionsVault; if (b && b.ct) m[ym] = b; });
    if (v && v.ct) localStorage.setItem(LSVAULT, JSON.stringify({ v, m, at: Date.now() }));
    else if (allowVaultDrop) localStorage.removeItem(LSVAULT);
  } catch (e) {}
}
function readVaultSidecar(){ try { return JSON.parse(localStorage.getItem(LSVAULT) || 'null'); } catch (e) { return null; } }
/* put the vault back if the main copy came back without it */
function recoverVault(){
  const side = readVaultSidecar();
  if (!side || !side.v || !side.v.ct) return false;
  let fixed = false;
  if (!((S.ref.dog || {}).vault || {}).ct) { S.ref.dog.vault = side.v; S.ref.dog.clients = []; fixed = true; }
  Object.keys(side.m || {}).forEach(ym => {
    const mo = S.months[ym]; if (!mo) return;
    if (!((mo.sessionsVault || {}).ct)) { mo.sessionsVault = side.m[ym]; mo.sessions = []; fixed = true; }
  });
  return fixed;
}
function writeLocal(){
  try {
    const snap = sealedSnapshot();
    writeVaultSidecar(snap);
    if (!allowVaultDrop) {
      const prev = readLocal();
      const pv = (((prev.ref || {}).dog) || {}).vault;
      if (pv && pv.ct && !((snap.ref.dog || {}).vault || {}).ct) {
        snap.ref.dog = Object.assign({}, snap.ref.dog, { vault: pv, clients: [] });
        if (typeof VAULTDROP === 'function') VAULTDROP(new Error('vault would have been dropped').stack);
      }
      Object.keys(prev.months || {}).forEach(ym => {
        const p = (prev.months[ym] || {}).sessionsVault;
        if (p && p.ct && snap.months[ym] && !((snap.months[ym].sessionsVault) || {}).ct)
          snap.months[ym] = Object.assign({}, snap.months[ym], { sessionsVault: p, sessions: [] });
      });
    }
    localStorage.setItem(LSKEY, JSON.stringify(snap));
  } catch (e) {}
}
function writeLocalDropping(){ allowVaultDrop = true; try { writeLocal(); try { localStorage.removeItem(LSVAULT); } catch (e) {} } finally { allowVaultDrop = false; } }

function month(ym){ if (!S.months[ym]) S.months[ym] = blankMonth(); return S.months[ym]; }
function day(d){ const m = month(ymOf(d)); if (!m.days[d]) m.days[d] = blankDay(); return m.days[d]; }
function dayRO(d){ const m = S.months[ymOf(d)]; return (m && m.days[d]) || blankDay(); }
function week(k){ const y = k.slice(0,4); if (!S.weeks[y]) S.weeks[y] = {}; if (!S.weeks[y][k]) S.weeks[y][k] = blankWeek(); return S.weeks[y][k]; }
function weekRO(k){ const y = S.weeks[k.slice(0,4)]; return (y && y[k]) || blankWeek(); }

/* every month present, oldest first */
const monthKeys = () => Object.keys(S.months).sort();
/* flatten one array field across all loaded months */
function across(field){ const out = []; monthKeys().forEach(ym => (S.months[ym][field] || []).forEach(r => out.push(r))); return out; }

/* ---------- persistence ---------- */
const pending = new Set(); let flushT = null; let sealChain = Promise.resolve();
function save(path){
  pending.add(path);
  if (typeof SEC !== 'undefined' && SEC.on && SEC.key) { sealChain = sealChain.then(reseal).then(writeLocal).catch(() => {}); }
  else writeLocal();
  clearTimeout(flushT); flushT = setTimeout(() => { sealChain.then(flush); }, 700);
  if (typeof scheduleSync === 'function') scheduleSync();
}
function bodyFor(path){
  const p = path.split('/'), snap = sealedSnapshot();
  if (p[0] === 'ref')    return snap.ref[p[1]] || {};
  if (p[0] === 'months') return snap.months[p[1]] || blankMonth();
  if (p[0] === 'weeks')  return { weeks: snap.weeks[p[1]] || {} };
  return {};
}
async function flush(){
  if (!S.db) { pending.clear(); return; }
  const jobs = [...pending]; pending.clear();
  for (const path of jobs) {
    try { await S.db.doc(path).set(bodyFor(path)); }
    catch (e) {
      if (e && e.code === 'quota_exceeded') toast('Storage is full — delete some old records.');
      else if (e && (e.code === 'unavailable')) { pending.add(path); clearTimeout(flushT); flushT = setTimeout(flush, 4000); }
      else if (e && e.code === 'revoked') { S.mode = 'local'; paintRail(); }
    }
  }
}
const saveRef   = k  => save('ref/' + k);
const saveMonth = ym => save('months/' + ym);
const saveWeek  = k  => save('weeks/' + k.slice(0,4));
const saveDay   = d  => saveMonth(ymOf(d));

/* ---------- boot ---------- */
async function boot(){
  const l = readLocal();
  if (l.ref)    Object.keys(REFS).forEach(k => { if (l.ref[k]) S.ref[k] = Object.assign(REFS[k](), l.ref[k]); });
  if (l.months) S.months = l.months;
  if (l.weeks)  S.weeks  = l.weeks;
  if (recoverVault()) toast('Recovered your encryption key from a backup copy.');
  noteVault(); applyCustomFoods(); migrateClients(); migrateWorkouts(); migrateClasses();
  render();

  let db = null;
  try { db = await claude.use('db'); } catch (e) {}
  if (!db) { S.mode = 'local'; paintRail(); lightUpExtras(); return; }
  S.db = db;

  const ms = []; let c = ymOf(todayISO());
  for (let i = 0; i < 6; i++) { ms.push(c); const p = c.split('-'); let y = +p[0], m = +p[1] - 1; if (m === 0) { m = 12; y--; } c = y + '-' + pad(m); }
  const years = [...new Set([todayISO().slice(0,4), ...Object.keys(S.weeks)])];
  const paths = [...Object.keys(REFS).map(k => 'ref/' + k), ...ms.map(m => 'months/' + m), ...years.map(y => 'weeks/' + y)];

  try {
    const snaps = await Promise.all(paths.map(p => db.doc(p).get().catch(() => null)));
    paths.forEach((path, i) => {
      const sn = snaps[i]; const p = path.split('/');
      if (sn && sn.exists) {
        const d = sn.data() || {};
        if (p[0] === 'ref')    S.ref[p[1]]    = Object.assign(REFS[p[1]](), JSON.parse(JSON.stringify(d)));
        if (p[0] === 'months') S.months[p[1]] = Object.assign(blankMonth(), JSON.parse(JSON.stringify(d)));
        if (p[0] === 'weeks')  S.weeks[p[1]]  = JSON.parse(JSON.stringify(d.weeks || {}));
      } else if (hasLocal(path)) { pending.add(path); }
    });
    S.mode = 'live';
    if (pending.size) flush();
  } catch (e) { S.mode = 'local'; }
  recoverVault(); noteVault(); applyCustomFoods(); migrateClients(); migrateWorkouts(); migrateClasses(); writeLocal(); render(); lightUpExtras();
}
function hasLocal(path){
  const p = path.split('/');
  if (p[0] === 'ref')    return JSON.stringify(S.ref[p[1]] || {}) !== JSON.stringify(REFS[p[1]]());
  if (p[0] === 'months') return !!S.months[p[1]] && JSON.stringify(S.months[p[1]]) !== JSON.stringify(blankMonth());
  if (p[0] === 'weeks')  return !!S.weeks[p[1]] && Object.keys(S.weeks[p[1]]).length > 0;
  return false;
}
async function lightUpExtras(){
  try { S.dl = await claude.use('downloads'); } catch (e) {}
  try { S.ai = await claude.use('sample'); } catch (e) {}
  paintRail(); if (S.view === 'money' || S.view === 'week') render();
}
/* load a month on demand when the user navigates back in time */
async function ensureMonth(ym){
  if (S.months[ym] || !S.db) return;
  try { const sn = await S.db.doc('months/' + ym).get(); if (sn.exists) { S.months[ym] = Object.assign(blankMonth(), JSON.parse(JSON.stringify(sn.data() || {}))); writeLocal(); render(); } else { month(ym); } }
  catch (e) { month(ym); }
}

/* ---------- chrome ---------- */
let toastT = null;
function toast(msg){
  let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = 'none'; }, 2600);
}
function paintRail(){
  const groups = [['today','week'], ['move','food','work','dog','money','play'], ['dash','privacy']];
  const btns = groups.map(g => g.map(id => {
    const a = AREA[id];
    return `<button class="navb ${S.view===id?'on':''}" data-go="${id}" style="--c:${a.c}">
      <span class="dot" style="background:${a.c}"></span>${esc(a.name)}</button>`;
  }).join('')).join('<div class="navsep"></div>');
  $('#rail').innerHTML =
    `<div class="brand"><b>Six Threads</b><span>${esc(fmtDay(todayISO()))}</span></div>${btns}
     <div class="railfoot">
       <span class="syncpill ${S.mode}"><i></i>${S.mode === 'live' ? 'Synced across devices' : 'Saved on this device'}</span>
       <button class="btn ghost sm" data-act="theme">Switch theme</button>
     </div>`;
  $('#mobnav').innerHTML = AREAS.map(a =>
    `<button class="${S.view===a.id?'on':''}" data-go="${a.id}" style="--c:${a.c}">${esc(a.name)}</button>`).join('');
}
function go(v){ S.view = v; window.scrollTo(0,0); render(); }
function head(area, title, sub, right, eyebrow){
  const a = AREA[area] || {};
  return `<div class="head" style="--c:${a.c||'var(--line-2)'}">
    <div><div class="eyebrow" style="--c:${a.c||'var(--faint)'}">${esc(eyebrow || a.name || '')}</div>
      <h1>${esc(title)}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    <div class="row">${right || ''}</div></div>`;
}
function tabs(view, list){
  const cur = S.tab[view] || list[0][0];
  return `<div class="tabs" style="--c:${(AREA[view]||{}).c}">` + list.map(t =>
    `<button class="${cur===t[0]?'on':''}" data-tab="${view}:${t[0]}">${esc(t[1])}</button>`).join('') + `</div>`;
}
const curTab = (view, def) => S.tab[view] || def;
</script>

<script>
/* ============================================================
   FORMS — one generic dialog builder used by every "add" button,
   so a new record type costs a field list, not a new screen.
   ============================================================ */
let formSubmit = null;
function openForm(title, fields, onSubmit, opts){
  const dlg = $('#dlg');
  formSubmit = { fields, onSubmit };
  dlg.innerHTML = `<form method="dialog" id="frm">
    <h3 style="font-size:19px;margin-bottom:14px">${esc(title)}</h3>
    <div class="stack">${fields.map(fieldHTML).join('')}</div>
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button type="button" class="btn ghost" data-act="close">Cancel</button>
      <button type="submit" class="btn">${esc((opts && opts.ok) || 'Save')}</button>
    </div></form>`;
  dlg.showModal();
  const first = dlg.querySelector('input:not([type=checkbox]),select,textarea'); if (first) first.focus();
}
function fieldHTML(f){
  const id = 'f_' + f.k, v = f.val == null ? '' : f.val;
  if (f.type === 'dow') { const on = Array.isArray(f.val) ? f.val.map(Number) : [];
    return `<div class="f"><span style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700">${esc(f.label)}</span>
      <div class="row" style="gap:4px;margin-top:4px">${[1,2,3,4,5,6,0].map(n =>
        `<label class="dowb ${on.includes(n)?'on':''}"><input type="checkbox" data-dow="${f.k}" value="${n}" ${on.includes(n)?'checked':''}>${DOW[n]}</label>`).join('')}</div></div>`; }
  if (f.type === 'check') return `<label class="row" style="gap:8px"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}><span>${esc(f.label)}</span></label>`;
  if (f.type === 'textarea') return `<label class="f"><span>${esc(f.label)}</span><textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></label>`;
  if (f.type === 'select') return `<label class="f"><span>${esc(f.label)}</span><select id="${id}">${
    f.opts.map(o => { const val = Array.isArray(o) ? o[0] : o, lab = Array.isArray(o) ? o[1] : o;
      return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select></label>`;
  const t = f.type === 'num' ? 'number' : (f.type || 'text');
  const step = f.type === 'num' ? ` step="${f.step || 'any'}"` : '';
  return `<label class="f"><span>${esc(f.label)}</span><input type="${t}"${step} id="${id}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"></label>`;
}
function readForm(){
  const out = {};
  formSubmit.fields.forEach(f => {
    if (f.type === 'dow') { out[f.k] = [...$('#dlg').querySelectorAll(`[data-dow="${f.k}"]`)].filter(x => x.checked).map(x => +x.value); return; }
    const el = $('#f_' + f.k); if (!el) return;
    out[f.k] = f.type === 'check' ? el.checked : (f.type === 'num' ? num(el.value) : el.value.trim());
  });
  return out;
}
function rowGroup(fields){ return `<div class="row" style="gap:10px">${fields.map(fieldHTML).join('')}</div>`; }

/* helper: <select> of the six threads */
const threadOpts = () => THREADS.map(t => [t, AREA[t].name]);
const catOpts = () => (S.ref.money.cats.length ? S.ref.money.cats.map(c => [c.id, c.name]) : [['', 'Add categories in Money first']]);
const clientOpts = () => (S.ref.dog.clients.length ? S.ref.dog.clients.map(c => [c.id, c.label + (c.dogName ? ' · ' + c.dogName : '')]) : [['', 'Add a booking record in Dog Business first']]);
const hobbyOpts = () => (S.ref.play.hobbies.length ? S.ref.play.hobbies.map(h => [h.id, h.name]) : [['', 'Add a hobby in Hobbies first']]);
const projOpts = () => [['', '—']].concat(S.ref.work.projects.map(p => [p.id, p.name]));
const nameOf = (list, id, key) => { const f = (list || []).find(x => x.id === id); if (!f) return '';
  return f[key || (f.label != null ? 'label' : 'name')] || ''; };
/* Contact details were deliberately removed: the app holds a reference you
   choose, never a person's name, number or address. Anything stored under the
   old shape is folded into the label and the rest discarded on first load. */
function migrateClients(){
  let changed = false;
  const D = S.ref.dog;
  (D.clients || []).forEach(c => {
    if (c.label == null) { c.label = c.name || c.dogName || 'Unnamed'; changed = true; }
    ['name','phone','email','address'].forEach(k => { if (k in c) { delete c[k]; changed = true; } });
  });
  /* one dog became several */
  D.mydogs = D.mydogs || [];
  if (D.pupName && !D.mydogs.length) { D.mydogs.push({ id: uid(), name: D.pupName }); changed = true; }
  D.courses = D.courses || []; D.enrols = D.enrols || [];
  /* single billing status becomes two ticks */
  monthKeys().forEach(ym => { let hit = false;
    (S.months[ym].sessions || []).forEach(x => {
      if (x.billed != null && x.inv == null) { x.inv = x.billed === 'invoiced' || x.billed === 'paid'; x.paid = x.billed === 'paid'; delete x.billed; hit = true; }
      if (x.inv == null) { x.inv = false; x.paid = false; hit = true; }
    });
    (S.months[ym].pupp || []).forEach(l => { if (!l.dogId && (D.mydogs || []).length === 1) { l.dogId = D.mydogs[0].id; hit = true; } });
    if (hit) saveMonth(ym); });
  if (changed) saveRef('dog');
}

/* ============================================================
   TODAY — the daily schedule that all six threads feed into
   ============================================================ */
function viewToday(){
  const d = S.date; materialise(d);
  const D = dayRO(d), isToday = d === todayISO();
  const wk = weekRO(weekKey(d));
  const m = S.months[ymOf(d)] || blankMonth();

  const sched = [...(D.sched || [])].sort((a, b) => String(a.time||'').localeCompare(String(b.time||'')));
  const doneN = sched.filter(s => s.done).length;

  const sessions = (m.sessions || []).filter(s => s.date === d);
  const spend = (m.tx || []).filter(t => t.date === d && t.kind === 'out').reduce((a, t) => a + num(t.amount), 0);
  const bills = (S.ref.money.bills || []).filter(b => b.active !== false && +b.day === toD(d).getDate());
  const plannedMeal = wk.plan[d] || {};
  const plannedW = wk.wplan[d] || '';
  const prio = (wk.priorities || []).filter(p => !p.done);

  const ci = D.ci || {};
  return head('today', isToday ? 'Today' : relDay(d), fmtLong(d), `
      <button class="btn ghost sm" data-act="day" data-v="-1">←</button>
      <input type="date" value="${esc(d)}" data-act="daypick" style="width:auto;padding:5px 8px" aria-label="Jump to a date">
      <button class="btn ghost sm" data-act="day" data-v="1">→</button>
      ${isToday ? '' : '<button class="btn ghost sm" data-act="day" data-v="0">Today</button>'}`, 'The day')
  + `<div class="grid g4" style="margin-bottom:16px">
      <div class="card"><div class="stat"><div class="k">Blocks done</div><div class="v">${doneN}<span style="font-size:16px;color:var(--faint)">/${sched.length}</span></div>
        <div class="m">${sched.length ? Math.round(doneN/sched.length*100) + '% of the plan' : 'Nothing scheduled yet'}</div></div></div>
      <div class="card" style="--c:var(--a-move)"><div class="stat"><div class="k">Movement</div>
        <div class="v" style="font-size:20px;padding-top:5px">${(D.workouts||[]).length ? esc((D.workouts||[]).map(w => actOf(w.type).name.split(' — ')[0]).join(', ')) : (plannedW ? '<span style="color:var(--muted)">' + esc(plannedW) + '</span>' : '—')}</div>
        <div class="m">${(D.workouts||[]).length ? (D.workouts||[]).reduce((a,w)=>a+num(w.mins),0) + ' min' + (bodyKg() ? ' · ' + (D.workouts||[]).reduce((a,w)=>a+(kcalOf(w)||0),0) + ' kcal' : '') : (plannedW ? 'Planned, not logged' : 'Nothing planned')}</div></div></div>
      <div class="card" style="--c:var(--a-money)"><div class="stat"><div class="k">Spent today</div><div class="v">${R0(spend)}</div>
        <div class="m">${bills.length ? bills.length + ' bill' + (bills.length>1?'s':'') + ' due today' : 'No bills due'}</div></div></div>
      <div class="card" style="--c:var(--a-dog)"><div class="stat"><div class="k">Dog sessions</div><div class="v">${sessions.length}</div>
        <div class="m">${sessions.length ? sessions.map(s => esc(nameOf(S.ref.dog.clients, s.clientId) || s.dog || 'Session')).join(', ') : 'None booked'}</div></div></div>
    </div>

    <div class="grid g2" style="grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)">
      <div class="stack">
        <div class="card">
          <div class="spread" style="margin-bottom:4px"><h3>The day</h3>
            <div class="row"><button class="btn ghost sm" data-act="tmplapply" data-d="${d}">Apply a template</button>
              <button class="btn sm" data-act="block+">Add block</button></div></div>
          <div class="note">Click an empty slot to add a block. Drag a block to move it, or drag its bottom edge to make it longer.</div>
          ${gridHTML([d], {now:isToday})}

<script>
/* ---------- tiny chart helpers (hand-rolled: no library needed) ---------- */
function spark(vals, color, h){
  h = h || 52;
  const pts = vals.filter(v => isFinite(v));
  if (pts.length < 2) return `<div class="empty" style="min-height:${h}px;display:flex;align-items:center">Not enough history yet.</div>`;
  const W = 300, P = 4, lo = Math.min(...pts), hi = Math.max(...pts), rng = (hi - lo) || 1;
  const x = i => P + i * (W - 2*P) / (pts.length - 1);
  const y = v => (h - P) - ((v - lo) / rng) * (h - 2*P);
  const line = pts.map((v,i) => (i?'L':'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = line + ` L ${x(pts.length-1).toFixed(1)} ${h} L ${x(0).toFixed(1)} ${h} Z`;
  const gid = 'g' + Math.random().toString(36).slice(2,8);
  return `<svg class="spark" style="height:${h}px" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" role="img" aria-label="trend">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1]).toFixed(1)}" r="3.2" fill="${color}"/></svg>`;
}
function bars(items, color, h){
  h = h || 90;
  if (!items.length) return `<div class="empty">Nothing to chart yet.</div>`;
  const hi = Math.max(...items.map(i => i.v), 1);
  return `<div class="row" style="align-items:flex-end;gap:6px;height:${h}px">${items.map(i =>
    `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%" title="${esc(i.k)}: ${esc(String(i.v))}">
      <div style="width:100%;background:${color};opacity:${i.v?0.85:0.15};border-radius:3px 3px 0 0;height:${Math.max(2, i.v/hi*(h-20))}px"></div>
      <span class="tiny dim" style="font-size:10px">${esc(i.k)}</span></div>`).join('')}</div>`;
}

      ${(W.shop||[]).length ? (W.shop||[]).map(s => `<div class="item ${s.got?'done':''}">
        <input type="checkbox" ${s.got?'checked':''} data-act="shopgot" data-id="${s.id}" data-w="${k}" style="--c:var(--a-food)">
        <div class="body"><div class="t">${esc(s.text)}</div></div>
        <button class="x" data-act="shop-" data-id="${s.id}" data-w="${k}">&times;</button></div>`).join('')
        : `<div class="empty">Empty. Add items, or pull them from the plan.</div>`}
      ${(W.shop||[]).some(s=>s.got) ? `<hr class="rule"><button class="btn ghost sm" data-act="shopclear" data-w="${k}">Clear ticked items</button>` : ''}
    </div>
  </div>`;
}

function weekReview(days, k, W){
  const m0 = S.months[ymOf(days[0])] || blankMonth();
  const stat = collectWeek(days);
  return `<div class="grid g4" style="margin-bottom:16px">
      <div class="card"><div class="stat"><div class="k">Blocks done</div><div class="v">${stat.done}<span style="font-size:16px;color:var(--faint)">/${stat.blocks}</span></div><div class="m">across all threads</div></div></div>
      <div class="card" style="--c:var(--a-move)"><div class="stat"><div class="k">Workouts</div><div class="v">${stat.workouts}</div><div class="m">${stat.moved} days you moved</div></div></div>
      <div class="card" style="--c:var(--a-work)"><div class="stat"><div class="k">Deep work</div><div class="v">${stat.focus.toFixed(1)}<span style="font-size:15px;color:var(--faint)"> h</span></div><div class="m">${stat.meetings.toFixed(1)} h in meetings</div></div></div>
      <div class="card" style="--c:var(--a-money)"><div class="stat"><div class="k">Spent</div><div class="v">${R0(stat.out)}</div><div class="m">${R0(stat.in)} in</div></div></div>
    </div>
    <div class="grid g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div class="card">
        <h3>How the week landed</h3><div class="note">Energy, Monday to Sunday</div>
        ${bars(days.map(d => ({k: DOW[toD(d).getDay()][0], v: num((dayRO(d).ci||{}).energy)})), 'var(--a-work)')}
        <hr class="rule">
        <div class="lbl" style="margin-bottom:6px">Priorities</div>
        ${(W.priorities||[]).length ? (W.priorities||[]).map(p => `<div class="item"><span class="chip" style="--c:${p.done?'var(--ok)':'var(--faint)'};--cbg:var(--raise)">${p.done?'done':'open'}</span><div class="body"><div class="t">${esc(p.text)}</div></div></div>`).join('') : `<div class="empty">None were set.</div>`}
      </div>
      <div class="card">
        <div class="spread" style="margin-bottom:4px"><h3>Your notes on the week</h3>
          ${S.ai ? `<button class="btn sm ghost" data-act="wreview" data-w="${k}">Draft a summary</button>` : ''}</div>
        <div class="note">What worked, what didn't, what moves into next week.</div>
        <textarea style="min-height:230px" data-act="wfield" data-w="${k}" data-k="review" placeholder="Write it in your own words — this is the bit you'll actually reread.">${esc(W.review||'')}</textarea>
      </div>
    </div>`;
}
function collectWeek(days){
  const s = {blocks:0, done:0, workouts:0, moved:0, focus:0, meetings:0, out:0, in:0, sessions:0, practice:0, energy:[]};
  days.forEach(d => {
    const D = dayRO(d), m = S.months[ymOf(d)] || blankMonth();
    s.blocks += (D.sched||[]).length; s.done += (D.sched||[]).filter(x=>x.done).length;
    if ((D.workouts||[]).length) { s.workouts += D.workouts.length; s.moved++; }
    const ci = D.ci || {}; s.focus += num(ci.focus); s.meetings += num(ci.meetings); if (ci.energy) s.energy.push(ci.energy);
    (m.tx||[]).filter(t=>t.date===d).forEach(t => { if (t.kind==='in') s.in += num(t.amount); else s.out += num(t.amount); });
    s.sessions += (m.sessions||[]).filter(x=>x.date===d).length;
    s.practice += (m.practice||[]).filter(x=>x.date===d).reduce((a,p)=>a+num(p.mins),0);
  });
  return s;
}

/* ============================================================
   EXERCISE — log, progression, routines
   ============================================================ */
/* MET = how many times harder than sitting still. Energy use is then
   MET x body weight (kg) x hours. Values from the Compendium of Physical
   Activities (2011/2024 editions) — the reference physiologists use.
   Estimates: real figures vary by 20-30% with pace, terrain and person. */
const ACT_DEF = [
  { id:'strength',  name:'Gym — strength',        met:6.0, sets:true },
  { id:'gym-easy',  name:'Gym — easy session',    met:3.5, sets:true },
  { id:'pilates',   name:'Pilates',               met:3.0 },
  { id:'yoga',      name:'Yoga / stretching',     met:2.5 },
  { id:'riding',    name:'Horse riding',          met:5.5 },
  { id:'stable',    name:'Stable work / grooming',met:4.5 },
  { id:'dogwalk',   name:'Dog walk',              met:3.0, dog:true },
  { id:'walk',      name:'Walking workout',       met:4.8 },
  { id:'walk-easy', name:'Walk — easy pace',      met:3.8 },
  { id:'run',       name:'Run',                   met:8.5 },
  { id:'cycle',     name:'Cycling',               met:6.8 },
  { id:'swim',      name:'Swim',                  met:5.8 },
  { id:'hike',      name:'Hike',                  met:6.0 },
  { id:'circuit',   name:'Circuits / HIIT',       met:8.0 },
  { id:'other',     name:'Something else',        met:4.0 }
];
const acts = () => ACT_DEF.concat((S.ref.move && S.ref.move.acts) || []);
const actOf = id => acts().find(a => a.id === id) || acts()[acts().length - 1];
const actOpts = () => acts().map(a => [a.id, a.name]);
const bodyKg = () => num((S.ref.move || {}).weightKg);
/* kcal = MET x kg x hours. No weight recorded means no number rather than a wrong one. */
function kcalOf(w){
  const kg = bodyKg(), mins = num(w.mins);
  if (!kg || !mins) return null;
  const a = actOf(w.type);
  return Math.round((num(w.met) || (a ? a.met : 4)) * kg * (mins / 60));
}
/* every workout ever logged, flattened out of the per-day lists */
function allWorkouts(){
  const out = [];
  monthKeys().forEach(ym => Object.keys(S.months[ym].days || {}).forEach(d => {
    const D = S.months[ym].days[d];
    (D.workouts || []).forEach(w => out.push(Object.assign({ date: d }, w)));
    if (D.workout && !(D.workouts || []).length) out.push(Object.assign({ date: d, id: 'legacy-' + d, type: 'strength' }, D.workout));
  }));
  return out.sort((a,b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
}
/* the old one-workout-a-day shape becomes the first entry in the new list */
function migrateWorkouts(){
  monthKeys().forEach(ym => { let hit = false;
    Object.keys(S.months[ym].days || {}).forEach(d => { const D = S.months[ym].days[d];
      if (D.workout && !(D.workouts && D.workouts.length)) {
        D.workouts = [Object.assign({ id: uid(), type: 'strength' }, D.workout)];
        delete D.workout; hit = true;
      }
      if (!D.workouts) { D.workouts = []; hit = true; }
    });
    if (hit) saveMonth(ym); });
}

function viewMove(){
  const t = curTab('move','log');
  const body = {log: moveLog, targets: moveTargets, prog: moveProg, routines: moveRoutines}[t];
  const all = allWorkouts();
  const last30 = all.filter(w => w.date >= shift(todayISO(), -29));
  const wkDays = weekDays(S.date);
  const wkW = all.filter(w => wkDays.includes(w.date));
  const mins30 = last30.reduce((a,w) => a + num(w.mins), 0);
  const kcalWk = wkW.reduce((a,w) => a + (kcalOf(w) || 0), 0);
  return head('move', 'Exercise', 'Every kind of session, not just the gym — and how it adds up against what you meant to do.',
      `${bodyKg() ? '' : '<button class="btn ghost sm" data-act="setweight">Add weight</button>'}
       <button class="btn tint" style="--c:var(--a-move)" data-act="workout+">Log a workout</button>`)
    + `<div class="grid g4" style="margin-bottom:16px">
        <div class="card" style="--c:var(--a-move)"><div class="stat"><div class="k">This week</div><div class="v">${wkW.length}</div>
          <div class="m">${wkW.reduce((a,w)=>a+num(w.mins),0)} minutes${kcalWk ? ' · ' + kcalWk.toLocaleString('en-ZA') + ' kcal' : ''}</div></div></div>
        <div class="card" style="--c:var(--a-move)"><div class="stat"><div class="k">Current streak</div><div class="v">${streakDays(all.map(w=>w.date))}</div><div class="m">days in a row you moved</div></div></div>
        <div class="card" style="--c:var(--a-move)"><div class="stat"><div class="k">Last 30 days</div><div class="v">${last30.length}</div>
          <div class="m">${(mins30/60).toFixed(1)} hours in total</div></div></div>
        <div class="card" style="--c:var(--a-move)"><div class="stat"><div class="k">Last session</div>
          <div class="v" style="font-size:18px;padding-top:6px">${all.length ? esc(relDay(all[all.length-1].date)) : '—'}</div>
          <div class="m">${all.length ? esc(actOf(all[all.length-1].type).name) : 'nothing logged yet'}</div></div></div>
      </div>`
    + tabs('move', [['log','Sessions'],['targets','Targets'],['prog','Progression'],['routines','Routines & types']])
    + body(all);
}
const volume = w => (w.sets||[]).reduce((a,s) => a + num(s.reps) * num(s.weight), 0);
function streakDays(dates){
  const set = new Set(dates); let n = 0, d = todayISO();
  if (!set.has(d)) d = shift(d, -1);
  while (set.has(d)) { n++; d = shift(d, -1); }
  return n;
}
const EFF = n => n ? '●'.repeat(clamp(+n,0,5)) + '<span style="opacity:.3">' + '●'.repeat(5-clamp(+n,0,5)) + '</span>' : '';

function moveLog(all){
  const f = S.moveFilter || {};
  let list = [...all].reverse();
  if (f.type) list = list.filter(w => w.type === f.type);
  if (f.from)  list = list.filter(w => w.date >= f.from);
  if (f.to)    list = list.filter(w => w.date <= f.to);
  const total = list.length;
  const recent = f.all ? list : list.slice(0, 40);
  const types = [...new Set(all.map(w => w.type))];
  const last14 = Array.from({length:14}, (_,i) => shift(todayISO(), -13+i));
  const byDay = {}; all.forEach(w => { (byDay[w.date] = byDay[w.date] || []).push(w); });
  return `<div class="card" style="margin-bottom:16px;--c:var(--a-move)">
      <h3>Last fortnight</h3><div class="note">One square a day, darker where you did more than one thing.</div>
      <div class="streak" style="--c:var(--a-move)">${last14.map(d => { const n = (byDay[d]||[]).length;
        return `<i class="${n?'on':''} ${d===todayISO()?'today':''}" style="${n>1?'box-shadow:inset 0 0 0 2px var(--paper)':''}" title="${esc(fmtDay(d))}${n?': '+(byDay[d]||[]).map(w=>actOf(w.type).name).join(', '):''}"></i>`; }).join('')}</div>
    </div>
    <div class="card">
      <div class="spread" style="margin-bottom:4px"><h3>Sessions</h3>
        <span class="tiny dim">${total} of ${all.length} shown</span></div>
      <div class="note">Newest first. Click a session to change it.</div>
      <div class="row" style="gap:8px;margin-bottom:12px;align-items:flex-end">
        <label class="f" style="flex:0 0 170px"><span>Activity</span>
          <select data-act="movefilter" data-k="type"><option value="">Everything</option>
            ${types.map(t => `<option value="${esc(t)}" ${f.type===t?'selected':''}>${esc(actOf(t).name)}</option>`).join('')}</select></label>
        <label class="f" style="flex:0 0 140px"><span>From</span><input type="date" value="${esc(f.from||'')}" data-act="movefilter" data-k="from"></label>
        <label class="f" style="flex:0 0 140px"><span>To</span><input type="date" value="${esc(f.to||'')}" data-act="movefilter" data-k="to"></label>
        ${(f.type||f.from||f.to) ? `<button class="btn ghost sm" data-act="movefilter" data-k="clear">Clear</button>` : ''}
      </div>
      ${(() => { const sum = list.reduce((a,w) => ({ n:a.n+1, mins:a.mins+num(w.mins), kcal:a.kcal+(kcalOf(w)||0) }), {n:0,mins:0,kcal:0});
        return sum.n ? `<div class="row" style="gap:14px;margin-bottom:12px">
          <span class="pill">${sum.n} session${sum.n===1?'':'s'}</span>
          <span class="pill">${(sum.mins/60).toFixed(1)} hours</span>
          ${sum.kcal ? `<span class="pill">${sum.kcal.toLocaleString('en-ZA')} kcal</span>` : ''}</div>` : ''; })()}
      ${recent.length ? recent.map(w => { const a = actOf(w.type), k = kcalOf(w);
        return `<div class="item">
          <span class="pip" style="--c:var(--a-move);width:9px;height:9px;margin-top:6px"></span>
          <div class="body">
            <div class="spread"><div class="t">${esc(a.name)}${w.name ? ` <span class="dim">· ${esc(w.name)}</span>` : ''}</div>
              <div class="tiny dim mono">${esc(fmtDay(w.date))}${w.time ? ' ' + esc(w.time) : ''}</div></div>
            <div class="s">${[
                w.mins ? w.mins + ' min' : '',
                k ? k + ' kcal' : '',
                (w.sets||[]).length ? (w.sets||[]).length + ' sets · ' + Math.round(volume(w)).toLocaleString('en-ZA') + ' kg' : '',
                w.dogId ? nameOf(S.ref.dog.mydogs, w.dogId) : ''
              ].filter(Boolean).map(esc).join(' · ')}
              ${w.effort ? ` <span style="color:var(--a-move);letter-spacing:1px;font-size:10px">${EFF(w.effort)}</span>` : ''}</div>
            ${w.notes ? `<div class="s">${esc(w.notes)}</div>` : ''}
            ${(w.sets||[]).length ? `<div class="row" style="gap:5px;margin-top:6px">${(w.sets||[]).map(x => `<span class="chip out mono">${esc(x.ex)} ${esc(String(x.reps))}×${esc(String(x.weight))}</span>`).join('')}</div>` : ''}
          </div>
          <button class="btn ghost sm" data-act="workoutedit" data-d="${w.date}" data-id="${w.id}">Edit</button>
          <button class="x" data-act="workout-" data-d="${w.date}" data-id="${w.id}">&times;</button>
        </div>`; }).join('') : `<div class="empty">${total === 0 && all.length ? 'Nothing matches those filters.' : 'Nothing logged yet. Everything counts — pilates, a dog walk, the gym.'}</div>`}
      ${!f.all && total > 40 ? `<hr class="rule"><button class="btn ghost sm" data-act="moveall">Show all ${total}</button>` : ''}
    </div>`;
}

function moveTargets(all){
  const T = S.ref.move.targets || [];
  const days = weekDays(S.date);
  const wkW = all.filter(w => days.includes(w.date));
  const todayW = all.filter(w => w.date === todayISO());
  return `<div class="card" style="--c:var(--a-move);margin-bottom:16px">
      <div class="spread" style="align-items:flex-start">
        <div><h3>What you mean to do</h3>
          <div class="note" style="margin-bottom:0;max-width:64ch">How many of each, per week — and the most you'd want in any one day. Progress is counted from what you've actually logged.</div></div>
        <div class="row">${T.length ? `<button class="btn ghost sm" data-act="targets2plan">Feed these into my weekly plan</button>` : ''}
          <button class="btn tint" style="--c:var(--a-move)" data-act="target+">Set a target</button></div></div>
    </div>
    ${T.length ? `<div class="card" style="margin-bottom:16px">
      <h3>This week</h3><div class="note">${esc(fmtDay(days[0]))} – ${esc(fmtDay(days[6]))}</div>
      ${T.map(t => { const a = actOf(t.type);
        const done = wkW.filter(w => w.type === t.type).length;
        const want = num(t.perWeek), pct = want ? clamp(done/want*100, 0, 100) : 0;
        const todayN = todayW.filter(w => w.type === t.type).length;
        const overDay = num(t.perDay) && todayN > num(t.perDay);
        return `<div style="padding:11px 0;border-top:1px solid var(--line)">
          <div class="spread" style="margin-bottom:5px">
            <span class="row" style="gap:8px"><b>${esc(a.name)}</b>
              ${done >= want ? `<span class="chip" style="--c:var(--ok);--cbg:var(--raise)">done</span>` : ''}
              ${overDay ? `<span class="chip" style="--c:var(--warn);--cbg:var(--raise)">${todayN} today, more than the ${t.perDay} you wanted</span>` : ''}</span>
            <span class="row"><span class="num tiny">${done} of ${want}</span>
              <button class="x" data-act="targetedit" data-id="${t.id}" style="font-size:12px;color:var(--faint)">edit</button>
              <button class="x" data-act="target-" data-id="${t.id}">&times;</button></span></div>
          <div class="bar" style="--c:${done>=want?'var(--ok)':'var(--a-move)'}"><i style="width:${pct}%"></i></div>
          <div class="tiny dim" style="margin-top:4px">${num(t.mins)} min each${num(t.perDay) ? ' · at most ' + t.perDay + ' a day' : ''}${done < want ? ' · ' + (want-done) + ' to go' : ''}</div>
        </div>`; }).join('')}
      <hr class="rule">
      <div class="spread"><span class="dim">All activity this week</span>
        <span class="num">${wkW.length} sessions · ${wkW.reduce((a,w)=>a+num(w.mins),0)} min${bodyKg() ? ' · ' + wkW.reduce((a,w)=>a+(kcalOf(w)||0),0).toLocaleString('en-ZA') + ' kcal' : ''}</span></div>
    </div>` : `<div class="card"><div class="empty">No targets set. "Three gym sessions and two walks a week" is enough to start with.</div></div>`}

    <div class="card">
      <h3>Twelve-week picture</h3><div class="note">Sessions a week, all activity types</div>
      ${bars(Array.from({length:12}, (_,i) => { const mon = shift(mondayOf(todayISO()), -(11-i)*7);
        const wd = weekDays(mon);
        return { k: mon.slice(8) + '/' + mon.slice(5,7), v: all.filter(w => wd.includes(w.date)).length }; }), 'var(--a-move)', 110)}
    </div>`;
}

function moveProg(all){
  const exs = [...new Set(all.flatMap(w => (w.sets||[]).map(s => s.ex).filter(Boolean)))].sort();
  const pick = S.pickEx && exs.includes(S.pickEx) ? S.pickEx : exs[0];
  const series = all.map(w => {
    const mine = (w.sets||[]).filter(s => s.ex === pick);
    if (!mine.length) return null;
    return { date: w.date, best: Math.max(...mine.map(s => num(s.weight))), reps: Math.max(...mine.map(s => num(s.reps))), vol: mine.reduce((a,s)=>a+num(s.reps)*num(s.weight),0) };
  }).filter(Boolean);
  const byType = {}; all.forEach(w => { byType[w.type] = (byType[w.type]||0) + 1; });
  const mins = {}; all.forEach(w => { mins[w.type] = (mins[w.type]||0) + num(w.mins); });
  const top = Object.keys(byType).sort((a,b) => byType[b]-byType[a]);
  return `<div class="grid g2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
    <div class="card" style="--c:var(--a-move)">
      <div class="spread" style="margin-bottom:12px"><h3>Strength progression</h3>
        ${exs.length ? `<select style="width:auto;min-width:180px" data-act="pickex">${exs.map(e => `<option ${e===pick?'selected':''}>${esc(e)}</option>`).join('')}</select>` : ''}</div>
      ${!exs.length ? `<div class="empty">Log a gym session with exercise names and this fills in on its own.</div>` : `
        <div class="grid g3" style="margin-bottom:16px">
          <div class="stat"><div class="k">Best ever</div><div class="v">${Math.max(...series.map(s=>s.best), 0)}<span style="font-size:14px;color:var(--faint)"> kg</span></div></div>
          <div class="stat"><div class="k">Sessions</div><div class="v">${series.length}</div></div>
          <div class="stat"><div class="k">Change</div><div class="v" style="color:${series.length>1 && series[series.length-1].best >= series[0].best ? 'var(--ok)' : 'var(--muted)'}">${series.length>1 ? (series[series.length-1].best - series[0].best >= 0 ? '+' : '') + (series[series.length-1].best - series[0].best) : '0'}<span style="font-size:14px;color:var(--faint)"> kg</span></div></div>
        </div>
        <div class="lbl" style="margin-bottom:4px">Heaviest set, over time</div>
        ${spark(series.map(s=>s.best), 'var(--a-move)', 90)}
        <hr class="rule">
        <div class="tw"><table><thead><tr><th>Date</th><th class="n">Top weight</th><th class="n">Top reps</th><th class="n">Volume</th></tr></thead><tbody>
          ${[...series].reverse().slice(0,15).map(s => `<tr><td class="mono">${esc(fmtDay(s.date))}</td><td class="n">${s.best}</td><td class="n">${s.reps}</td><td class="n">${Math.round(s.vol)}</td></tr>`).join('')}
        </tbody></table></div>`}
    </div>
    <div class="card">
      <h3>What you actually do</h3><div class="note">Every session you've logged, by type</div>
      ${top.length ? top.map(t => { const a = actOf(t), mx = Math.max(...Object.values(byType));
        return `<div style="padding:8px 0;border-top:1px solid var(--line)">
          <div class="spread" style="margin-bottom:5px"><b>${esc(a.name)}</b>
            <span class="num tiny">${byType[t]}× · ${(mins[t]/60).toFixed(1)} h</span></div>
          <div class="bar" style="--c:var(--a-move)"><i style="width:${byType[t]/mx*100}%"></i></div></div>`; }).join('')
        : `<div class="empty">Nothing logged yet.</div>`}
      ${(() => { const e = all.filter(w => w.effort);
        return e.length > 3 ? `<hr class="rule"><div class="lbl" style="margin-bottom:4px">How hard it has felt</div>${spark(e.slice(-30).map(w=>num(w.effort)), 'var(--a-move)', 70)}
          <div class="tiny dim" style="margin-top:5px">Average ${(e.reduce((a,w)=>a+num(w.effort),0)/e.length).toFixed(1)} out of 5 across ${e.length} sessions.</div>` : ''; })()}
    </div>
  </div>`;
}

function moveRoutines(){
  const rs = S.ref.move.routines || [], custom = S.ref.move.acts || [];
  return `<div class="grid g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="card" style="--c:var(--a-move)">
      <div class="spread" style="margin-bottom:10px"><h3>Gym routines</h3><button class="btn sm tint" style="--c:var(--a-move)" data-act="routine+">Add routine</button></div>
      <div class="note" style="margin-top:-6px">Name a session once and its exercises pre-fill every time you log it.</div>
      ${rs.length ? rs.map(r => `<div class="item"><div class="body"><div class="t">${esc(r.name)}</div>
          <div class="s">${(r.exercises||[]).length ? esc((r.exercises||[]).join(' · ')) : 'no exercises listed'}</div></div>
        <button class="btn ghost sm" data-act="routineedit" data-id="${r.id}">Edit</button>
        <button class="x" data-act="routine-" data-id="${r.id}">&times;</button></div>`).join('')
        : `<div class="empty">No routines yet — e.g. "Upper body A", "Long run".</div>`}
    </div>
    <div class="card">
      <div class="spread" style="margin-bottom:10px"><h3>Activity types</h3><button class="btn sm ghost" data-act="act+">Add a type</button></div>
      <div class="note" style="margin-top:-6px">The effort figure (METs) is what turns minutes into an energy estimate. These come from the Compendium of Physical Activities — the reference physiologists use.</div>
      ${bodyKg() ? `<div class="spread" style="padding:8px 0"><span class="dim">Your weight, for the estimate</span>
          <span class="row"><span class="num">${bodyKg()} kg</span><button class="x" data-act="setweight" style="font-size:12px;color:var(--faint)">change</button></span></div>`
        : `<div class="warn" style="margin:8px 0">No energy estimates until you add a body weight. <button class="x" data-act="setweight" style="font-size:12px;color:var(--a-move)">Add it</button> — it stays in this app.</div>`}
      <hr class="rule">
      <div class="tw"><table><thead><tr><th>Activity</th><th class="n">METs</th><th class="n">30 min</th><th></th></tr></thead><tbody>
        ${acts().map(a => `<tr><td>${esc(a.name)}${a.sets ? ' <span class="dim tiny">sets</span>' : ''}</td>
          <td class="n">${a.met}</td>
          <td class="n">${bodyKg() ? Math.round(a.met * bodyKg() * 0.5) + ' kcal' : '—'}</td>
          <td class="n">${custom.some(c => c.id === a.id) ? `<button class="x" data-act="act-" data-id="${a.id}">&times;</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="tiny dim" style="margin-top:9px">Estimates only. Pace, terrain and how you're built move these by 20–30%.</div>
    </div>
  </div>`;
}

/* ============================================================
   EATING — the meal bank, the plan, the list
   ============================================================ */
function viewFood(){
  const t = curTab('food','bank');
  const body = {bank: foodBank, plan: foodPlan, nutrition: foodNutrition}[t];
  return head('food', 'Eating', 'Decide once a week so you never decide at 18:00 on a Tuesday.',
      `<button class="btn tint" style="--c:var(--a-food)" data-act="recipe+">Add a meal</button>`)
    + tabs('food', [['bank','Meal bank'],['plan','Next two weeks'],['nutrition','Nutrition']])
    + body();
}
function foodBank(){
  const rs = S.ref.food.recipes || [];
  const tags = [...new Set(rs.map(r => r.tag).filter(Boolean))];
  const wk = weekRO(weekKey(todayISO()));
  const usedThisWeek = new Set(Object.values(wk.plan||{}).flatMap(p => Object.values(p||{})).filter(Boolean));
  return `<div class="grid g2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
    <div class="card" style="--c:var(--a-food)">
      <h3>Meals you actually cook</h3>
      <div class="note">Build this up once and weekly planning becomes ticking boxes. Ingredients feed the shopping list.</div>
      ${rs.length ? rs.map(r => { const a = recipeNut(r), ps = perServing(a.totals, r); const known = a.priced || a.estimated;
        return `<div class="item">
          <div class="body"><div class="spread"><div class="t">${esc(r.name)}</div>
            ${usedThisWeek.has(r.name) ? `<span class="chip" style="--c:var(--a-food);--cbg:var(--a-food-bg)">on this week</span>` : ''}</div>
            <div class="s">${r.tag ? esc(r.tag) + ' · ' : ''}${r.mins ? esc(String(r.mins)) + ' min · ' : ''}serves ${servesOf(r)}</div>
            <div class="s" style="color:${known ? 'var(--ink-2)' : 'var(--faint)'}">${known
              ? `<span class="num">${fmtN('kcal', ps.kcal)} kcal</span> · ${fmtN('protein', ps.protein)}g protein · ${fmtN('carbs', ps.carbs)}g carbs · ${fmtN('fat', ps.fat)}g fat <span class="dim">per serving</span>${a.estimated ? ' · estimated' : (a.coverage < 1 ? ' · ' + a.priced + '/' + a.lines + ' ingredients priced' : '')}`
              : 'add quantities to the ingredients and this fills in'}</div>
            <div class="s dim tiny">${esc(r.ings || 'no ingredients listed')}</div></div>
          ${(!a.priced && S.ai) ? `<button class="btn ghost sm" data-act="nutest" data-id="${r.id}">Estimate</button>` : ''}
          <button class="btn ghost sm" data-act="recipeedit" data-id="${r.id}">Edit</button>
          <button class="x" data-act="recipe-" data-id="${r.id}">&times;</button></div>`; }).join('')
        : `<div class="empty">Nothing here yet. Add five or six meals you make often — that's enough to plan from.</div>`}
    </div>
    <div class="card">
      <h3>Rotation check</h3><div class="note">How often each meal has been planned in the last eight weeks.</div>
      ${(() => {
        const counts = {};
        Object.keys(S.weeks).forEach(y => Object.keys(S.weeks[y]).forEach(k => {
          Object.values(S.weeks[y][k].plan || {}).forEach(p => Object.values(p||{}).forEach(v => { if (v) counts[v] = (counts[v]||0)+1; }));
        }));
        const list = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,12);
        return list.length ? list.map(([n,c]) => `<div class="item"><div class="body"><div class="spread"><div class="t">${esc(n)}</div><div class="num">${c}×</div></div></div></div>`).join('')
          : `<div class="empty">Plan a week of meals and this shows what you lean on.</div>`;
      })()}
      ${tags.length ? `<hr class="rule"><div class="lbl" style="margin-bottom:6px">Your tags</div><div class="row">${tags.map(t => `<span class="chip out">${esc(t)}</span>`).join('')}</div>` : ''}
    </div>
  </div>`;
}
function foodPlan(){
  const k1 = weekKey(todayISO()), k2 = weekKey(shift(mondayOf(todayISO()), 7));
  return [k1, k2].map((k, n) => {
    const days = weekDays(n ? shift(mondayOf(todayISO()), 7) : todayISO()), W = week(k);
    return `<div class="card" style="--c:var(--a-food);margin-bottom:16px">
      <h3>${n ? 'Next week' : 'This week'} <span class="dim tiny mono" style="font-weight:400">${esc(k)}</span></h3>
      <div class="note">${esc(fmtDay(days[0]))} – ${esc(fmtDay(days[6]))}</div>
      <div class="tw"><table><thead><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead><tbody>
      ${days.map(d => `<tr><td style="white-space:nowrap"><b>${DOW[toD(d).getDay()]}</b> <span class="dim mono tiny">${+d.slice(8)}</span></td>
        ${['b','l','d'].map(mk => `<td><input type="text" list="mealbank2" value="${esc(((W.plan||{})[d]||{})[mk] || '')}" data-act="plan" data-w="${k}" data-d="${d}" data-k="${mk}" placeholder="—"></td>`).join('')}</tr>`).join('')}
      </tbody></table></div></div>`;
  }).join('') + `<datalist id="mealbank2">${(S.ref.food.recipes||[]).map(r => `<option value="${esc(r.name)}"></option>`).join('')}</datalist>`;
}
</script>

<script>
/* ============================================================
   WORK — priorities, projects, focus, and the evidence file
   ============================================================ */
function viewWork(){
  const t = curTab('work','projects');
  const body = {projects: workProjects, focus: workFocus, wins: workWins, decisions: workDecisions}[t];
  return head('work', 'Work', 'Your own record — separate from whatever the ticket system thinks.')
    + tabs('work', [['projects','Projects'],['focus','Focus & energy'],['wins','Evidence file'],['decisions','Decisions']])
    + body();
}
const WSTATUS = ['On track','At risk','Blocked','Parked','Done'];
const wsColor = s => ({'On track':'var(--ok)','At risk':'var(--warn)','Blocked':'var(--bad)','Parked':'var(--faint)','Done':'var(--muted)'}[s] || 'var(--muted)');

function workProjects(){
  const ps = S.ref.work.projects || [];
  const k = weekKey(todayISO()), W = weekRO(k);
  const open = ps.filter(p => p.status !== 'Done');
  return `<div class="grid g2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
    <div class="card" style="--c:var(--a-work)">

function workFocus(){
  const days = Array.from({length:28}, (_,i) => shift(todayISO(), -27+i));
  const rows = days.map(d => { const ci = dayRO(d).ci || {}; return {d, focus:num(ci.focus), meet:num(ci.meetings), en:num(ci.energy)}; });
  const withData = rows.filter(r => r.focus || r.meet || r.en);
  const tf = rows.reduce((a,r)=>a+r.focus,0), tm = rows.reduce((a,r)=>a+r.meet,0);
  const ens = rows.filter(r=>r.en);
  const hiE = ens.filter(r=>r.en>=4), loE = ens.filter(r=>r.en<=2);
  const avg = a => a.length ? a.reduce((x,r)=>x+r.focus,0)/a.length : 0;
  return `<div class="grid g4" style="margin-bottom:16px">
      <div class="card" style="--c:var(--a-work)"><div class="stat"><div class="k">Deep work, 28 days</div><div class="v">${tf.toFixed(0)}<span style="font-size:15px;color:var(--faint)"> h</span></div><div class="m">${(tf/4).toFixed(1)} h a week</div></div></div>
      <div class="card" style="--c:var(--a-work)"><div class="stat"><div class="k">Meetings</div><div class="v">${tm.toFixed(0)}<span style="font-size:15px;color:var(--faint)"> h</span></div><div class="m">${tf+tm ? Math.round(tm/(tf+tm)*100) : 0}% of tracked time</div></div></div>
      <div class="card" style="--c:var(--a-work)"><div class="stat"><div class="k">Average energy</div><div class="v">${ens.length ? (ens.reduce((a,r)=>a+r.en,0)/ens.length).toFixed(1) : '—'}</div><div class="m">out of 5, over ${ens.length} check-ins</div></div></div>
      <div class="card" style="--c:var(--a-work)"><div class="stat"><div class="k">Check-ins</div><div class="v">${withData.length}<span style="font-size:15px;color:var(--faint)">/28</span></div><div class="m">days with anything logged</div></div></div>
    </div>
    <div class="grid g2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">
      <div class="card">
        <h3>Deep work, day by day</h3><div class="note">Last four weeks. Gaps are days you didn't check in.</div>
        ${bars(rows.slice(-14).map(r => ({k: String(+r.d.slice(8)), v: r.focus})), 'var(--a-work)', 110)}
        <hr class="rule">
        <div class="lbl" style="margin-bottom:4px">Energy trend</div>
        ${spark(rows.filter(r=>r.en).map(r=>r.en), 'var(--a-work)', 70)}
      </div>
      <div class="card">
        <h3>What the numbers say</h3><div class="note">Only as good as your check-ins — but it adds up fast.</div>
        ${ens.length < 6 ? `<div class="empty">Check in for a week or two and a real pattern shows up here.</div>` : `
          <div class="item"><div class="body"><div class="s">On your high-energy days (4–5)</div>
            <div class="t num">${avg(hiE).toFixed(1)} h deep work</div></div></div>
          <div class="item"><div class="body"><div class="s">On your low-energy days (1–2)</div>
            <div class="t num">${avg(loE).toFixed(1)} h deep work</div></div></div>
          <div class="item"><div class="body"><div class="s">Days you trained</div>
            <div class="t num">${(() => { const t = rows.filter(r => (dayRO(r.d).workouts||[]).length && r.en); return t.length ? (t.reduce((a,r)=>a+r.en,0)/t.length).toFixed(1) : '—'; })()} average energy</div></div></div>
          <div class="item"><div class="body"><div class="s">Days you didn't</div>
            <div class="t num">${(() => { const t = rows.filter(r => !(dayRO(r.d).workouts||[]).length && r.en); return t.length ? (t.reduce((a,r)=>a+r.en,0)/t.length).toFixed(1) : '—'; })()} average energy</div></div></div>
          <div class="tiny dim" style="margin-top:10px">These are associations in your own data, not causes. Treat them as prompts for a hunch, not proof.</div>`}
      </div>
    </div>`;
}

/* Invoiced and paid are separate facts: something can be invoiced and unpaid
   for weeks. The old single status is folded into the two on first load. */
const invOf  = x => !!(x.inv  || x.billed === 'invoiced' || x.billed === 'paid');
const paidOf = x => !!(x.paid || x.billed === 'paid');
function billChip(x){
  if (paidOf(x)) return `<span class="chip" style="--c:var(--ok);--cbg:var(--raise)">paid</span>`;
  if (invOf(x))  return `<span class="chip" style="--c:var(--a-work);--cbg:var(--raise)">invoiced</span>`;
  return `<span class="chip" style="--c:var(--warn);--cbg:var(--raise)">to invoice</span>`;
}
function billTicks(kind, id, d, x){
  return `<span class="row" style="gap:10px">
    <label class="row" style="gap:5px;font-size:12px;white-space:nowrap"><input type="checkbox" ${invOf(x)?'checked':''}
      data-act="bill2" data-k="inv" data-kind="${kind}" data-id="${id}" data-d="${d||''}" style="--c:var(--a-work);width:15px;height:15px">invoiced</label>
    <label class="row" style="gap:5px;font-size:12px;white-space:nowrap"><input type="checkbox" ${paidOf(x)?'checked':''}
      data-act="bill2" data-k="paid" data-kind="${kind}" data-id="${id}" data-d="${d||''}" style="--c:var(--ok);width:15px;height:15px">paid</label></span>`;
}
const BILLED = [['unbilled','To invoice'],['invoiced','Invoiced'],['paid','Paid']];
/* how many lessons each dog has had — lifetime, this month, and against a
   prepaid package if one is running */
const sessionsFor = id => across('sessions').filter(s => s.clientId === id).sort((a,b) => (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
function pkgState(c){
  const size = num(c.pkgSize); if (!size) return null;
  const start = c.pkgStart || '';
  const mine = sessionsFor(c.id).filter(s => !start || s.date >= start);
  return { size, start, used: mine.length, left: Math.max(0, size - mine.length), over: mine.length > size, mine };
}
function dogCounts(c){
  const all = sessionsFor(c.id), ym = ymOf(todayISO());
  const done = all.filter(s => s.date <= todayISO());
  return { total: all.length, done: done.length, upcoming: all.length - done.length,
           month: all.filter(s => ymOf(s.date) === ym).length,
           first: all.length ? all[0].date : null, last: done.length ? done[done.length-1].date : null,
           value: all.reduce((a,s) => a + num(s.fee), 0), pkg: pkgState(c) };
}
const bColor = b => ({unbilled:'var(--warn)', invoiced:'var(--a-work)', paid:'var(--ok)'}[b] || 'var(--muted)');
function viewDog(){

  const sess = across('sessions');

  const owed = unbilled.reduce((a,s) => a + num(s.fee), 0) + enUnbilled.reduce((a,x) => a + num(x.fee), 0);
