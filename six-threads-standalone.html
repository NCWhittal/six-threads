<script>
/* ============================================================
   DRAGGING — move a block to another time (or another day),
   or drag its bottom edge to change how long it runs.
   Touch drags start from the left grip or the bottom edge, so
   the page still scrolls normally under a finger.
   ============================================================ */
function openBlockForm(d, time, area){
  openForm('Add a block to ' + relDay(d).toLowerCase(), [
    {k:'title', label:'What', ph:'Gym, client session, deep work…'},
    {k:'area', label:'Thread', type:'select', opts:threadOpts(), val:area || 'work'},
    {k:'time', label:'Start', type:'time', val:time || nowTime()},
    {k:'dur', label:'Minutes', type:'num', val:60},
    {k:'date', label:'Day', type:'date', val:d},
    {k:'note', label:'Note', ph:'optional'}
  ], v => { if (!v.title) return; const dd = v.date || d;
    day(dd).sched.push({id:uid(), title:v.title, area:v.area, time:v.time, dur:v.dur, note:v.note, done:false});
    saveDay(dd); render(); });
}
/* deleting a recurring instance affects that day only — the pattern survives */
function deleteBlock(d, id){
  const D = day(d), b = (D.sched||[]).find(x => x.id === id);
  if (b && b.rid) { D.skip = [...new Set([...(D.skip||[]), b.rid])]; }
  D.sched = (D.sched||[]).filter(x => x.id !== id);
  saveDay(d);
}

let drag = null, dragEnded = 0;
document.addEventListener('pointerdown', e => {
  const blk = e.target.closest('.gblock'); if (!blk || blk.classList.contains('gprop')) return;
  if (e.target.closest('button, input, select, a')) return;
  const isRes = !!e.target.closest('.gres'), isGrip = !!e.target.closest('.grip');
  if (e.pointerType !== 'mouse' && !isRes && !isGrip) return;
  const body = blk.closest('.gbody'); if (!body) return;
  drag = { blk, id: blk.dataset.id, d: blk.dataset.d, day: blk.dataset.d,
           mode: isRes ? 'resize' : 'move', x: e.clientX, y: e.clientY, moved: false,
           top: parseFloat(blk.style.top) || 0, h: parseFloat(blk.style.height) || 30 };
  try { blk.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y, dx = e.clientX - drag.x;
  if (!drag.moved) { if (Math.abs(dy) < 4 && Math.abs(dx) < 4) return; drag.moved = true; drag.blk.classList.add('dragging'); }
  e.preventDefault();
  const H = (DAY_END - DAY_START) * PXM;
  if (drag.mode === 'resize') {
    const h = clamp(drag.h + dy, 15 * PXM, H - drag.top);
    drag.blk.style.height = h.toFixed(1) + 'px';
    drag.blk.classList.toggle('short', h < 34);
  } else {
    drag.blk.style.top = clamp(drag.top + dy, 0, H - drag.h).toFixed(1) + 'px';
    const col = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList && el.classList.contains('gcol'));
    document.querySelectorAll('.gcol.gdrop').forEach(c => c.classList.remove('gdrop'));
    if (col && col.dataset.gday) { drag.day = col.dataset.gday; if (col.dataset.gday !== drag.d) col.classList.add('gdrop'); }
  }
});
function endDrag(){
  if (!drag) return; const D = drag; drag = null;
  document.querySelectorAll('.gcol.gdrop').forEach(c => c.classList.remove('gdrop'));
  if (!D.moved) { ACT.blockedit(null, D.blk); return; }
  dragEnded = Date.now();
  const b = (day(D.d).sched || []).find(x => x.id === D.id);
  if (!b) { render(); return; }
  if (D.mode === 'resize') {
    b.dur = Math.max(15, snap5(parseFloat(D.blk.style.height) / PXM));
  } else {
    b.time = gt(clamp(snap5(DAY_START + parseFloat(D.blk.style.top) / PXM), 0, 1439));
    if (D.day && D.day !== D.d) {
      day(D.d).sched = (day(D.d).sched || []).filter(x => x.id !== D.id);
      if (b.rid) day(D.d).skip = [...new Set([...(day(D.d).skip || []), b.rid])];
      day(D.day).sched.push(b); saveDay(D.day);
    }
  }
  saveDay(D.d); render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* click an empty slot to add a block there */
document.addEventListener('click', e => {
  if (Date.now() - dragEnded < 250) return;
  const col = e.target.closest('.gcol'); if (!col || e.target.closest('.gblock')) return;
  const r = col.getBoundingClientRect();
  const m = clamp(Math.round((DAY_START + (e.clientY - r.top) / PXM) / 15) * 15, DAY_START, DAY_END - 15);
  openBlockForm(col.dataset.gday, gt(m));
});

/* keep the "now" line honest without redrawing the page under the user */
setInterval(() => {
  const el = document.getElementById('nowline'); if (!el) return;
  const n = new Date().getHours() * 60 + new Date().getMinutes();
  if (n < DAY_START || n > DAY_END) { el.remove(); return; }
  el.style.top = ((n - DAY_START) * PXM) + 'px';
}, 60000);
</script>

<style>
.gblock.gprop{border-style:dashed;opacity:.82;cursor:default}
.gblock.gprop .gt{font-weight:600}
.gblock.gprop .gtick{border-style:solid;color:var(--c)}

<script>
/* ============================================================
   THE SCHEDULER
   ------------------------------------------------------------
   Fixed commitments never move. Flexible commitments — "three
   workouts a week", "five deep-work blocks" — get placed into
   whatever is genuinely free, scored against four things:
   time-of-day fit, spacing, your own energy history, and
   leaving tidy gaps behind. It proposes; you accept.
   ============================================================ */
const WINDOWS = { any:[DAY_START, DAY_END], morning:[DAY_START, 12*60], afternoon:[12*60, 17*60], evening:[17*60, DAY_END] };
const WINLABEL = { any:'any time', morning:'mornings', afternoon:'afternoons', evening:'evenings' };
const rules = () => Object.assign({ start:'07:00', end:'20:00', lunchOn:true, lunchFrom:'12:30', lunchMins:60, buffer:15, off:[0],
  workOn:true, workStart:'08:00', workEnd:'16:00', workDays:[1,2,3,4,5],
  deepOn:true, deepPerDay:2, deepMins:90 }, S.ref.schedule.rules || {});
const isWorkDay = d => { const R = rules(); return R.workOn && (R.workDays || []).includes(toD(d).getDay()); };
/* the working day as an interval, or null on a day you don't work */
function workIv(d){ const R = rules(); return isWorkDay(d) ? [gm(R.workStart), gm(R.workEnd)] : null; }
/* subtract one interval from a list of them */
function cutIv(list, cut){
  if (!cut) return list;
  const out = [];
  list.forEach(iv => { if (cut[1] <= iv[0] || cut[0] >= iv[1]) { out.push(iv); return; }
    if (cut[0] > iv[0]) out.push([iv[0], cut[0]]);
    if (cut[1] < iv[1]) out.push([cut[1], iv[1]]); });
  return out;
}
function clipIv(list, keep){
  if (!keep) return list;
  return list.map(iv => [Math.max(iv[0], keep[0]), Math.min(iv[1], keep[1])]).filter(iv => iv[1] > iv[0]);
}
/* where a commitment is allowed to land on a given day.
   Work things go inside working hours; everything else stays out of them,
   unless you tick the box that says it may sit in the working day. */
function windowsFor(w, d){
  const base = WINDOWS[w.when] || WINDOWS.any;
  let out = [[base[0], base[1]]];
  const wk = workIv(d);
  if (wk) out = (w.area === 'work' && !w.outWork) ? clipIv(out, wk)
            : (w.inWork ? out : cutIv(out, wk));
  return out.filter(iv => iv[1] > iv[0]);
}

function mergeIv(iv){
  const a = iv.filter(x => x[1] > x[0]).sort((p,q) => p[0]-q[0]); const out = [];
  a.forEach(x => { const last = out[out.length-1];
    if (last && x[0] <= last[1]) last[1] = Math.max(last[1], x[1]); else out.push([x[0], x[1]]); });
  return out;
}
/* everything unavailable on a day: outside hours, lunch, off days, and every
   existing block widened by the meeting buffer */
function busyFor(d, extra){
  const R = rules(), iv = [[0, gm(R.start)], [gm(R.end), 1440]];
  if ((R.off || []).includes(toD(d).getDay())) iv.push([0, 1440]);
  if (R.lunchOn) { const l = gm(R.lunchFrom); iv.push([l, l + num(R.lunchMins)]); }
  const buf = num(R.buffer);
  (dayRO(d).sched || []).forEach(b => { const st = gm(b.time); if (st < 0) return;
    iv.push([st - buf, st + Math.max(15, num(b.dur) || 30) + buf]); });
  (extra || []).filter(x => x.d === d).forEach(x => iv.push([gm(x.time) - buf, gm(x.time) + num(x.dur) + buf]));
  return mergeIv(iv);
}
function gapsFor(d, extra){
  const busy = busyFor(d, extra), out = []; let cur = 0;
  if (d === todayISO()) { const n = new Date(); cur = Math.ceil((n.getHours()*60 + n.getMinutes() + 10)/15)*15; }
  busy.forEach(b => { if (b[0] > cur) out.push([cur, b[0]]); cur = Math.max(cur, b[1]); });
  if (cur < 1440) out.push([cur, 1440]);
  return out;
}
/* average energy per weekday, from your own check-ins */
function energyByWeekday(){
  const sum = {}, n = {}; let total = 0;
  monthKeys().forEach(ym => Object.keys(S.months[ym].days || {}).forEach(d => {
    const e = num((S.months[ym].days[d].ci || {}).energy); if (!e) return;
    const w = toD(d).getDay(); sum[w] = (sum[w] || 0) + e; n[w] = (n[w] || 0) + 1; total++;
  }));
  if (total < 8) return null;
  const avg = {}, all = Object.keys(sum).reduce((a,w) => a + sum[w], 0) / total;
  [0,1,2,3,4,5,6].forEach(w => avg[w] = n[w] ? sum[w]/n[w] : all);
  return { avg, all };
}

function bestSlot(days, w, allPlaced, mine, eDay){
  const mins = Math.max(15, num(w.mins) || 45);
  const cap = Math.max(1, num(w.perDay) || 1);
  let best = null;
  days.forEach(d => {
    if (d < todayISO()) return;
    const dow = toD(d).getDay();
    if ((w.days || []).length && !w.days.includes(dow)) return;
    const wins = windowsFor(w, d);
    if (!wins.length) return;
    /* the daily cap is a rule, not a tiebreak: a third deep-work block on a
       Wednesday is not a slightly worse answer, it is the wrong answer */
    if (mine.filter(m => m.d === d).length >= cap) return;
    /* the real commitments on this day — the things worth sitting next to */
    const anchors = (dayRO(d).sched || []).filter(b => gm(b.time) >= 0)
      .map(b => [gm(b.time), gm(b.time) + Math.max(15, num(b.dur) || 30)])
      .concat(allPlaced.filter(x => x.d === d).map(x => [gm(x.time), gm(x.time) + num(x.dur)]));
    gapsFor(d, allPlaced).forEach(g => { wins.forEach(win => {
      const lo = Math.max(g[0], win[0]), hi = Math.min(g[1], win[1]);
      if (hi - lo < mins) return;
      const gapLen = g[1] - g[0];
      for (let t = Math.ceil(lo/15)*15; t + mins <= hi; t += 15) {
        /* 1. time-of-day fit — inside the window already; a mild pull toward
              the front of it so a "morning" block is genuinely morning */
        let score = 100 - (t - win[0]) / 240;
        const why = [];
        /* 1b. contiguity — sitting up against something already booked keeps
               your free time in usable stretches instead of confetti */
        const buf = num(rules().buffer);
        const touches = anchors.some(a => Math.abs(t - (a[1] + buf)) <= 15 || Math.abs((t + mins + buf) - a[0]) <= 15);
        if (touches) { score += 22; why.push('sits right against what you already have on'); }
        /* 2. spacing — as far from siblings as we can get (the daily cap is
              enforced above, as a rule rather than a preference) */
        const sameDay = mine.filter(m => m.d === d).length;
        if (sameDay) score -= 6;
        const dist = mine.length ? Math.min(...mine.map(m => Math.abs((toD(d) - toD(m.d)) / 86400000))) : 3;
        score += Math.min(dist, 3) * 14;
        if (mine.length && dist >= 2) why.push('well spaced from the others');
        /* 3. your energy history for that weekday */
        if (eDay) { const lift = (eDay.avg[dow] - eDay.all) * 22; score += lift;
          if (lift > 8) why.push(DOW[dow] + 's are one of your stronger days'); }
        /* 4. tidiness — best fit, so a long gap is not carved up for a short task */
        score -= (gapLen - mins) / 45;
        if (gapLen - mins < 30) why.push('fits the gap almost exactly');
        if (!best || score > best.score) best = { score, d, time: gt(t), dur: mins,
          title: w.title, area: w.area, why, gapLen, id: 'p' + uid() };
      }
    }); });
  });
  if (best) {
    if (w.area === 'work' && workIv(best.d) && !best.why.length) best.why.push('inside your working day');
    const fallback = (w.when && w.when !== 'any') ? 'the best free slot in your ' + WINLABEL[w.when] : 'the best free slot left';
    best.why = (best.why.length ? best.why : [fallback]).slice(0,2).join(', ');
  }
  return best;
}

/* blocks already on the week that count toward a commitment: ones this
   scheduler placed, ones you named the same, and — if you tick the box —
   anything at all in that thread */
function alreadyThisWeek(days, w){
  const out = [];
  days.filter(d => d >= todayISO()).forEach(d => (dayRO(d).sched || []).forEach(b => {
    if (gm(b.time) < 0) return;
    const hit = b.wantId === w.id
      || String(b.title || '').trim().toLowerCase() === String(w.title || '').trim().toLowerCase()
      || (w.matchThread && b.area === w.area);
    if (hit) out.push({ d, time: b.time, dur: num(b.dur) || 30 });
  }));
  return out;
}

/* ---------- commitments with a time of their own ----------
   Riding is Tuesday at five. That is not a preference the scheduler gets to
   weigh against a tidier gap — it is a fact about the week. So a commitment
   with a set time is placed at that time on its days, and if something is
   already there we say so rather than quietly moving your riding. */
function whatClashes(d, t, mins){
  const buf = num(rules().buffer), hit = [];
  (dayRO(d).sched || []).forEach(b => { const st = gm(b.time); if (st < 0) return;
    const en = st + Math.max(15, num(b.dur) || 30);
    if (t < en + buf && st < t + mins + buf) hit.push(b.title || 'something'); });
  const R = rules();
  if ((R.off || []).includes(toD(d).getDay())) hit.push('a day you keep clear');
  else if (t < gm(R.start) || t + mins > gm(R.end)) hit.push('outside the hours you allow');
  return hit;
}
function fixedSlots(days, w, have){
  const at = gm(w.at); if (at < 0) return [];
  const mins = Math.max(15, num(w.mins) || 45);
  const want = Math.max(0, num(w.perWeek) - have.length);
  const out = [];
  days.forEach(d => {
    if (out.length >= want || d < todayISO()) return;
    if ((w.days || []).length && !w.days.includes(toD(d).getDay())) return;
    if (have.some(h => h.d === d)) return;
    const clash = whatClashes(d, at, mins);
    out.push({ d, time: w.at, dur: mins, title: w.title, area: w.area, wantId: w.id,
      fixed: true, clash: clash.length ? clash.slice(0,2).join(' and ') : null,
      why: clash.length ? 'your set time, but ' + clash.slice(0,2).join(' and ') + ' is already there'
                        : 'your set time for this', id: 'p' + uid() });
  });
  return out;
}
/* deep work is a ground rule, not something you should have to remember to ask
   for: if you work an 8-hour day, the app assumes you want protected focus
   inside it and offers it unprompted. Skip it if you've written your own. */
function deepWant(days){
  const R = rules();
  if (!R.deepOn || !R.workOn) return null;
  const own = (S.ref.schedule.wants || []).some(w => w.active !== false && num(w.perWeek) > 0
    && /deep\s*work|focus/i.test(String(w.title || '')));
  if (own) return null;
  /* only the working days still ahead of us — asking for a full week's focus
     on a Thursday afternoon would just produce blocks nobody can keep */
  const dws = days ? days.filter(d => d >= todayISO() && (R.workDays || []).includes(toD(d).getDay())).length
                   : (R.workDays || []).length;
  if (!dws) return null;
  return { id: 'deep', title: 'Deep work', area: 'work', builtin: true,
    perWeek: dws * Math.max(1, num(R.deepPerDay)), perDay: Math.max(1, num(R.deepPerDay)),
    mins: Math.max(30, num(R.deepMins)), when: 'any', days: (R.workDays || []).slice(), active: true };
}
function planWants(days){
  const ws = (S.ref.schedule.wants || []).filter(w => w.active !== false && num(w.perWeek) > 0);
  const dw = deepWant(days);
  return dw ? [dw, ...ws] : ws;
}
function proposePlan(days){
  const wants = planWants(days);
  const eDay = energyByWeekday();
  const placed = [], failed = [];
  /* set times first — they have no choice about where they go, so everything
     else should be fitted around them rather than the other way round */
  const ordered = [...wants].sort((a,b) => (gm(b.at) >= 0) - (gm(a.at) >= 0)
    || num(b.mins) - num(a.mins) || num(b.perWeek) - num(a.perWeek));
  ordered.forEach(w => {
    const have = alreadyThisWeek(days, w);
    const need = Math.max(0, num(w.perWeek) - have.length);
    if (!need) return;
    if (gm(w.at) >= 0) {
      const fx = fixedSlots(days, w, have);
      fx.forEach(x => placed.push(x));
      if (fx.length < need) failed.push({ title: w.title, short: need - fx.length, of: num(w.perWeek),
        mins: num(w.mins), when: w.when, fixed: true });
      return;
    }
    const mine = have.slice();
    for (let i = 0; i < need; i++) {
      const slot = bestSlot(days, w, placed, mine, eDay);
      if (!slot) { failed.push({ title: w.title, short: need - i, of: num(w.perWeek), mins: num(w.mins), when: w.when,
        inWorkDay: w.area === 'work' }); break; }
      slot.wantId = w.id; slot.builtin = w.builtin; placed.push(slot); mine.push(slot);
    }
  });
  return { placed, failed };
}

/* ---------- the screen ---------- */
/* how much of what you said you wanted is still unplaced this week */
function planGap(days){
  const ws = planWants(days);
  let short = 0;
  ws.forEach(w => { short += Math.max(0, num(w.perWeek) - alreadyThisWeek(days, w).length); });
  return { wants: ws.length, short };
}
/* offer a plan on arrival rather than waiting to be asked — once per week,
   and only when there is something to place and rules to place it by */
function maybeAutoPropose(days, k){
  if (S.autoProposedFor === k) return;
  if ((S.proposal || []).length) return;
  const g = planGap(days);
  if (!g.wants || !g.short) return;
  if (!days.some(d => d >= todayISO())) return;
  S.autoProposedFor = k;
  const r = proposePlan(days);
  if (r.placed.length) { S.proposal = r.placed; S.proposeFailed = r.failed; S.autoOffered = true; }
}
function weekAuto(days, k, W){
  maybeAutoPropose(days, k);
  const ws = S.ref.schedule.wants || [], R = rules();
  const dw = deepWant(days);
  const P = S.proposal || [], F = S.proposeFailed || [];
  const future = days.filter(d => d >= todayISO());
  const autoOn = future.reduce((a,d) => a + (dayRO(d).sched||[]).filter(b => b.auto).length, 0);
  const freeMins = future.reduce((a,d) => a + gapsFor(d, []).reduce((x,g) => x + Math.max(0, g[1]-g[0]), 0), 0);
  const needMins = planWants(days).reduce((a,w) => a + num(w.perWeek) * num(w.mins), 0);

  return `<div class="card" style="margin-bottom:16px">
      <div class="spread" style="align-items:flex-start">
        <div><h3>Plan the rest of the week for me</h3>
          <div class="note" style="margin-bottom:0;max-width:62ch">Everything already on your timetable is treated as fixed and never moved. The scheduler only fills what's genuinely free — after your ground rules take their cut — and it shows you the plan before anything is written. ${R.workOn ? 'Your working day is kept for work: deep work goes inside it, everything else around it.' : ''} You can move any suggestion before accepting, and drag anything afterwards.</div></div>
        <div class="row">
          ${autoOn ? `<button class="btn ghost sm" data-act="clearauto">Remove ${autoOn} auto block${autoOn===1?'':'s'}</button>` : ''}
          <button class="btn" data-act="propose">${P.length ? 'Suggest again' : 'Suggest a plan'}</button></div>
      </div>
      <hr class="rule">
      <div class="row" style="gap:16px">
        <span class="pill">${future.length} day${future.length===1?'':'s'} left this week</span>
        ${R.workOn ? `<span class="pill" style="--c:var(--a-work)">work ${esc(R.workStart)}–${esc(R.workEnd)}, ${(R.workDays||[]).length} day${(R.workDays||[]).length===1?'':'s'}</span>` : ''}
        ${dw ? `<span class="pill" style="--c:var(--a-work)">${dw.perDay}×${dw.mins} min deep work a day</span>` : ''}
        <span class="pill">${(freeMins/60).toFixed(1)} h genuinely free</span>
        <span class="pill" style="${needMins > freeMins ? 'border-color:var(--warn);color:var(--warn)' : ''}">${(needMins/60).toFixed(1)} h of commitments to place</span>
        ${autoOn ? `<span class="pill">${autoOn} already auto-scheduled</span>` : ''}
      </div>
      ${needMins > freeMins ? `<div class="tiny" style="color:var(--warn);margin-top:9px">You've asked for more than the week has room for. It will place what it can and tell you what it couldn't.</div>` : ''}
    </div>

    ${P.length || F.length ? `<div class="card" style="margin-bottom:16px;--c:var(--ok)">
      <div class="spread" style="margin-bottom:10px">
        <div><h3>${S.autoOffered ? 'Here\'s a plan for the rest of your week' : 'Proposed'} — ${P.length} block${P.length===1?'':'s'}</h3>
          <div class="note" style="margin-bottom:0">${S.autoOffered ? 'Worked out on its own from your commitments and ground rules. ' : ''}Nothing is saved yet. Drop any you don't want, then accept the rest.</div></div>
        <div class="row"><button class="btn ghost sm" data-act="propclear">Discard</button>
          ${P.length ? `<button class="btn" data-act="propaccept">Accept ${P.length}</button>` : ''}</div>
      </div>
      ${P.slice().sort((a,b) => (a.d+a.time).localeCompare(b.d+b.time)).map(x => `
        <div class="item"${x.clash ? ' style="background:var(--a-food-bg)"' : ''}>
          <span class="pip" style="--c:${threadC(x.area)};width:9px;height:9px;margin-top:6px"></span>
          <div class="body"><div class="spread"><div class="t">${esc(x.title)}
              ${x.fixed ? '<span class="tiny dim" style="font-weight:500">· set time</span>' : ''}
              ${x.clash ? '<span class="tiny" style="color:var(--warn);font-weight:700">· clashes</span>' : ''}</div>
            <button class="chip sm" data-act="propmove" data-id="${x.id}" title="Move this one">${esc(fmtDay(x.d))} · ${esc(x.time)}–${esc(gt(gm(x.time)+x.dur))}</button></div>
            <div class="why">${esc(x.why)}</div></div>
          <button class="x" data-act="propdrop" data-id="${x.id}">&times;</button></div>`).join('')}
      ${F.length ? `<hr class="rule"><div class="lbl" style="margin-bottom:7px">Couldn't fit</div>
        ${F.map(f => `<div class="item"><div class="body"><div class="t">${esc(f.title)} — ${f.short} of ${f.of} left over</div>
          <div class="why">No free ${esc(String(f.mins))}-minute slot left in your ${esc(WINLABEL[f.when||'any'])}. Shorten it, allow more of the day, or accept fewer a week.</div></div></div>`).join('')}` : ''}
    </div>` : ''}

    <div class="card" style="margin-bottom:16px">
      <h3>${P.length ? 'The week, with the proposal in dashed outline' : 'The week as it stands'}</h3>
      <div class="note">Solid blocks are fixed. ${P.length ? 'Dashed ones are suggestions — drop one with its ×.' : 'Suggest a plan to see what fits.'}</div>
      ${gridHTML(days, { now: true, ghosts: true })}
    </div>

    <div class="grid g2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
      <div class="card">
        <div class="spread" style="margin-bottom:4px"><h3>What you want in a week</h3>
          <div class="row">${ws.length ? '' : `<button class="btn ghost sm" data-act="wantseed">Use a starter set</button>`}
            <button class="btn sm" data-act="want+">Add</button></div></div>
        <div class="note">Flexible commitments — the things that need to happen, without a fixed time. Say how often and how long, and the scheduler finds the room.</div>
        ${ws.length ? ws.map(w => { const have = alreadyThisWeek(days, w).length, short = Math.max(0, num(w.perWeek) - have);
          return `<div class="item ${w.active === false ? 'done' : ''}">
            <span class="pip" style="--c:${threadC(w.area)};width:9px;height:9px;margin-top:6px"></span>
            <div class="body"><div class="spread"><div class="t">${esc(w.title)}</div>
              <span class="mono tiny dim">${esc(String(w.perWeek))}× ${esc(String(w.mins))} min</span></div>
              <div class="s">${esc(threadName(w.area))} · ${esc(WINLABEL[w.when||'any'])}${(w.days||[]).length ? ' · only ' + w.days.map(n => DOW[n]).join(', ') : ''}${w.active === false ? ' · paused' : ''}</div>
              <div class="s" style="color:${short ? 'var(--muted)' : 'var(--ok)'}">${have} already on the week${short ? ' · ' + short + ' still to place' : ' · nothing to place'}</div></div>
            <button class="btn ghost sm" data-act="wantedit" data-id="${w.id}">Edit</button>
            <button class="x" data-act="want-" data-id="${w.id}">&times;</button></div>`; }).join('')
          : `<div class="empty">Nothing set. The starter set gives you four sensible ones to edit rather than a blank page.</div>`}
      </div>

      <div class="card">
        <div class="spread" style="margin-bottom:4px"><h3>Ground rules</h3><button class="btn ghost sm" data-act="rulesedit">Edit</button></div>
        <div class="note">The lines the scheduler will not cross.</div>
        <div class="stack" style="gap:7px">
          <div class="spread"><span class="dim">Schedulable hours</span><span class="num">${esc(R.start)} – ${esc(R.end)}</span></div>
          <div class="spread"><span class="dim">Lunch kept clear</span><span class="num">${R.lunchOn ? esc(R.lunchFrom) + ' · ' + esc(String(R.lunchMins)) + ' min' : 'no'}</span></div>
          <div class="spread"><span class="dim">Buffer around anything booked</span><span class="num">${esc(String(R.buffer))} min</span></div>
          <div class="spread"><span class="dim">Days left alone</span><span class="num">${(R.off||[]).length ? R.off.map(n => DOW[n]).join(', ') : 'none'}</span></div>
        </div>
        ${energyByWeekday() ? `<hr class="rule"><div class="lbl" style="margin-bottom:7px">It also uses your energy history</div>
          <div class="row" style="gap:4px">${[1,2,3,4,5,6,0].map(n => { const e = energyByWeekday();
            const v = e.avg[n], hot = v > e.all + 0.25, cold = v < e.all - 0.25;
            return `<span class="chip ${hot||cold?'':'out'}" style="--c:${hot?'var(--ok)':(cold?'var(--warn)':'var(--muted)')};--cbg:var(--raise);padding:2px 8px">${DOW[n]} ${v.toFixed(1)}</span>`; }).join('')}</div>
          <div class="tiny dim" style="margin-top:7px">Your average check-in energy per weekday. Deep work drifts toward the stronger days. This is an association in your own data, not a law — override it whenever it's wrong.</div>`
          : `<hr class="rule"><div class="tiny dim">Once you have a couple of weeks of check-ins, the scheduler will start favouring your stronger weekdays for demanding work.</div>`}
      </div>
    </div>`;
}

Object.assign(ACT, {
  propose(){
    const days = weekDays(S.date);
    if (!planWants(weekDays(S.date)).length) { toast('Add a commitment first — or use the starter set.'); return; }
    const r = proposePlan(days);
    S.proposal = r.placed; S.proposeFailed = r.failed; S.autoOffered = false; S.autoProposedFor = weekKey(S.date);
    render();
    toast(r.placed.length ? 'Found room for ' + r.placed.length + ' block' + (r.placed.length===1?'':'s') + '.' : 'Nothing fits — check your ground rules.');
  },
  propdrop(e, el){ S.proposal = (S.proposal||[]).filter(x => x.id !== el.dataset.id); render(); },
  /* a proposal is a suggestion, not a verdict — move any of them before you
     accept, and once accepted every block drags on the grid like any other */
  propmove(e, el){ const x = (S.proposal||[]).find(y => y.id === el.dataset.id); if (!x) return;
    openForm('Move “' + x.title + '”', [
      {k:'d', label:'Day', type:'date', val:x.d},
      {k:'time', label:'Start', type:'time', val:x.time},
      {k:'dur', label:'Minutes', type:'num', val:x.dur}
    ], v => { if (!v.d || gm(v.time) < 0) return;
      Object.assign(x, { d:v.d, time:v.time, dur:Math.max(15, num(v.dur)||x.dur), moved:true });
      const c = whatClashes(x.d, gm(x.time), x.dur);
      x.clash = c.length ? c.slice(0,2).join(' and ') : null;
      x.why = x.clash ? 'you moved it here, but ' + x.clash + ' is already there' : 'you moved it here';
      render(); }); },
  propclear(){ S.proposal = []; S.proposeFailed = []; S.autoOffered = false; render(); },
  propaccept(){
    const P = S.proposal || []; if (!P.length) return;
    S.autoOffered = false;
    const touched = new Set();
    P.forEach(x => { day(x.d).sched.push({ id:uid(), title:x.title, area:x.area, time:x.time, dur:x.dur, note:'', done:false, auto:true, wantId:x.wantId }); touched.add(ymOf(x.d)); });
    touched.forEach(saveMonth);
    S.proposal = []; S.proposeFailed = [];
    render(); toast('Added ' + P.length + ' block' + (P.length===1?'':'s') + ' to your week.');
  },
  clearauto(){ let n = 0;
    weekDays(S.date).forEach(d => { if (d < todayISO()) return;
      const D = day(d), before = (D.sched||[]).length;
      D.sched = (D.sched||[]).filter(b => !b.auto);
      if (D.sched.length !== before) { n += before - D.sched.length; saveDay(d); } });
    render(); toast('Removed ' + n + ' auto-scheduled block' + (n===1?'':'s') + '.'); },
  wantseed(){
    const seed = [
      { title:'Pilates',            area:'move', perWeek:2, mins:45, when:'morning', at:'07:15', days:[1,3] },
      { title:'Horse riding',       area:'play', perWeek:1, mins:90, when:'evening',  at:'17:00', days:[2] },
      { title:'Dog walk',           area:'move', perWeek:4, mins:45, when:'evening' },
      { title:'Admin & invoicing',  area:'dog',  perWeek:1, mins:45, when:'evening' }
    ];
    seed.forEach(x => refList('schedule','wants').push(Object.assign({ id:uid(), active:true, days:[], perDay:1 }, x)));
    saveRef('schedule'); render();
    toast('Four to start from — two with set times. Deep work is already a ground rule.'); },
  'want+'(){ openForm('Add a weekly commitment', [
      {k:'title', label:'What', ph:'Workout, deep work, whip practice…'},
      {k:'area', label:'Thread', type:'select', opts:threadOpts(), val:'move'},
      {k:'perWeek', label:'Times a week', type:'num', val:3},
      {k:'mins', label:'Minutes each', type:'num', val:60},
      {k:'at', label:'At a set time — e.g. riding, pilates (leave blank to let it find room)', type:'time', val:''},
      {k:'when', label:'Otherwise, preferred part of the day', type:'select', opts:[['any','Any time'],['morning','Mornings'],['afternoon','Afternoons'],['evening','Evenings']], val:'any'},
      {k:'days', label:'Only on these days (leave blank for any)', type:'dow', val:[]},
      {k:'perDay', label:'Most in one day', type:'num', val:1},
      {k:'inWork', label:'May sit inside your working day', type:'check', val:false},
      {k:'matchThread', label:'Count anything in this thread toward it', type:'check', val:false}
    ], v => { if (!v.title) return; refList('schedule','wants').push(Object.assign({id:uid(), active:true}, v)); saveRef('schedule'); render(); }); },
  wantedit(e, el){ const w = (S.ref.schedule.wants||[]).find(x => x.id === el.dataset.id); if (!w) return;
    openForm('Edit commitment', [
      {k:'title', label:'What', val:w.title},
      {k:'area', label:'Thread', type:'select', opts:threadOpts(), val:w.area},
      {k:'perWeek', label:'Times a week', type:'num', val:w.perWeek},
      {k:'mins', label:'Minutes each', type:'num', val:w.mins},
      {k:'at', label:'At a set time (leave blank to let it find room)', type:'time', val:w.at||''},
      {k:'when', label:'Otherwise, preferred part of the day', type:'select', opts:[['any','Any time'],['morning','Mornings'],['afternoon','Afternoons'],['evening','Evenings']], val:w.when},
      {k:'days', label:'Only on these days (leave blank for any)', type:'dow', val:w.days||[]},
      {k:'perDay', label:'Most in one day', type:'num', val:num(w.perDay)||1},
      {k:'inWork', label:'May sit inside your working day', type:'check', val:!!w.inWork},
      {k:'matchThread', label:'Count anything in this thread toward it', type:'check', val:!!w.matchThread},
      {k:'active', label:'Include when planning', type:'check', val:w.active !== false}
    ], v => { Object.assign(w, v); saveRef('schedule'); render(); }); },
  'want-'(e, el){ S.ref.schedule.wants = (S.ref.schedule.wants||[]).filter(x => x.id !== el.dataset.id); saveRef('schedule'); render(); },
  rulesedit(){ const R = rules();
    openForm('Ground rules', [
      {k:'start', label:'Earliest it may schedule', type:'time', val:R.start},
      {k:'end', label:'Latest it may schedule', type:'time', val:R.end},
      {k:'lunchOn', label:'Keep a lunch break clear', type:'check', val:R.lunchOn},
      {k:'lunchFrom', label:'Lunch starts', type:'time', val:R.lunchFrom},
      {k:'lunchMins', label:'Lunch minutes', type:'num', val:R.lunchMins},
      {k:'buffer', label:'Buffer around anything booked (min)', type:'num', val:R.buffer},
      {k:'off', label:'Days to leave completely alone', type:'dow', val:R.off||[]},
      {k:'workOn', label:'I have a working day — keep it for work', type:'check', val:R.workOn},
      {k:'workStart', label:'Work starts', type:'time', val:R.workStart},
      {k:'workEnd', label:'Work ends', type:'time', val:R.workEnd},
      {k:'workDays', label:'Working days', type:'dow', val:R.workDays||[]},
      {k:'deepOn', label:'Offer deep work inside the working day', type:'check', val:R.deepOn},
      {k:'deepPerDay', label:'Deep work blocks a day', type:'num', val:R.deepPerDay},
      {k:'deepMins', label:'Minutes each', type:'num', val:R.deepMins}
    ], v => { S.ref.schedule.rules = Object.assign(rules(), v); saveRef('schedule'); render(); }); }
});
</script>

const NUT_KEYS = ['kcal','protein','carbs','fat','fibre','sugar','sodium'];

function buildFoods(){
  const map = new Map();
  FOOD_TABLE.split('\n').forEach(line => {
    const p = line.split('|');
    if (p.length < 2) return;
    const n = p[1].split(',').map(Number);
    const rec = { name: p[0].trim(), per100: {}, unit: p[2] ? +p[2] : null, cup: p[3] ? +p[3] : null };
    NUT_KEYS.forEach((k, i) => rec.per100[k] = isFinite(n[i]) ? n[i] : 0);
    const key = k => String(k).toLowerCase().replace(/\s+/g, ' ').trim();
    map.set(key(rec.name), rec);
    (p[4] || '').split(';').map(s => key(s)).filter(Boolean).forEach(a => { if (!map.has(a)) map.set(a, rec); });
  });
  return map;
}
const FOODS = buildFoods();

/* strip the words that describe preparation rather than the food itself */
const NOISE = /\b(fresh|frozen|chopped|diced|sliced|grated|crushed|large|small|medium|ripe|raw|cooked|drained|rinsed|free.range|organic|skinless|boneless|extra|finely|roughly|to taste|optional|of|a|the)\b/g;
const UNITS = {
  g:1, gram:1, grams:1, gr:1,
  kg:1000, kilo:1000, kilos:1000, kilogram:1000, kilograms:1000,
  ml:1, l:1000, litre:1000, litres:1000, liter:1000,
  tbsp:15, tablespoon:15, tablespoons:15, tbs:15,
  tsp:5, teaspoon:5, teaspoons:5,
  cup:240, cups:240,
  tin:400, tins:400, can:400, cans:400,
  slice:30, slices:30,
  handful:30, pinch:1
};
const FRACTIONS = { '½':0.5, '¼':0.25, '¾':0.75, '⅓':1/3, '⅔':2/3 };

function normalise(s){
  return String(s || '').toLowerCase()
    .replace(/[½¼¾⅓⅔]/g, m => ' ' + FRACTIONS[m] + ' ')
    .replace(/\(.*?\)/g, ' ')
    .replace(NOISE, ' ')
    .replace(/[^a-z0-9./ -]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function singular(w){
  if (/(ss|us|is)$/.test(w)) return w;
  if (/ies$/.test(w)) return w.slice(0,-3) + 'y';
  if (/oes$/.test(w)) return w.slice(0,-2);
  if (/s$/.test(w)) return w.slice(0,-1);
  return w;
}
/* lowercase and tidy, but keep every word — "chopped tomatoes" must be
   allowed to match the tinned entry before "chopped" is thrown away */
function lite(s){
  return String(s || '').toLowerCase()
    .replace(/[\u00bd\u00bc\u00be\u2153\u2154]/g, ' ')
    .replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9./ -]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function lookup(name){
  const raw = lite(name);
  if (raw && FOODS.has(raw)) return FOODS.get(raw);
  const rawS = raw.split(' ').map(singular).join(' ');
  if (rawS && FOODS.has(rawS)) return FOODS.get(rawS);
  const n = normalise(name);
  if (!n) return lookupLoose(raw);
  if (FOODS.has(n)) return FOODS.get(n);
  const sing = n.split(' ').map(singular).join(' ');
  if (FOODS.has(sing)) return FOODS.get(sing);
  /* longest matching entry that appears in the phrase, so "chicken thigh
     fillets" beats a bare "chicken" and "sweet potato" beats "potato" */
  return lookupLoose(raw, rawS, n, sing);
}
/* longest matching entry that appears in the phrase, so "chicken thigh
   fillets" beats a bare "chicken" and "sweet potato" beats "potato" */
function lookupLoose(){
  const hay = [...arguments].filter(Boolean).map(x => ' ' + x + ' ');
  if (!hay.length) return null;
  let best = null;
  for (const [key, rec] of FOODS) {
    const k = ' ' + key + ' ';
    if (hay.some(h => h.includes(k)) && (!best || key.length > best.key.length)) best = { key, rec };
  }
  return best ? best.rec : null;
}

/* "200g chicken thighs" / "2 eggs" / "1 tbsp olive oil" / "1/2 onion" */
function parseLine(raw){
  const text = String(raw || '').trim();
  if (!text) return null;
  let s = text.toLowerCase().replace(/[½¼¾⅓⅔]/g, m => FRACTIONS[m] + ' ');
  const m = s.match(/^\s*(\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?)\s*(kg|g|gr|grams?|ml|l|litres?|liters?|tbsp|tbs|tablespoons?|tsp|teaspoons?|cups?|tins?|cans?|slices?|handful|pinch)?\b\.?\s*(.*)$/);
  let qty = null, unit = null, rest = s;
  if (m) {
    qty = m[1].includes('/') ? (() => { const f = m[1].split('/').map(x => parseFloat(x.trim())); return f[1] ? f[0]/f[1] : f[0]; })()
                             : parseFloat(m[1].replace(',', '.'));
    unit = m[2] ? m[2].replace(/\.$/,'') : null;
    rest = m[3];
  }
  const food = lookup(rest) || lookup(text);
  return { text, qty, unit, name: rest.trim() || text, food };
}

function gramsFor(item){
  if (!item.food) return null;
  const f = item.food;
  if (item.qty == null) return null;
  if (item.unit) {
    const u = item.unit.replace(/s$/,'');
    if (/^(cup)$/.test(u)) return item.qty * (f.cup || 240);
    if (/^(tin|can)$/.test(u)) return item.qty * (f.unit && f.unit >= 200 ? f.unit : 400);
    if (/^(slice)$/.test(u)) return item.qty * (f.unit || 30);
    const g = UNITS[item.unit] ?? UNITS[u];
    if (g != null) return item.qty * g;
  }
  /* a bare number means "that many of them" — 2 eggs, 1 onion */
  if (f.unit) return item.qty * f.unit;
  return null;
}

/* returns totals for the whole recipe plus how much of it we could actually price */
function analyse(ingredients){
  const lines = String(ingredients || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  const totals = {}; NUT_KEYS.forEach(k => totals[k] = 0);
  const rows = [];
  let known = 0;
  lines.forEach(l => {
    const item = parseLine(l);
    if (!item) return;
    const g = gramsFor(item);
    const row = { text: item.text, matched: !!item.food, grams: g, food: item.food ? item.food.name : null, nut: null };
    if (item.food && g != null) {
      row.nut = {};
      NUT_KEYS.forEach(k => { const v = item.food.per100[k] * g / 100; row.nut[k] = v; totals[k] += v; });
      known++;
    }
    rows.push(row);
  });
  return { rows, totals, lines: lines.length, priced: known,
           coverage: lines.length ? known / lines.length : 0 };
}



/* ============================================================
   SECURITY — the client vault
   ------------------------------------------------------------
   Client records and dog-training sessions are encrypted with
   AES-GCM before they touch storage. The key is derived from
   your passphrase with PBKDF2 and never leaves memory, so the
   passphrase itself is stored nowhere. There is no reset: that
   is what makes it real rather than theatre.
   ============================================================ */
const APP_VERSION = 'v10 · 1 Sep 2026';
const SEC = { avail: !!(window.crypto && window.crypto.subtle), on:false, locked:false,
              key:null, skipped:false, salt:null, iter:250000, timeout:15, lastAct:Date.now() };

const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

async function deriveKey(pass, saltB64, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt: b64d(saltB64), iterations: iter, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64e(iv), ct: b64e(ct) };
}
async function decJSON(key, box){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64d(box.iv) }, key, b64d(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function noteVault(){
  const v = (S.ref.dog || {}).vault;
  if (v && v.ct) { SEC.on = true; SEC.salt = v.salt; SEC.iter = v.iter || 250000;
    if (!SEC.key) { SEC.locked = true; S.ref.dog.clients = []; } }
  const t = (S.ref.settings || {}).lockAfter; if (t != null) SEC.timeout = num(t) || 15;
}
/* re-encrypt everything sensitive from what is currently in memory */
async function reseal(){
  if (!SEC.on || !SEC.key) return;
  S.ref.dog.vault = Object.assign({ v:1, salt: SEC.salt, iter: SEC.iter },
    await encJSON(SEC.key, { clients: S.ref.dog.clients || [] }));
  for (const ym of monthKeys()) {
    S.months[ym].sessionsVault = await encJSON(SEC.key, { sessions: S.months[ym].sessions || [] });
  }
}
async function unlockWith(pass){
  const key = await deriveKey(pass, SEC.salt, SEC.iter);
  const got = await decJSON(key, S.ref.dog.vault);        /* throws on a wrong passphrase */
  SEC.key = key; SEC.locked = false; SEC.skipped = false;
  S.ref.dog.clients = got.clients || []; migrateClients(); migrateClasses();
  for (const ym of monthKeys()) {
    const box = S.months[ym].sessionsVault;
    if (box && box.ct) { try { S.months[ym].sessions = (await decJSON(key, box)).sessions || []; } catch (e) {} }
  }
  SEC.lastAct = Date.now();
}
async function lockNow(){
  if (!SEC.on) return;
  await sealChain; await flush();
  SEC.key = null; SEC.locked = true; SEC.skipped = false;
  S.ref.dog.clients = [];
  monthKeys().forEach(ym => { if (S.months[ym].sessionsVault) S.months[ym].sessions = []; });
  render();
}
async function enableVault(pass){
  SEC.salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
  SEC.iter = 250000;
  SEC.key = await deriveKey(pass, SEC.salt, SEC.iter);
  SEC.on = true; SEC.locked = false; SEC.skipped = false;
  await reseal();
  saveRef('dog'); monthKeys().forEach(saveMonth);
}
async function disableVault(){
  SEC.on = false; SEC.key = null; SEC.locked = false;
  delete S.ref.dog.vault;
  monthKeys().forEach(ym => { delete S.months[ym].sessionsVault; saveMonth(ym); });
  saveRef('dog'); writeLocalDropping();
}
const clientsLocked = () => SEC.on && SEC.locked;

/* auto-lock after inactivity */
['pointerdown','keydown','wheel','touchstart'].forEach(ev =>
  document.addEventListener(ev, () => { SEC.lastAct = Date.now(); }, { passive:true }));
setInterval(() => {
  if (SEC.on && !SEC.locked && SEC.timeout > 0 && Date.now() - SEC.lastAct > SEC.timeout * 60000) lockNow();
}, 20000);

function lockScreen(){
  return `<div class="lockwrap"><div class="lockcard">
    <div class="eyebrow" style="--c:var(--faint)">Six Threads</div>

    <form id="unlockform">

      <div id="lockerr" class="tiny" style="color:var(--bad);min-height:17px;margin-top:6px"></div>

        <button type="button" class="btn ghost sm" data-act="lockskip">Work without them</button>
        <button type="submit" class="btn">Unlock</button></div>

<script>

function pickFile(cb){

  i.type = 'file'; i.accept = '.json,application/json,text/plain';
  i.onchange = () => { const f = i.files && i.files[0]; if (!f) return;

}
function backupText(){
  return JSON.stringify({ app:'six-threads', v:1, at:new Date().toISOString(),
    encrypted: !!SEC.on, data: sealedSnapshot() }, null, 1);
}
async function doUnlock(pass){
  try { await unlockWith(pass); applyCustomFoods(); render(); toast('Unlocked.'); return true; }
  catch (e) { return false; }
}

Object.assign(ACT, {
  lockskip(){ SEC.skipped = true; render(); },
  lockprompt(){ SEC.skipped = false; render(); },
  lockit(){ lockNow(); },
  locktime(){ openForm('Lock after inactivity', [
      {k:'lockAfter', label:'Minutes idle before it locks (0 = never)', type:'num', val:SEC.timeout}
    ], v => { SEC.timeout = clamp(num(v.lockAfter), 0, 240); S.ref.settings.lockAfter = SEC.timeout; saveRef('settings'); render(); }); },
  passon(){
    if (!SEC.avail) { toast('Encryption is not available in this browser context.'); return; }
    openForm('Set a passphrase', [
      {k:'p1', label:'Passphrase (at least 8 characters)', type:'text'},
      {k:'p2', label:'Type it again', type:'text'},
      {k:'ok', label:'I understand there is no way to recover this passphrase', type:'check', val:false}
    ], async v => {
      if (!v.ok) { toast('Tick the box — this one really cannot be reset.'); return; }
      if (String(v.p1).length < 8) { toast('Too short — at least 8 characters.'); return; }
      if (v.p1 !== v.p2) { toast('The two entries do not match.'); return; }
      await enableVault(v.p1); render();
      toast('Client records are now encrypted.');
    }, { ok:'Encrypt' });
  },
  passchange(){
    if (SEC.locked) { toast('Unlock first.'); return; }
    openForm('Change passphrase', [
      {k:'p1', label:'New passphrase (at least 8 characters)', type:'text'},
      {k:'p2', label:'Type it again', type:'text'}
    ], async v => {
      if (String(v.p1).length < 8 || v.p1 !== v.p2) { toast('Too short, or the two entries do not match.'); return; }

        S.ref.food.custom = S.ref.food.custom || {}; S.ref.food.custom[name] = Object.assign({}, v);
        saveRef('food'); render(); toast('Your value is used from now on.'); }); },
  async nutest(e, el){
    const r = (S.ref.food.recipes || []).find(x => x.id === el.dataset.id);
    if (!r || !S.ai) return;
    toast('Estimating…');
    try {

        `{"kcal":n,"protein":n,"carbs":n,"fat":n,"fibre":n,"sugar":n,"sodium":n} — grams except kcal, and sodium in milligrams.\n` +

        `If quantities are missing, assume ordinary home portions.`, { modelTier:'quick' });
      if (!out || !isFinite(out.kcal)) { toast('No usable estimate came back.'); return; }
      const clean = {}; NUT_KEYS.forEach(k => clean[k] = num(out[k]) * servesOf(r));
      r.nutEst = clean; saveRef('food'); render(); toast('Estimated — treat it as a rough figure.');
    } catch (err) { toast('Could not estimate that one.'); }
  },

  backup(){ offerFile('six-threads-backup-' + todayISO() + '.json', backupText());
    S.ref.settings.lastBackup = todayISO(); saveRef('settings'); },
  restore(){
    pickFile(text => {
      let j; try { j = JSON.parse(text); } catch (e) { toast('That file is not a Six Threads backup.'); return; }
      const d = (j && j.data) || j;
      if (!d || !d.ref || !d.months) { toast('That file is not a Six Threads backup.'); return; }
      const n = Object.keys(d.months).length;
      openForm('Restore this backup?', [
        {k:'ok', label:'Replace everything currently in the app with this file', type:'check', val:false}

        SEC.key = null; SEC.on = false; SEC.locked = false; SEC.skipped = false;

        Object.keys(REFS).forEach(saveRef); monthKeys().forEach(saveMonth);
        Object.keys(S.weeks).forEach(y => save('weeks/' + y));
        S.proposal = []; render();
        toast('Restored ' + n + ' month' + (n === 1 ? '' : 's') + ' of data.');
      }, { ok:'Restore' });

  },
  wipe(e, el){
    const what = el.dataset.v;
    const label = { dog:'bookings and dog sessions', money:'all money data', all:'everything in this app' }[what];
    openForm('Delete ' + label, [
      {k:'word', label:'Type DELETE to confirm', ph:'DELETE'},
      {k:'ok', label:'I have a backup, or I do not want this data', type:'check', val:false}
    ], async v => {
      if (v.word !== 'DELETE' || !v.ok) { toast('Not deleted.'); return; }
      if (what === 'dog') {
        S.ref.dog = REFS.dog();
        monthKeys().forEach(ym => { S.months[ym].sessions = []; S.months[ym].pupp = []; delete S.months[ym].sessionsVault; saveMonth(ym); });
        SEC.on = false; SEC.key = null; SEC.locked = false; saveRef('dog');
      } else if (what === 'money') {
        S.ref.money = REFS.money();
        monthKeys().forEach(ym => { S.months[ym].tx = []; saveMonth(ym); });
        saveRef('money');
      } else {
        Object.keys(REFS).forEach(k => S.ref[k] = REFS[k]());
        const hadMonths = monthKeys(), hadYears = Object.keys(S.weeks);
        S.months = {}; S.weeks = {}; S.proposal = []; S.proposeFailed = [];
        SEC.on = false; SEC.key = null; SEC.locked = false;
        try { localStorage.removeItem(LSKEY); } catch (err) {}
        if (S.db) { for (const k of Object.keys(REFS)) { try { await S.db.doc('ref/' + k).delete(); } catch (err) {} }
          for (const ym of hadMonths) { try { await S.db.doc('months/' + ym).delete(); } catch (err) {} }
          for (const y of hadYears) { try { await S.db.doc('weeks/' + y).delete(); } catch (err) {} } }
        month(ymOf(todayISO()));
      }
      writeLocalDropping(); render(); toast('Deleted.');
    }, { ok:'Delete' });
  }
});

<script>
/* ============================================================
   SYNC — record-level merge between two devices
   ------------------------------------------------------------
   Two devices cannot talk without something in the middle. Here
   that something is one file in a private GitHub repository,
   holding your whole app encrypted under your passphrase, so
   the host stores a blob it has no key for.

   The hard part is not moving the file, it is merging. Whole-file
   last-write-wins would silently discard a day's logging done on
   the other device. Instead every record carries the moment it
   last changed; merging takes the newer of each record, and a
   deletion leaves a dated tombstone so it is not resurrected by
   the other side's older copy.
   ============================================================ */

/* which arrays inside each document are collections of records */
const COLLECTIONS = {
  'ref/dog':      ['clients', 'courses', 'enrols', 'blocks', 'mydogs'],
  'ref/money':    ['cats', 'bills', 'goals', 'quick'],
  'ref/work':     ['projects', 'decisions'],
  'ref/play':     ['hobbies', 'backlog', 'learning', 'research'],
  'ref/move':     ['routines'],
  'ref/food':     ['recipes'],
  'ref/schedule': ['recurring', 'templates', 'wants'],
  'month':        ['tx', 'sessions', 'pupp', 'practice', 'log', 'classAtt']
};
const TOMB_DAYS = 120;
const clone = o => JSON.parse(JSON.stringify(o === undefined ? null : o));
const stripU = o => { const c = clone(o); delete c.u; return c; };
const byId = arr => { const m = {}; (arr || []).forEach(r => { if (r && r.id) m[r.id] = r; }); return m; };

const SHADOW = {};                     /* last state we stamped, per document */
function tombs(doc){ return (doc._del = doc._del || {}); }
function addTomb(doc, key, id, now){ const t = tombs(doc); (t[key] = t[key] || {})[id] = now; }
function pruneTombs(doc, now){
  const t = doc._del; if (!t) return;
  const cut = now - TOMB_DAYS * 86400000;
  Object.keys(t).forEach(k => { Object.keys(t[k]).forEach(id => { if (t[k][id] < cut) delete t[k][id]; });
    if (!Object.keys(t[k]).length) delete t[k]; });
  if (!Object.keys(t).length) delete doc._del;
}
/* stamp anything that changed since we last looked, and record deletions */
function stampDoc(path, doc){
  if (!doc || typeof doc !== 'object') return;
  const now = Date.now(), prev = SHADOW[path] || {};
  const keys = path.startsWith('months/') ? COLLECTIONS.month : (COLLECTIONS[path] || []);
  keys.forEach(k => {
    const cur = doc[k]; if (!Array.isArray(cur)) return;
    const old = byId(prev[k]);
    cur.forEach(r => { if (!r.id) r.id = uid();
      if (!old[r.id] || JSON.stringify(stripU(old[r.id])) !== JSON.stringify(stripU(r))) r.u = now; });
    const live = new Set(cur.map(r => r.id));
    (prev[k] || []).forEach(o => { if (o && o.id && !live.has(o.id)) addTomb(doc, k, o.id, now); });
  });
  /* per-day: the block list is a collection, the rest of the day is one lump */
  if (doc.days) {
    Object.keys(doc.days).forEach(d => {
      const day = doc.days[d], pd = (prev.days || {})[d] || {};
      ['sched','workouts'].forEach(coll => {
        const old = byId(pd[coll]);
        (day[coll] || []).forEach(r => { if (!r.id) r.id = uid();
          if (!old[r.id] || JSON.stringify(stripU(old[r.id])) !== JSON.stringify(stripU(r))) r.u = now; });
        const live = new Set((day[coll] || []).map(r => r.id));
        (pd[coll] || []).forEach(o => { if (o && o.id && !live.has(o.id)) addTomb(doc, coll + ':' + d, o.id, now); });
      });
      ['ci','meals','skip'].forEach(f => {
        if (JSON.stringify(day[f] === undefined ? null : day[f]) !== JSON.stringify(pd[f] === undefined ? null : pd[f])) day.u = now;
      });
      if (day.u == null) day.u = pd.u || now;
    });
  }
  /* whole-document scalars (targets, rules, settings, a week's plan) */
  const scalarSig = JSON.stringify(Object.keys(doc).filter(k => !keys.includes(k) && k !== 'days' && k !== '_del' && k !== 'u').sort().map(k => [k, doc[k]]));
  const prevSig = JSON.stringify(Object.keys(prev).filter(k => !keys.includes(k) && k !== 'days' && k !== '_del' && k !== 'u').sort().map(k => [k, prev[k]]));
  if (scalarSig !== prevSig) doc.u = now;
  pruneTombs(doc, now);
  SHADOW[path] = clone(doc);
}

/* merge one remote document into one local document */
function mergeDoc(path, mine, theirs){
  if (!theirs) return mine; if (!mine) return clone(theirs);
  const out = clone(mine);
  const keys = path.startsWith('months/') ? COLLECTIONS.month : (COLLECTIONS[path] || []);
  const tA = out._del || {}, tB = theirs._del || {};
  const deadAt = (k, id) => Math.max((tA[k] || {})[id] || 0, (tB[k] || {})[id] || 0);

  const mergeList = (a, b, k) => {
    const m = byId(a); const res = [];
    (b || []).forEach(r => { if (!r || !r.id) return;
      const mineR = m[r.id];
      if (!mineR) { m[r.id] = r; }
      else if ((r.u || 0) > (mineR.u || 0)) { m[r.id] = r; }
    });
    Object.keys(m).forEach(id => { const r = m[id];
      if (deadAt(k, id) > (r.u || 0)) return;                 /* deleted after its last edit */
      res.push(r); });
    return res.sort((x, y) => String(x.id).localeCompare(String(y.id)));
  };

  keys.forEach(k => { out[k] = mergeList(out[k], theirs[k], k); });

  if (out.days || theirs.days) {
    out.days = out.days || {};
    Object.keys(theirs.days || {}).forEach(d => {
      const mineD = out.days[d], theirD = theirs.days[d];
      if (!mineD) { out.days[d] = clone(theirD); return; }
      const merged = ((theirD.u || 0) > (mineD.u || 0)) ? clone(theirD) : clone(mineD);
      merged.sched = mergeList(mineD.sched, theirD.sched, 'sched:' + d);
      merged.workouts = mergeList(mineD.workouts, theirD.workouts, 'workouts:' + d);
      merged.u = Math.max(mineD.u || 0, theirD.u || 0);
      out.days[d] = merged;
    });
  }
  /* scalars: the newer document wins for the fields that are not collections */
  if ((theirs.u || 0) > (out.u || 0)) {
    Object.keys(theirs).forEach(k => {
      if (keys.includes(k) || k === 'days' || k === '_del' || k === 'u') return;
      out[k] = clone(theirs[k]);
    });
    out.u = theirs.u;
  }
  const t = tombs(out);
  Object.keys(tB).forEach(k => { t[k] = t[k] || {};
    Object.keys(tB[k]).forEach(id => { t[k][id] = Math.max(t[k][id] || 0, tB[k][id]); }); });
  pruneTombs(out, Date.now());
  return out;
}

/* ---------- the whole app as one mergeable bundle ---------- */
/* The bundle carries the real records, not the vault form. The whole bundle is
   encrypted before it leaves the device, so wrapping the vault inside it again
   would only mean the other device receives ciphertext it then has to unpick —
   and an earlier version of this shipped exactly that bug: client records were
   stripped out before encryption and never travelled at all. The vault blobs
   are dropped here; each device rebuilds its own from the same key. */
function bundle(){
  const docs = {};
  Object.keys(S.ref).forEach(k => {
    const d = clone(S.ref[k]); if (k === 'dog') delete d.vault;
    docs['ref/' + k] = d;
  });
  monthKeys().forEach(k => { const d = clone(S.months[k]); delete d.sessionsVault; docs['months/' + k] = d; });
  Object.keys(S.weeks).forEach(y => docs['weeks/' + y] = { weeks: clone(S.weeks[y]) });
  return { app: 'six-threads', v: 2, at: new Date().toISOString(), docs };
}
function stampAll(){
  Object.keys(REFS).forEach(k => stampDoc('ref/' + k, S.ref[k]));
  monthKeys().forEach(ym => stampDoc('months/' + ym, S.months[ym]));
  Object.keys(S.weeks).forEach(y => { const d = { weeks: S.weeks[y] };
    Object.keys(S.weeks[y]).forEach(wk => { const w = S.weeks[y][wk];
      ['priorities','shop'].forEach(k => (w[k] || []).forEach(r => { if (!r.id) r.id = uid(); if (!r.u) r.u = Date.now(); }));
    });
    stampDoc('weeks/' + y, d); });
}
function absorb(remote){
  if (!remote || !remote.docs) return 0;
  let n = 0;
  Object.keys(remote.docs).forEach(path => {
    const p = path.split('/'), theirs = remote.docs[path];
    if (p[0] === 'ref' && REFS[p[1]]) {
      const keepVault = p[1] === 'dog' ? S.ref.dog.vault : null;
      S.ref[p[1]] = mergeDoc(path, S.ref[p[1]], theirs);
      if (p[1] === 'dog') { if (keepVault) S.ref.dog.vault = keepVault; else delete S.ref.dog.vault; }
      n++;
    } else if (p[0] === 'months') {
      const keepV = (S.months[p[1]] || {}).sessionsVault;
      S.months[p[1]] = mergeDoc(path, S.months[p[1]] || blankMonth(), theirs);
      if (keepV) S.months[p[1]].sessionsVault = keepV; else delete S.months[p[1]].sessionsVault;
      n++;
    } else if (p[0] === 'weeks') {
      const mineDoc = { weeks: S.weeks[p[1]] || {} };
      const merged = mergeDoc(path, mineDoc, theirs);
      /* per-week: newer wins, and the two record lists inside merge properly */
      const outW = merged.weeks || {};
      Object.keys((theirs.weeks) || {}).forEach(wk => {
        const a = (mineDoc.weeks || {})[wk], b = theirs.weeks[wk];
        if (!a) { outW[wk] = clone(b); return; }
        const win = ((b.u || 0) > (a.u || 0)) ? clone(b) : clone(a);
        const mergeSmall = (x, y) => { const m = byId(x); (y || []).forEach(r => { if (r && r.id && (!m[r.id] || (r.u||0) > (m[r.id].u||0))) m[r.id] = r; });
          return Object.values(m).sort((p1,p2) => String(p1.id).localeCompare(String(p2.id))); };
        win.priorities = mergeSmall(a.priorities, b.priorities);
        win.shop = mergeSmall(a.shop, b.shop);
        win.u = Math.max(a.u || 0, b.u || 0);
        outW[wk] = win;
      });
      S.weeks[p[1]] = outW; n++;
    }
  });
  return n;
}
</script>

<script>
/* ---------- transport: one file in your own private repository ---------- */
const SYNC_DEF = { owner:'', repo:'six-threads-data', path:'six-threads.json', token:'', auto:true, last:'', sha:'' };
const syncCfg = () => Object.assign({}, SYNC_DEF, (S.ref.settings || {}).sync || {});
function saveSyncCfg(patch){ S.ref.settings.sync = Object.assign(syncCfg(), patch); saveRef('settings'); }
const ghUrl = c => `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path}`;
const ghHead = c => ({ Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
const b64eStr = t => b64e(new TextEncoder().encode(t));
function ghErr(code){
  return ({ 401:'GitHub rejected the token. It may have expired — generate a new one.',
            403:'The token exists but is not allowed to write to that repository. Check it has Contents: Read and write, for this repo.',
            404:'No such repository, or the token cannot see it. Check the owner and repository names.',
            409:'Someone else wrote first — retrying.',
            422:'GitHub refused the write. Usually a stale copy; try again.' })[code]
    || ('GitHub returned ' + code + '. Try again shortly.');
}
async function ghGet(c){
  const res = await fetch(ghUrl(c), { headers: ghHead(c), cache:'no-store' });
  if (res.status === 404) return { found:false };
  if (!res.ok) throw new Error(ghErr(res.status));
  const j = await res.json();
  return { found:true, sha:j.sha, text:new TextDecoder().decode(b64d(String(j.content).replace(/\s/g,''))) };
}
async function ghPut(c, text, sha){
  const res = await fetch(ghUrl(c), { method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, ghHead(c)),
    body: JSON.stringify({ message: 'six-threads ' + new Date().toISOString(), content: b64eStr(text), sha: sha || undefined }) });
  if (res.status === 409 || res.status === 422) return { conflict:true };
  if (!res.ok) throw new Error(ghErr(res.status));
  const j = await res.json();
  return { sha: (j.content || {}).sha };
}

/* ---------- the sync itself ---------- */
const SYNC = { busy:false, state:'idle', msg:'', at:null };
function syncState(s, msg){ SYNC.state = s; SYNC.msg = msg || ''; if (s === 'ok') SYNC.at = new Date(); }

async function readRemote(c){
  const r = await ghGet(c);
  if (!r.found) return { none:true, sha:null };
  let box; try { box = JSON.parse(r.text); } catch (e) { throw new Error('The file in that repository is not readable as sync data.'); }
  if (!box || !box.enc) return { bundle:box && box.docs ? box : null, sha:r.sha, plain:true };
  return { box, sha:r.sha };
}
/* second device: adopt the salt the remote was built with, then verify the passphrase */
async function adoptRemote(pass, box){
  const key = await deriveKey(pass, box.salt, box.iter || 250000);
  const got = await decJSON(key, box);        /* throws if the passphrase is wrong */
  SEC.salt = box.salt; SEC.iter = box.iter || 250000; SEC.key = key;
  SEC.on = true; SEC.locked = false; SEC.skipped = false;
  return got;
}
async function syncNow(silent){
  const c = syncCfg();
  if (!c.owner || !c.token) { syncState('err', 'Add your GitHub details first.'); if (!silent) render(); return false; }
  if (!SEC.avail) { syncState('err', 'This browser will not do encryption here, so sync is disabled.'); return false; }
  if (!SEC.on || !SEC.key) { syncState('err', 'Set your passphrase first — everything is encrypted before it leaves this device.'); if (!silent) render(); return false; }
  if (SYNC.busy) return false;
  SYNC.busy = true; syncState('busy', 'Syncing…'); if (!silent) render();
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const r = await readRemote(c);
      if (r.box) {
        if (r.box.salt !== SEC.salt) { throw new Error('The stored data was encrypted with a different passphrase. Use Connect to enter it.'); }
        const theirs = await decJSON(SEC.key, r.box);
        stampAll(); absorb(theirs);
      }
      stampAll();
      const payload = Object.assign({ app:'six-threads', enc:1, v:2, salt:SEC.salt, iter:SEC.iter, at:new Date().toISOString() },
        await encJSON(SEC.key, bundle()));
      const put = await ghPut(c, JSON.stringify(payload), r.sha);
      if (put.conflict) continue;                       /* the other device wrote first: pull, merge, retry */
      saveSyncCfg({ sha: put.sha, last: new Date().toISOString() });
      Object.keys(REFS).forEach(saveRef); monthKeys().forEach(saveMonth);
      Object.keys(S.weeks).forEach(y => save('weeks/' + y));
      writeLocal();
      syncState('ok', 'Up to date'); SYNC.busy = false;
      if (!silent) render();
      return true;
    }
    throw new Error('Kept clashing with the other device. Try again in a moment.');
  } catch (e) {
    SYNC.busy = false;
    syncState('err', (e && e.message) || 'Sync failed.');
    if (!silent) render();
    return false;
  }
}
/* quiet background sync: after you stop changing things, and when you come back to the tab */
let autoT = null;
function scheduleSync(){
  const c = syncCfg(); if (!c.auto || !c.owner || !c.token || !SEC.key) return;
  clearTimeout(autoT); autoT = setTimeout(() => syncNow(true).then(() => { if (S.view === 'privacy') render(); }), 20000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { const c = syncCfg();
    if (c.auto && c.owner && c.token && SEC.key) syncNow(true).then(ok => { if (ok) render(); }); }
});
window.addEventListener('online', () => scheduleSync());

/* ---------- the sync screen ---------- */
function syncCard(){
  const c = syncCfg(), on = !!(c.owner && c.token);
  const colour = { ok:'var(--ok)', busy:'var(--a-work)', err:'var(--bad)', idle:'var(--faint)' }[SYNC.state];
  return `<div class="card" style="--c:${on ? colour : 'var(--faint)'};margin-bottom:16px">
    <div class="spread" style="align-items:flex-start;margin-bottom:4px">
      <div><h3>Sync between your devices</h3>
        <div class="note" style="margin-bottom:0;max-width:66ch">Your whole app is encrypted with your passphrase and kept as one file in your own private GitHub repository. GitHub stores a blob it has no key for. Both devices merge record by record, so an evening logged on your phone is never overwritten by your laptop.</div></div>
      <span class="chip" style="--c:${on ? colour : 'var(--faint)'};--cbg:var(--raise)">${on ? esc(SYNC.state === 'idle' ? 'connected' : SYNC.state === 'ok' ? 'up to date' : SYNC.state) : 'not set up'}</span>
    </div>
    ${SYNC.msg ? `<div class="${SYNC.state === 'err' ? 'warn' : 'tiny dim'}" style="margin:10px 0">${esc(SYNC.msg)}</div>` : ''}
    ${!SEC.on ? `<div class="warn" style="margin:10px 0">Set a passphrase first. Sync is always encrypted — there is no unencrypted option, deliberately.</div>` : ''}
    <div class="row" style="gap:10px;margin-top:12px">
      <label class="f"><span>GitHub username</span><input type="text" value="${esc(c.owner)}" data-sync="owner" placeholder="your-username"></label>
      <label class="f"><span>Private data repository</span><input type="text" value="${esc(c.repo)}" data-sync="repo" placeholder="six-threads-data"></label>
    </div>
    <label class="f" style="margin-top:10px"><span>Access token</span>
      <input type="password" value="${esc(c.token)}" data-sync="token" placeholder="github_pat_…" autocomplete="off"></label>
    <div class="tiny dim" style="margin-top:5px">Stored only in this browser. Paste it once per device; never send it to anyone, including me.</div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <label class="row" style="gap:8px;font-size:13px"><input type="checkbox" ${c.auto ? 'checked' : ''} data-sync="auto"><span>Sync automatically in the background</span></label>
      <div class="row">
        <button class="btn ghost sm" data-act="syncconnect">Connect this device</button>
        <button class="btn" data-act="syncnow" ${SYNC.busy ? 'disabled style="opacity:.5"' : ''}>Sync now</button></div>
    </div>
    ${c.last ? `<div class="tiny dim" style="margin-top:10px">Last synced ${esc(new Date(c.last).toLocaleString('en-ZA'))}</div>` : ''}
  </div>`;
}

Object.assign(ACT, {
  async syncnow(){ await syncNow(false); },
  syncconnect(){
    const c = syncCfg();
    if (!c.owner || !c.token) { toast('Fill in your username and token first.'); return; }
    syncState('busy', 'Looking for your data…'); render();
    readRemote(c).then(r => {
      if (r.none || r.plain) {
        if (!SEC.on) { syncState('err', 'Nothing stored there yet. Set a passphrase, then press Sync now to upload this device as the first copy.'); render(); return; }
        syncState('idle', 'Nothing stored there yet — press Sync now to upload this device as the first copy.'); render(); return;
      }
      openForm('Passphrase for the stored data', [
        { k:'p', label:'The passphrase you used on your other device', type:'text' }
      ], async v => {
        try {
          const got = await adoptRemote(v.p, r.box);
          absorb(got); migrateClients(); applyCustomFoods();
          Object.keys(REFS).forEach(saveRef); monthKeys().forEach(saveMonth);
          Object.keys(S.weeks).forEach(y => save('weeks/' + y));
          saveSyncCfg({ sha:r.sha, last:new Date().toISOString() });
          syncState('ok', 'Connected — this device now matches the other one.');
          render(); toast('Connected.');
        } catch (e) { syncState('err', 'That passphrase does not open the stored data.'); render(); }
      }, { ok:'Connect' });
    }).catch(e => { syncState('err', e.message || 'Could not reach GitHub.'); render(); });
  }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-sync]'); if (!el || el.type === 'checkbox') return;
  clearTimeout(el._t); el._t = setTimeout(() => saveSyncCfg({ [el.dataset.sync]: el.value.trim() }), 300);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-sync]'); if (!el || el.type !== 'checkbox') return;
  saveSyncCfg({ [el.dataset.sync]: el.checked }); render();
});
</script>

<script>
/* Register the service worker so the app installs on your phone. Skipped
   inside the Claude viewer (it runs framed, where registration is refused)
   and when opened as a local file. */
(function pwa(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  if (window.claude) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
})();
</script>
